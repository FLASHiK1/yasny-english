d:[["A","I have a dog. His name is Rex.","У меня есть собака. Его зовут Рекс."],["B","Cool! My sister has a cat.","Круто! А у моей сестры есть кошка."],["A","We have a garden, so the dog is happy.","У нас есть сад, поэтому собака довольна."],["B","Nice!","Здорово!"]],
tr:[{ru:"У меня есть собака.",en:["I have a dog.","I have got a dog."]},{ru:"У неё есть машина.",en:["She has a car.","She has got a car."]},{ru:"У нас большой дом.",en:["We have a big house.","We have got a big house."]}]},

{t:"Мой день",g:"Рассказать, что ты делаешь каждый день",
w:["get up","work","eat","drink","sleep",["every day","каждый день","/ˈevri deɪ/","I read every day.","Я читаю каждый день."]],
r:`<p><b>Present Simple</b> — о том, что происходит регулярно. С I / you / we / they глагол в начальной форме: <i>I work. We eat. They sleep.</i></p><p>Подсказки: every day, in the morning, at night.</p>`,
rx:[{type:"fill",q:"I ___ (get up) at seven.",a:["get up"],why:"I + глагол в начальной форме."},{type:"fill",q:"We ___ (eat) breakfast at eight.",a:["eat"],why:"We + глагол без изменений."},{type:"choice",q:"«Я работаю каждый день» —",o:["I work every day.","I working every day.","I am work every day."],a:"I work every day.",why:"Привычка → Present Simple: I work."}],
d:[["A","What time do you get up?","Во сколько ты встаёшь?"],["B","I get up at seven every day.","Я встаю в семь каждый день."],["A","What do you eat for breakfast?","А что ты ешь на завтрак?"],["B","I eat eggs and drink coffee.","Ем яйца и пью кофе."]],
tr:[{ru:"Я встаю в семь.",en:["I get up at [seven|7]."]},{ru:"Я пью чай каждый день.",en:["I drink tea every day.","Every day I drink tea."]},{ru:"Мы работаем в офисе.",en:["We work in an office."]}]},

{t:"Он работает: окончание -s",g:"Рассказать о дне другого человека",
w:["live","like",["watch","смотреть (ТВ, фильм)","/wɒtʃ/","He watches TV every evening.","Он каждый вечер смотрит телевизор."],["bank","банк","/bæŋk/","My father works in a bank.","Мой папа работает в банке."],["office","офис","/ˈɒfɪs/","I work in an office.","Я работаю в офисе."],["evening","вечер","/ˈiːvnɪŋ/","I read in the evening.","Я читаю вечером."]],
r:`<p>С <b>he / she / it</b> к глаголу добавляется <b>-s</b>: <i>She works. He lives.</i></p><p>После s, sh, ch, x, o — <b>-es</b>: watch → watches, go → goes. have → <b>has</b>.</p>`,
rx:[{type:"fill",q:"She ___ (work) in a bank.",a:["works"],why:"She → -s."},{type:"fill",q:"He ___ (watch) TV every evening.",a:["watches"],why:"После ch → -es."},{type:"fill",q:"My brother ___ (go) to school.",a:["goes"],why:"My brother = he; go → goes."}],
d:[["A","Where does your sister work?","Где работает твоя сестра?"],["B","She works in a bank.","Она работает в банке."],["A","And your brother?","А брат?"],["B","He lives in London. He works in an office.","Он живёт в Лондоне и работает в офисе."]],
tr:[{ru:"Она работает в банке.",en:["She works [in|at] a bank."]},{ru:"Он живёт в Лондоне.",en:["He lives in London."]},{ru:"Мой папа смотрит телевизор вечером.",en:["My [father|dad] watches TV in the evening.","In the evening my [father|dad] watches TV."]}]},

{t:"Вопросы: Do и Does",g:"Задавать вопросы о привычках",
w:[["do","вспомогательное слово для вопросов; делать","/duː/","Do you like tea?","Ты любишь чай?"],["does","то же для he / she / it","/dʌz/","Does she speak English?","Она говорит по-английски?"],"speak",["English","английский язык","/ˈɪŋɡlɪʃ/","I speak a little English.","Я немного говорю по-английски."],["coffee","кофе","/ˈkɒfi/","Do you want coffee?","Хочешь кофе?"]],
r:`<p>Вопрос в Present Simple: <b>Do</b> + I / you / we / they + глагол — <i>Do you like coffee?</i></p><p>С he / she / it — <b>Does</b>, а -s у глагола исчезает: <i>Does she like coffee?</i> (не <i>likes</i>).</p><p>Короткий ответ: <b>Yes, I do. / No, I don't.</b></p>`,
rx:[{type:"choice",q:"___ you speak English?",o:["Do","Does","Are"],a:"Do",why:"You → Do."},{type:"choice",q:"___ he like football?",o:["Does","Do","Is"],a:"Does",why:"He → Does."},{type:"choice",q:"Как правильно?",o:["Does she like tea?","Does she likes tea?","Do she like tea?"],a:"Does she like tea?",why:"После does глагол без -s."}],
d:[["A","Do you speak English?","Ты говоришь по-английски?"],["B","Yes, a little. Do you speak Russian?","Да, немного. А ты по-русски?"],["A","No, I don't. But my wife does.","Нет. А моя жена говорит."],["B","Does she like Russia?","Ей нравится Россия?"],["A","Yes, she does!","Да!"]],
tr:[{ru:"Ты говоришь по-английски?",en:["Do you speak English?"]},{ru:"Она любит кофе?",en:["Does she [like|love] coffee?"]},{ru:"Да, люблю.",en:["Yes, I do."]}]},

{t:"Не и как часто",g:"Отрицание и слова always, usually, never",
w:["always","usually","often","sometimes","never",["don't","не (в Present Simple)","/dəʊnt/","I don't eat meat.","Я не ем мясо."]],
r:`<p>Отрицание: <b>don't</b> (do not) + глагол; с he / she / it — <b>doesn't</b>: <i>I don't smoke. She doesn't eat meat.</i></p><p>Как часто: always (всегда), usually (обычно), often (часто), sometimes (иногда), never (никогда). Они стоят <b>перед глаголом</b>: <i>I usually walk.</i> Но после am / is / are: <i>I'm always late.</i></p><p>С never don't не нужен: <i>I never drink coffee.</i></p>`,
rx:[{type:"fill",q:"I ___ (not / like) fish.",a:["don't like","do not like"],why:"I → don't + глагол."},{type:"fill",q:"He ___ (not / work) on Sunday.",a:["doesn't work","does not work"],why:"He → doesn't, глагол без -s."},{type:"choice",q:"Как правильно?",o:["I usually get up at seven.","I get up usually at seven.","I get usually up at seven."],a:"I usually get up at seven.",why:"Usually стоит перед глаголом."}],
d:[["A","Do you drink coffee in the morning?","Ты пьёшь кофе по утрам?"],["B","No, I never drink coffee. I usually drink tea.","Нет, никогда. Обычно пью чай."],["A","My husband doesn't drink tea.","А мой муж не пьёт чай."],["B","Really? What does he drink?","Правда? А что он пьёт?"],["A","Water!","Воду!"]],
tr:[{ru:"Я не люблю рыбу.",en:["I [don't|do not] like fish."]},{ru:"Она никогда не опаздывает.",en:["She is never late."]},{ru:"Я обычно хожу на работу пешком.",en:["I usually walk to work.","I usually go to work on foot."]}]},

{t:"Который час?",g:"Говорить о времени",
w:[["o'clock","(ровно) … часов","/əˈklɒk/","It's three o'clock.","Три часа."],["half past","половина (после часа)","/hɑːf pɑːst/","It's half past seven.","Половина восьмого."],"morning",["afternoon","день (после полудня)","/ˌɑːftəˈnuːn/","See you in the afternoon.","Увидимся днём."],"evening",["time","время","/taɪm/","What time is it?","Который час?"]],
r:`<p><b>What time is it?</b> — Который час? <b>It's seven o'clock.</b> — Семь часов.</p><p><b>half past seven</b> — половина восьмого (буквально «половина после семи»). <b>quarter past</b> — четверть после, <b>quarter to</b> — без четверти.</p><p>«В семь часов» — <b>at</b> seven. Утром — <b>in the morning</b>, днём — in the afternoon, вечером — in the evening, ночью — <b>at night</b>.</p>`,
rx:[{type:"choice",q:"«Половина девятого» —",o:["half past eight","half past nine","half to nine"],a:"half past eight",why:"Половина после восьми = половина девятого."},{type:"choice",q:"I get up ___ 7 o'clock.",o:["at","in","on"],a:"at",why:"Точное время → at."},{type:"choice",q:"«Вечером» —",o:["in the evening","at the evening","on the evening"],a:"in the evening",why:"Части дня → in the."}],
d:[["A","Excuse me, what time is it?","Извините, который час?"],["B","It's half past three.","Половина четвёртого."],["A","Thank you! My train is at four o'clock.","Спасибо! У меня поезд в четыре."],["B","You have time.","Вы успеваете."]],
tr:[{ru:"Который час?",en:["What time is it?"]},{ru:"Сейчас три часа.",en:["It is three o'clock.","It is 3 o'clock.","It is three."]},{ru:"Я работаю утром.",en:["I work in the morning."]}]},

{t:"Дни недели",g:"Договориться о дне встречи",
w:[["Monday","понедельник","/ˈmʌndeɪ/","I work on Monday.","Я работаю в понедельник."],["Friday","пятница","/ˈfraɪdeɪ/","See you on Friday!","Увидимся в пятницу!"],["Saturday","суббота","/ˈsætədeɪ/","On Saturday we go to the park.","В субботу мы ходим в парк."],["Sunday","воскресенье","/ˈsʌndeɪ/","I don't work on Sunday.","В воскресенье я не работаю."],"weekend","week"],
r:`<p>Дни недели всегда пишутся с большой буквы:</p>${sayRow(["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"])}<p>«В понедельник» — <b>on</b> Monday. «По понедельникам» — <b>on Mondays</b>. «На выходных» — <b>at the weekend</b> (брит.) или on the weekend (амер.).</p>`,
rx:[{type:"choice",q:"«В пятницу» —",o:["on Friday","in Friday","at Friday"],a:"on Friday",why:"Дни недели → on."},{type:"audio",say:"Wednesday",o:["Wednesday","Tuesday","Thursday"],a:"Wednesday",why:"Wednesday — среда, первая d не читается."},{type:"choice",q:"Как правильно?",o:["I don't work on Sunday.","I don't work in sunday.","I don't work at Sunday."],a:"I don't work on Sunday.",why:"on + день с большой буквы."}],
d:[["A","Are you free on Saturday?","Ты свободен в субботу?"],["B","No, I work on Saturday. But I'm free on Sunday.","Нет, в субботу работаю. Но в воскресенье свободен."],["A","Great! Let's go to the park on Sunday.","Отлично! Пойдём в парк в воскресенье."],["B","OK, see you on Sunday!","Хорошо, до воскресенья!"]],
tr:[{ru:"Увидимся в пятницу!",en:["See you on Friday!"]},{ru:"Я не работаю в воскресенье.",en:["I [don't|do not] work on [Sunday|Sundays]."]},{ru:"Что ты делаешь на выходных?",en:["What do you do [at|on] the weekend?","What do you do on weekends?","What are you doing [at|on] the weekend?"]}]},

{t:"Еда",g:"Рассказать, что ты ешь",
w:["breakfast",["lunch","обед","/lʌntʃ/","We have lunch at one.","Мы обедаем в час."],"dinner",["egg","яйцо","/eɡ/","I eat two eggs for breakfast.","На завтрак я ем два яйца."],["apple","яблоко","/ˈæpl/","I eat an apple every day.","Я съедаю яблоко каждый день."],["cheese","сыр","/tʃiːz/","I like bread and cheese.","Я люблю хлеб с сыром."]],
r:`<p>«Завтракать» — <b>have breakfast</b>, обедать — <b>have lunch</b>, ужинать — <b>have dinner</b>. Артикль не нужен.</p><p>«На завтрак» — <b>for breakfast</b>: <i>I eat eggs for breakfast.</i></p><p>Неисчисляемое (bread, cheese, water) — без a и без -s: <i>some bread</i>, а не <i>a bread</i>.</p>`,
rx:[{type:"choice",q:"«Я завтракаю в 8» —",o:["I have breakfast at 8.","I have a breakfast at 8.","I breakfast at 8."],a:"I have breakfast at 8.",why:"have breakfast, без артикля."},{type:"choice",q:"What do you eat ___ lunch?",o:["for","on","in"],a:"for",why:"«На обед» → for lunch."},{type:"choice",q:"Как правильно?",o:["I want some bread.","I want a bread.","I want breads."],a:"I want some bread.",why:"Bread неисчисляемое → some bread."}],
d:[["A","What do you have for breakfast?","Что ты ешь на завтрак?"],["B","I usually have eggs and cheese.","Обычно яйца и сыр."],["A","And for lunch?","А на обед?"],["B","Soup and an apple. And you?","Суп и яблоко. А ты?"],["A","I never have breakfast!","А я вообще не завтракаю!"]],
tr:[{ru:"Я завтракаю в восемь.",en:["I have breakfast at [eight|8]."]},{ru:"Я люблю яблоки.",en:["I [like|love] apples."]},{ru:"Что на ужин?",en:["What is for dinner?","What's for dinner?"]}]},

{t:"В кафе",g:"Заказать и спросить цену",
w:["menu",["can I have","можно мне…","/kæn aɪ hæv/","Can I have a coffee, please?","Можно мне кофе, пожалуйста?"],["how much","сколько (стоит)","/haʊ mʌtʃ/","How much is it?","Сколько это стоит?"],"bill",["cup","чашка","/kʌp/","A cup of tea, please.","Чашку чая, пожалуйста."],["sugar","сахар","/ˈʃʊɡə/","Tea with sugar, please.","Чай с сахаром, пожалуйста."]],
r:`<p>Вежливая просьба: <b>Can I have …, please?</b> или <b>I'd like …</b> (I would like — «я бы хотел»). Без please по-английски звучит грубо.</p><p>Цена: <b>How much is it?</b> — Сколько стоит? <b>It's five pounds.</b></p>`,
rx:[{type:"choice",q:"Вежливо попросить кофе:",o:["Can I have a coffee, please?","Give me coffee.","I want coffee now."],a:"Can I have a coffee, please?",why:"Can I have…, please? — вежливо."},{type:"fill",q:"How ___ is it?",a:["much"],why:"How much — сколько стоит."},{type:"choice",q:"«Я бы хотел чай» —",o:["I'd like a tea.","I like a tea.","I'd liking a tea."],a:"I'd like a tea.",why:"I'd like = I would like."}],
d:[["A","Hello! What would you like?","Здравствуйте! Что желаете?"],["B","Can I have a cup of tea, please?","Можно чашку чая, пожалуйста?"],["A","With sugar?","С сахаром?"],["B","No, thank you. How much is it?","Нет, спасибо. Сколько с меня?"],["A","Two pounds, please.","Два фунта, пожалуйста."]],
tr:[{ru:"Можно мне кофе, пожалуйста?",en:["[Can|Could|May] I have [a |]coffee, please?","I would like [a |]coffee, please."]},{ru:"Сколько это стоит?",en:["How much is it?","How much is this?","How much does it cost?"]},{ru:"Счёт, пожалуйста.",en:["The bill, please.","Can I have the bill, please?","The check, please."]}]},

{t:"Где? Предлоги места",g:"Сказать, где что находится",
w:[["in","в (внутри)","/ɪn/","The keys are in my bag.","Ключи в моей сумке."],["on","на (поверхности)","/ɒn/","The phone is on the table.","Телефон на столе."],["under","под","/ˈʌndə/","The cat is under the bed.","Кошка под кроватью."],["next to","рядом с","/nekst tə/","The bank is next to the shop.","Банк рядом с магазином."],["between","между","/bɪˈtwiːn/","The café is between the bank and the park.","Кафе между банком и парком."],"table"],
r:`<div class="tbl"><table><tr><td><b>in</b></td><td>в, внутри</td><td class="ex">in the bag</td></tr><tr><td><b>on</b></td><td>на (поверхности)</td><td class="ex">on the table</td></tr><tr><td><b>under</b></td><td>под</td><td class="ex">under the bed</td></tr><tr><td><b>next to</b></td><td>рядом с</td><td class="ex">next to the bank</td></tr><tr><td><b>between</b></td><td>между</td><td class="ex">between A and B</td></tr><tr><td><b>behind</b></td><td>за, позади</td><td class="ex">behind the door</td></tr></table></div><p>Перед конкретным предметом обычно ставится <b>the</b>.</p>`,
rx:[{type:"choice",q:"«Телефон на столе» —",o:["The phone is on the table.","The phone is in the table.","The phone is under table."],a:"The phone is on the table.",why:"На поверхности → on."},{type:"choice",q:"The cat is ___ the bed. (под)",o:["under","on","in"],a:"under",why:"Под → under."},{type:"choice",q:"«Ключи в сумке» —",o:["The keys are in the bag.","The keys is in the bag.","The keys are on the bag."],a:"The keys are in the bag.",why:"Keys — много → are; внутри → in."}],
d:[["A","Where are my keys?","Где мои ключи?"],["B","They're on the table, next to your phone.","На столе, рядом с телефоном."],["A","No, they aren't.","Нет, там их нет."],["B","Look in your bag!","Посмотри в сумке!"],["A","Oh, yes! Thank you.","О, точно! Спасибо."]],
tr:[{ru:"Кошка под столом.",en:["The cat is under the table."]},{ru:"Мои ключи в сумке.",en:["My keys are in [my|the] bag."]},{ru:"Банк рядом с парком.",en:["The bank is next to the park."]}]},

{t:"There is, there are",g:"Описать комнату и квартиру",
w:["room","kitchen","window",["bed","кровать","/bed/","There is a big bed in the room.","В комнате большая кровать."],["sofa","диван","/ˈsəʊfə/","The cat is on the sofa.","Кошка на диване."],"flat"],
r:`<p>«В комнате есть кровать» — <b>There is a bed in the room.</b> Начинаем с there is / there are, а место ставим в конец.</p><p>Несколько предметов — <b>there are</b>: <i>There are two windows.</i> Вопрос: <b>Is there…? Are there…?</b></p>`,
rx:[{type:"fill",q:"There ___ a sofa in the room.",a:["is","'s"],why:"Один предмет → there is."},{type:"fill",q:"There ___ two beds.",a:["are"],why:"Два предмета → there are."},{type:"choice",q:"«На кухне есть окно?» —",o:["Is there a window in the kitchen?","There is a window in the kitchen?","Is a window in the kitchen?"],a:"Is there a window in the kitchen?",why:"Вопрос: Is there…?"}],
d:[["A","Tell me about your flat.","Расскажи о своей квартире."],["B","There are two rooms and a small kitchen.","Там две комнаты и маленькая кухня."],["A","Is there a balcony?","Балкон есть?"],["B","Yes, there is. There is a sofa on the balcony!","Есть. На балконе даже стоит диван!"]],
tr:[{ru:"В комнате есть диван.",en:["There is a sofa in the room."]},{ru:"В квартире две комнаты.",en:["There are two rooms in the [flat|apartment].","The [flat|apartment] has two rooms."]},{ru:"Здесь есть кафе?",en:["Is there a [cafe|café] here?"]}]},

{t:"В городе",g:"Спросить дорогу и объяснить, как пройти",
w:["street","shop",["station","вокзал, станция","/ˈsteɪʃn/","Where is the station?","Где вокзал?"],["park","парк","/pɑːk/","Let's go to the park.","Пойдём в парк."],["left","налево, левый","/left/","Turn left.","Поверните налево."],["right","направо, правый","/raɪt/","The bank is on the right.","Банк справа."]],
r:`<p>Спросить дорогу: <b>Excuse me, where is the station?</b></p><p>Ответы: <b>Go straight</b> — идите прямо; <b>turn left / turn right</b> — поверните налево / направо; <b>it's on the left</b> — слева; <b>it's next to the bank</b> — рядом с банком.</p>`,
rx:[{type:"choice",q:"«Поверните направо» —",o:["Turn right.","Turn left.","Go right turn."],a:"Turn right.",why:"right — направо."},{type:"choice",q:"Вежливо спросить дорогу:",o:["Excuse me, where is the station?","Where station?","Tell me station!"],a:"Excuse me, where is the station?",why:"Excuse me… — вежливое начало."},{type:"choice",q:"«Слева» —",o:["on the left","in the left","at left"],a:"on the left",why:"Устойчиво: on the left / on the right."}],
d:[["A","Excuse me, where is the station?","Извините, где вокзал?"],["B","Go straight and turn left.","Идите прямо и поверните налево."],["A","Is it far?","Это далеко?"],["B","No, it's near. It's next to the park.","Нет, близко. Рядом с парком."],["A","Thank you very much!","Большое спасибо!"]],
tr:[{ru:"Извините, где вокзал?",en:["Excuse me, where is the station?"]},{ru:"Поверните налево.",en:["Turn left."]},{ru:"Магазин справа.",en:["The shop is on the right."]}]},

let CL=null;
function courseDone(n){return !!(S.course||{})[n]}
function courseNext(){return COURSE.find(L=>!courseDone(L.n))||null}
function courseUnlocked(n){return n===1||courseDone(n-1)||li(T())>=2||courseDone(n)}
function courseTodayCard(){
  const nx=courseNext();if(!nx)return"";
  const doneN=Object.keys(S.course||{}).length;
  if(li(T())>1&&!doneN)return"";
  const today=Object.values(S.course||{}).some(c=>c.date===dkey());
  return `<section class="sheet coursecta"><div style="min-width:0"><div class="label">Курс с нуля · ${doneN} из ${COURSE.length}</div><h2 style="margin:6px 0 4px">Урок ${nx.n}: ${esc(nx.t)}</h2><p class="small muted" style="margin:0">${esc(nx.g)}. ${today?"Сегодняшний урок уже пройден — следующий лучше завтра, но можно и сейчас.":"15–20 минут."}</p></div><a class="btn ${today?"":"primary"}" href="#course" data-open="${nx.n}">${doneN?"Продолжить":"Начать курс"}</a></section>`;
}
function courseScreens(L){
  const words=L.ids.map(wordById).filter(Boolean),sc=[{type:"words"}];
  const pool=allWords().filter(x=>li(x.lvl)<=1&&!x.custom);
  shuffle(words).forEach(w=>sc.push({type:"choice",say:w.en,q:"Что значит «"+w.en+"»?",o:shuffle([w.ru].concat(shuffle(pool.filter(x=>x.ru!==w.ru&&x.id!==w.id)).slice(0,2).map(x=>x.ru))),a:w.ru,wid:w.id}));
  shuffle(words).slice(0,2).forEach(w=>sc.push({type:"type",q:w.ru,a:[w.en],say:w.en,wid:w.id}));
  sc.push({type:"rule"});
  L.rx.forEach(e=>sc.push(Object.assign({},e)));
  sc.push({type:"dialog"});
  const lines=L.d.map(x=>x[1]);
  shuffle(lines).slice(0,2).forEach(l=>sc.push({type:"audio",say:l,o:shuffle([l].concat(shuffle(lines.filter(x=>x!==l)).slice(0,2))),a:l}));
  const short=shuffle(L.d.filter(x=>x[1].split(" ").length<=8))[0];
  if(short)sc.push({type:"tiles",ru:short[2],en:[short[1]]});
  L.tr.forEach(t=>sc.push({type:L.n<=15?"tiles":"type",ru:t.ru,en:t.en}));
  sc.push({type:"end"});

}
function openCourseLesson(n){const L=COURSE[n-1];CL={active:true,L,sc:courseScreens(L),i:0,res:null,right:0,total:0,tiles:null};renderCL()}
function clTaskData(e){const d={type:e.type};["q","o","a","say","ru","en","why"].forEach(k=>{if(e[k]!==undefined)d[k]=e[k]});return d}
function answerCL(v){
  const e=CL.sc[CL.i],L=CL.L;let ok=false,typo=false,best=null,cres=null;
  if(e.type==="choice"||e.type==="audio")ok=v===e.a;
  else if(e.type==="fill"){if(v){cres=check(v,e.a);ok=cres.status!=="bad";typo=cres.status==="typo"}}
  else{const vars=e.en?e.en.flatMap(expand):e.a;if(v){cres=check(v,vars,true);ok=cres.status!=="bad";typo=cres.status==="typo";best=cres.best}else best=vars[0]}
  CL.res={ok,typo,user:v,best,cres};CL.total++;if(ok)CL.right++;
  if(e.wid)mistake("word",e.wid,ok,v,{t:"vocab",l:L.lvl});
  else mistake("course",L.n+":"+hashStr(JSON.stringify(clTaskData(e))),ok,v,{t:"course",l:L.lvl,data:clTaskData(e)});
  bump(ok,L.lvl);renderCL();
  if(e.type==="type"&&e.say)speak(e.say);
}

  L.ids.forEach(id=>{if(!S.cards[id]&&wordById(id))S.cards[id]=schedule(null,1)});

  if(S.level==="A0"&&L.n===15){S.level="A1";S.levelSrc="auto";celeb=true;setTimeout(()=>celebrateLevel("A0","A1"),600)}

    CL=null;location.hash="#practice";setTimeout(chatCall,50)});

  if(e.type==="tiles"&&!r){

      tl.innerHTML=P.pick.length?P.pick.map((pi,k)=>`<button class="tile" data-k="${k}">${esc(P.pool[pi].w)}</button>`).join(""):'<span class="muted small">Нажимай на слова ниже по порядку</span>';

/* ---------- МИКРОФОН (в приложении для телефона) ---------- */
const ICON_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
const MIC={on:false,cb:null};
function micAvail(){return !!(window.NativeApp&&window.NativeApp.speech)}
function micErr(e){return{permission:"Нет доступа к микрофону. Разреши его в настройках телефона.",nomatch:"Не расслышал. Скажи ещё раз, чуть громче и ближе к телефону.",unavailable:"Распознавание речи недоступно на этом устройстве.",network:"Для распознавания речи нужен интернет."}[e]||"Не удалось распознать речь. Попробуй ещё раз."}
function micUI(){document.querySelectorAll("[data-mic],.micbig").forEach(b=>b.classList.toggle("rec",MIC.on));try{budReact(MIC.on?"listen":"unlisten")}catch(e){}}
function micListen(cb){
  if(!micAvail())return;
  if(MIC.on){window.NativeApp.speech.stop();return}
  MIC.cb=cb;MIC.on=true;micUI();
  try{speechSynthesis.cancel()}catch(e){}
  window.NativeApp.speech.start(S.settings.voice||"en-US");
}
if(window.NativeApp){
  window.NativeApp.onSpeech=ev=>{
    if(!ev)return;
    if(ev.type==="partial"){if(MIC.cb)MIC.cb(ev.text||"",false,ev)}
    else if(ev.type==="final"){MIC.on=false;micUI();const cb=MIC.cb;MIC.cb=null;if(cb)cb(ev.text||"",true,ev)}
    else if(ev.type==="error"){MIC.on=false;micUI();const cb=MIC.cb;MIC.cb=null;toast(micErr(ev.error));if(cb)cb("",true,ev)}
  };
}
window.__nativeReminderDenied=()=>toast("Уведомления запрещены. Разреши их в настройках телефона.");
function micBtn(id){return micAvail()?`<button class="iconbtn mic${MIC.on?" rec":""}" data-mic="${id}" aria-label="Ответить голосом" title="Ответить голосом">${ICON_MIC}</button>`:""}
document.addEventListener("click",e=>{const b=e.target.closest("[data-mic]");if(!b)return;e.preventDefault();
  const el=document.getElementById(b.dataset.mic);
  micListen((t,fin)=>{if(el&&t){el.value=t;el.dispatchEvent(new Event("input",{bubbles:true}))}if(fin&&el)el.focus()})});

// Оценка произношения: какие слова образца распознались в сказанном
function scoreSpeech(target,alts){
  const ow=target.split(/\s+/).filter(Boolean);let best={score:-1,marks:[],heard:""};
  for(const a of alts){if(!a)continue;const hw=norm(a).split(" ").filter(Boolean);
    const marks=ow.map(w=>{const ts=norm(w).split(" ").filter(Boolean);return ts.length===0||ts.every(t=>hw.some(h=>h===t||(t.length>4&&lev(h,t)<=1)))});
    const sc=marks.filter(Boolean).length/Math.max(1,ow.length);if(sc>best.score)best={score:sc,marks,heard:a}}
  if(best.score<0)best={score:0,marks:ow.map(()=>false),heard:""};
  return best;
}
function scoreHTML(target,b){
  const ow=target.split(/\s+/).filter(Boolean);const pct=Math.round(b.score*100);
  return `<div class="diff">${ow.map((w,i)=>b.marks[i]?`<span class="okw">${esc(w)}</span>`:`<span class="miss">${esc(w)}</span>`).join(" ")}</div>
  <div class="verdict ${pct>=90?"ok":pct>=60?"warn":"bad"}">${pct>=90?"Отлично, тебя понятно":pct>=60?"Почти: повтори выделенные слова":"Пока непонятно. Послушай образец и попробуй ещё"} <span>· ${pct}%</span></div>
  <div class="small muted">Распознано: «${esc(b.heard||"—")}»</div>`;
}
function micCheck(target,outId){
  const out=document.getElementById(outId);
  micListen((t,fin,ev)=>{if(!out)return;
    if(!fin){out.innerHTML=`<div class="small muted">Слушаю: ${esc(t)}</div>`;return}
    if(!t&&!(ev&&ev.alts&&ev.alts.length)){out.innerHTML="";return}
    const b=scoreSpeech(target,[t].concat((ev&&ev.alts)||[]));out.innerHTML=scoreHTML(target,b);bump(b.score>=.8,null)});
}

function bindSay(){
  const s=PS.say,out=()=>document.getElementById("sayres");

on the second floor. — Thank you! Is there Wi-Fi? — Yes, the password is on the card. Have a nice stay!","q":[{"q":"Сколько ночей забронировано?","o":["Три","Две","Одна"],"a":"Три"},{"q":"Во сколько завтрак?","o":["С семи до десяти","С восьми до одиннадцати","Завтрака нет"],"a":"С семи до десяти"},{"q":"Где пароль от Wi-Fi?","o":["На карточке","У администратора","В номере на столе"],"a":"На карточке"}]}],"id":"travel-phrases","title":"Фразы для путешествий","level":"A1"},"home":{"words":[["bedroom","спальня","/ˈbedruːm/","My bedroom is small but cosy.","Моя спальня маленькая, но уютная.","A1"],["bathroom","ванная","/ˈbɑːθruːm/","The bathroom is next to the kitchen.","Ванная рядом с кухней.","A1"],["living room","гостиная","/ˈlɪvɪŋ ruːm/","We watch TV in the living room.","Мы смотрим телевизор в гостиной.","A1"],["fridge","холодильник","/frɪdʒ/","The milk is in the fridge.","Молоко в холодильнике.","A1"],["washing machine","стиральная машина","/ˈwɒʃɪŋ məˈʃiːn/","The washing machine is broken.","Стиральная машина сломалась.","A2"],["do the dishes","мыть посуду","/duː ðə ˈdɪʃɪz/","I'll do the dishes after dinner.","Я помою посуду после ужина.","A2"],["do the laundry","стирать бельё","/duː ðə ˈlɔːndri/","I do the laundry on Sundays.","Я стираю по воскресеньям.","A2"],["vacuum","пылесосить","/ˈvækjuːm/","Can you vacuum the living room?","Пропылесосишь гостиную?","A2"],["tidy up","прибраться","/ˈtaɪdi ʌp/","Let's tidy up before the guests come.","Давай приберёмся до прихода гостей.","A2"],["rubbish","мусор","/ˈrʌbɪʃ/","Please take out the rubbish.","Вынеси, пожалуйста, мусор.","A2"],["light","свет","/laɪt/","Turn off the light, please.","Выключи свет, пожалуйста.","A1"],["heating","отопление","/ˈhiːtɪŋ/","The heating doesn't work.","Отопление не работает.","A2"],["landlord","арендодатель","/ˈlændlɔːd/","Our landlord fixed the heating.","Хозяин квартиры починил отопление.","B1"]],"id":"home","title":"Дом и быт","level":"A1"},"small-talk":{"words":[["How's it going?","как дела? (разговорное)","/haʊz ɪt ˈɡəʊɪŋ/","Hi Tom! How's it going?","Привет, Том! Как дела?","A2"],["Not bad","неплохо","/nɒt bæd/","Not bad, thanks. And you?","Неплохо, спасибо. А у тебя?","A1"],["What do you do?","чем ты занимаешься? (о работе)","/wɒt duː juː duː/","So, what do you do?","Так чем ты занимаешься?","A1"],["by the way","кстати","/baɪ ðə weɪ/","By the way, have you seen the new film?","Кстати, ты видел новый фильм?","A2"],["Really?","правда?","/ˈrɪəli/","Really? That's amazing!","Правда? Это потрясающе!","A1"],["That sounds great","звучит здорово","/ðæt saʊndz ɡreɪt/","A trip to Italy? That sounds great!","Поездка в Италию? Звучит здорово!","A2"],["I see","понятно","/aɪ siː/","I see. And how long have you worked there?","Понятно. А сколько ты там работаешь?","A2"],["Nice talking to you","приятно было поговорить","/naɪs ˈtɔːkɪŋ tə juː/","I have to go. Nice talking to you!","Мне пора. Приятно было поговорить!","A2"],["Take care","береги себя, пока","/teɪk keə/","See you soon. Take care!","До скорого. Береги себя!","A2"],["What about you?","а ты?","/wɒt əˈbaʊt juː/","I love hiking. What about you?","Я люблю походы. А ты?","A1"],["It depends","смотря как, по-разному","/ɪt dɪˈpendz/","Do you like big cities? — It depends.","Ты любишь большие города? — По-разному.","A2"],["I have to go","мне пора","/aɪ hæv tə ɡəʊ/","Sorry, I have to go now.","Извини, мне пора.","A1"]],"lessons":[{"id":"pk-smalltalk","lvl":"A2","title":"Small talk: поддержать разговор","desc":"Вопросы-эхо, реакции и вежливое завершение","theory":"<p>В английском разговор поддерживают короткими <b>реакциями<\/b> и <b>встречными вопросами<\/b>. Молчание или ответ одним словом звучит холодно.<\/p><ul><li>Реакции: <i>Really? That sounds great! I see. Oh no!<\/i><\/li><li>Встречный вопрос: <i>What about you? And you?<\/i><\/li><li>Вопросы-эхо: <i>I live in Spain. — Oh, do you?<\/i> (повторяем вспомогательный глагол)<\/li><li>Завершить: <i>Anyway, I have to go. Nice talking to you!<\/i><\/li><\/ul>","ex":[{"type":"choice","q":"— I've just come back from Japan. — ___","o":["Really? How was it?","Yes.","I know."],"a":"Really? How was it?","why":"Реакция + вопрос поддерживают разговор."},{"type":"choice","q":"— I work in a bank. — Oh, ___ you?","o":["do","are","have"],"a":"do","why":"Эхо-вопрос повторяет вспомогательный глагол: I work → do you?"},{"type":"choice","q":"— I'm going to Paris next week. — Oh, ___ you?","o":["are","do","will"],"a":"are","why":"I'm going → are you?"},{"type":"choice","q":"Как вежливо закончить разговор?","o":["Anyway, I have to go. Nice talking to you!","Bye. I go.","Stop talking, please."],"a":"Anyway, I have to go. Nice talking to you!","why":"Anyway + причина + Nice talking to you — вежливо."},{"type":"choice","q":"— I love hiking. ___","o":["What about you?","What you?","And what?"],"a":"What about you?","why":"What about you? — «А ты?»"},{"type":"choice","q":"— How's it going? — ___","o":["Not bad, thanks. And you?","I'm going home.","It goes."],"a":"Not bad, thanks. And you?","why":"How's it going? — «Как дела?», а не «куда идёшь»."}]}],"texts":[{"title":"Meeting a neighbour","l":"A2","text":"Hi! You're the new neighbour, right? I'm Mike from number twelve. — Oh, hi Mike! Yes, I'm Olga. We moved in last week. — Nice to meet you, Olga. How do you like the area? — It's great. It's quiet, and the park is really close. — Oh, do you run? I run there every morning. — Really? I've just started running! — Great, we can run together sometime. Anyway, I have to go to work. Nice talking to you! — You too. Take care!","q":[{"q":"Когда Ольга переехала?","o":["На прошлой неделе","Вчера","Месяц назад"],"a":"На прошлой неделе"},{"q":"Что Ольге нравится в районе?","o":["Тишина и парк рядом","Магазины","Много кафе"],"a":"Тишина и парк рядом"},{"q":"Что предлагает Майк?","o":["Бегать вместе","Пойти в кафе","Помочь с переездом"],"a":"Бегать вместе"}]}],"id":"small-talk","title":"Small talk: как поддержать разговор","level":"A2"},"shopping":{"words":[["cash","наличные","/kæʃ/","Can I pay in cash?","Можно оплатить наличными?","A2"],["card","карта (банковская)","/kɑːd/","I'll pay by card.","Я заплачу картой.","A1"],["keep the change","сдачи не надо","/kiːp ðə tʃeɪndʒ/","Here you are. Keep the change!","Вот, сдачи не надо!","A2"],["discount","скидка","/ˈdɪskaʊnt/","Is there a discount for students?","Есть скидка для студентов?","A2"],["on sale","со скидкой","/ɒn seɪl/","These shoes are on sale.","Эти туфли со скидкой.","A2"],["size","размер","/saɪz/","What size are you?","Какой у вас размер?","A1"],["try on","примерить","/traɪ ɒn/","Can I try on this jacket?","Можно примерить эту куртку?","A2"],["fitting room","примерочная","/ˈfɪtɪŋ ruːm/","Where is the fitting room?","Где примерочная?","A2"],["refund","возврат денег","/ˈriːfʌnd/","I'd like a refund, please.","Я бы хотел вернуть деньги.","B1"],["queue","очередь","/kjuː/","There's a long queue at the checkout.","На кассе длинная очередь.","A2"],["checkout","касса","/ˈtʃekaʊt/","Please pay at the checkout.","Оплатите на кассе, пожалуйста.","A2"],["bargain","выгодная покупка","/ˈbɑːɡən/","This coat was a real bargain!","Это пальто — настоящая находка!","B1"],["save up","копить","/seɪv ʌp/","I'm saving up for a new laptop.","Я коплю на новый ноутбук.","B1"]],"texts":[{"title":"In a clothes shop","l":"A2","text":"Excuse me, can I try on this jacket? — Of course. What size are you? — Medium, I think. — Here you are. The fitting room is over there. … How is it? — It's a bit small. Do you have it in large? — Yes, here's a large one. And good news: it's on sale today, thirty percent off. — Great! I'll take it. Can I pay by card? — Sure. Would you like a bag? — No, thanks. I have one.","q":[{"q":"Какой размер подошёл покупателю?","o":["Большой (large)","Средний (medium)","Маленький (small)"],"a":"Большой (large)"},{"q":"Какая скидка на куртку?","o":["30%","50%","Скидки нет"],"a":"30%"},{"q":"Как покупатель платит?","o":["Картой","Наличными","Не платит"],"a":"Картой"}]}],"id": ала.<\/li><\/ul><p>Вопрос «как долго?»: <b>How long have you been learning English?<\/b><\/p><p>Глаголы состояния (know, like, want, believe) в Continuous не ставят: <i>I've known him for years<\/i>, а не <i>I've been knowing<\/i>.<\/p>","ex":[{"q":"I ___ (wait) for you for an hour!","a":["have been waiting","'ve been waiting"],"why":"Началось час назад и продолжается → have been + -ing."},{"q":"She is tired because she ___ (run).","a":["has been running","'s been running"],"why":"Результат сейчас (устала) от недавнего длительного действия."},{"q":"How long ___ (you / learn) English?","a":["have you been learning"],"why":"How long + действие до сих пор → Present Perfect Continuous."},{"q":"It ___ (rain) since morning.","a":["has been raining","'s been raining"],"why":"С утра и до сих пор."},{"q":"I ___ (know) him for ten years.","a":["have known","'ve known"],"why":"Know — глагол состояния, только Present Perfect, без -ing."},{"q":"They ___ (work) on this project since May.","a":["have been working","'ve been working","have worked","'ve worked"],"why":"С мая и до сих пор: подходят обе формы, Continuous подчёркивает процесс."}]},{"id":"pk-art2","lvl":"B1","title":"Артикли: особые случаи","desc":"Реки, страны, инструменты, спорт, school и the school","theory":"<div class=\"tbl\"><table><tr><th>С the<\/th><th>Без артикля<\/th><\/tr><tr><td>реки, моря, океаны: the Thames, the Pacific<\/td><td>озёра и отдельные горы: Lake Baikal, Everest<\/td><\/tr><tr><td>страны-союзы: the USA, the UK<\/td><td>большинство стран: Russia, France<\/td><\/tr><tr><td>музыкальные инструменты: play the guitar<\/td><td>спорт и игры: play football, play chess<\/td><\/tr><\/table><\/div><p><b>go to school / work / bed / hospital<\/b> без артикля — когда идём туда по назначению (учиться, работать, спать, лечиться). С <b>the<\/b> — когда это просто здание: <i>Mum went to the school to talk to the teacher.<\/i><\/p>","ex":[{"type":"choice","q":"We sailed down ___ Thames.","o":["the","—","a"],"a":"th let LIB={idx:null,busy:false,err:"",working:"",remote:false};
function packsURL(){return window.__PACKS_URL||""}
function packData(id){const i=(S.packs||{})[id];return (i&&i.data)||BUILTIN_PACKS.data[id]||null}
function packTexts(){const out=[];for(const id of Object.keys(S.packs||{})){const p=packData(id);(p&&Array.isArray(p.texts)?p.texts:[]).forEach((t,i)=>{if(t&&t.text&&Array.isArray(t.q))out.push(Object.assign({key:"p-"+id+"-"+i,l:p.level||"A2"},t))})}return out}
function applyPackData(id,p){
  if(!p)return;
  (Array.isArray(p.words)?p.words:[]).forEach(w=>{if(Array.isArray(w)&&w[0]&&w[1]&&!BASE_WORDS.some(x=>x.id===w[0]))BASE_WORDS.push(Object.assign(mkW(w,LEVELS.includes(w[5])?w[5]:(p.level||"A2")),{theme:"pack:"+id}))});
  (Array.isArray(p.lessons)?p.lessons:[]).forEach(l=>{if(l&&l.id&&Array.isArray(l.ex)&&!LESSONS.some(x=>x.id===l.id))LESSONS.push(Object.assign({lvl:p.level||"A2",desc:"",theory:""},l,{pack:id}))});
}
function sortLessons(){LESSONS.sort((a,b)=>LEVELS.indexOf(a.lvl)-LEVELS.indexOf(b.lvl))}
function applyPacks(){for(const id of Object.keys(S.packs||{}))applyPackData(id,packData(id));sortLessons()}
// Встроенные наборы ставятся сами (и обновляются), кроме тех, что пользователь удалил
function autoPacks(){S.packs=S.packs||{};S.removedPacks=S.removedPacks||[];let ch=false;
  for(const p of BUILTIN_PACKS.packs){if(S.removedPacks.includes(p.id))continue;const i=S.packs[p.id];
    if(!i||(!i.data&&(p.version||1)>(i.version||1))){if(BUILTIN_PACKS.data[p.id]){S.packs[p.id]={version:p.version||1,title:p.title,builtin:true};S.sets=S.sets||{};S.sets["pack:"+p.id]=true;ch=true}}}
  if(ch)save()}
function unapplyPack(id){for(let i=BASE_WORDS.length-1;i>=0;i--)if(BASE_WORDS[i].theme==="pack:"+id)BASE_WORDS.splice(i,1);for(let i=LESSONS.length-1;i>=0;i--)if(LESSONS[i].pack===id)LESSONS.splice(i,1)}
function libList(){return LIB.idx||BUILTIN_PACKS.packs}
async function loadLib(){
  if(!packsURL()){LIB.idx=BUILTIN_PACKS.packs;LIB.remote=false;return}
  LIB.busy=true;
  try{const r=await fetch(packsURL()+"index.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j.packs))throw 0;LIB.idx=j.packs;LIB.remote=true}
  catch(e){LIB.idx=BUILTIN_PACKS.packs;LIB.remote=false}
  LIB.busy=false;if((location.hash||"").slice(1)==="library")viewLibrary();
}
async function fetchPack(p){
  if(LIB.remote&&packsURL()){try{const r=await fetch(packsURL()+p.file+"?v="+(p.version||1),{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&typeof d==="object"&&(d.words||d.texts||d.lessons))return d}}catch(e){}}
  return BUILTIN_PACKS.data[p.id]||null;
}
function installData(p,d){if(S.packs&&S.packs[p.id])unapplyPack(p.id);S.packs=S.packs||{};S.removedPacks=(S.removedPacks||[]).filter(x=>x!==p.id);S.packs[p.id]=d===BUILTIN_PACKS.data[p.id]?{version:p.version||1,title:p.title,builtin:true}:{version:p.version||1,title:p.title,data:d};S.sets=S.sets||{};S.sets["pack:"+p.id]=true;applyPackData(p.id,d);sortLessons()}
async function installPack(p){LIB.working=p.id;LIB.err="";viewLibrary();const d=await fetchPack(p);
  if(!d)LIB.err="Не удалось скачать «"+p.title+"». Проверь интернет и попробуй ещё раз.";else{installData(p,d);save();CS=null;toast("Установлено: "+p.title)}
  LIB.working="";viewLibrary()}
async function installAll(){
  const todo=libList().filter(p=>{const i=(S.packs||{})[p.id];return !i||(p.version||1)>(i.version||1)});
  LIB.working="all";LIB.err="";viewLibrary();let n=0;
  for(const p of todo){const d=await fetchPack(p);if(d){installData(p,d);n++}}
  save();CS=null;LIB.working="";toast(n?`Установлено наборов: ${n}`:"Не удалось скачать наборы");viewLibrary();
}
function packCounts(p){const d=packData(p.id)||BUILTIN_PACKS.data[p.id];if(!d)return p.contents||"";
  const parts=[];if(d.words&&d.words.length)parts.push(d.words.length+" "+plural(d.words.length,["слово","слова","слов"]));if(d.lessons&&d.lessons.length)parts.push(d.lessons.length+" "+plural(d.lessons.length,["урок","урока","уроков"]));if(d.texts&&d.texts.length)parts.push(d.texts.length+" "+plural(d.texts.length,["текст","текста","текстов"]));return parts.join(" · ")}
function viewLibrary(){
  if(!LIB.idx&&!LIB.busy){loadLib().then(()=>{if((location.hash||"").slice(1)==="library")viewLibrary()});if(!LIB.idx){V.innerHTML=`<h1>Библиотека</h1><div class="sheet muted">Загружаю список…</div>`;return}}
  const inst=S.packs||{},list=libList();
  const todo=list.filter(p=>{const i=inst[p.id];return !i||(p.version||1)>(i.version||1)}).length;
  const extra=Object.keys(inst).filter(id=>!list.some(p=>p.id===id));
  V.innerHTML=`<h1>Библиотека</h1>
  <p class="sub">Тематические наборы уже встроены в приложение: их слова идут в карточки после основных слов твоего уровня, уроки — в «Грамматику» и справочник, тексты — в «Чтение». Ненужный набор можно удалить, а потом вернуть.${packsURL()?" Новые наборы появляются здесь без обновления приложения.":""}</p>
  <div class="stack">
  ${todo?`<section class="sheet packall">${yasik("happy",52,{teacher:false,anim:"idle"})}<div style="min-width:0;flex:1"><b>Установить всё сразу</b><div class="small muted">${todo} ${plural(todo,["набор","набора","наборов"])}: слова, уроки и тексты для всех уровней</div></div><button class="btn primary" id="liball" ${LIB.working?"disabled":""}>${LIB.working==="all"?"Устанавливаю…":"Установить все"}</button></section>`:`<div class="verdict ok">Все наборы установлены</div>`}
  ${LIB.err?`<div class="verdict bad"><span>${esc(LIB.err)}</span></div>`:""}
  ${list.map(p=>{const i=inst[p.id];const upd=i&&(p.version||1)>(i.version||1);
    return `<section class="sheet packc"><div style="min-width:0"><div class="row" style="gap:8px"><b>${esc(p.title)}</b>${p.level?`<span class="pill new">${esc(p.level)}</span>`:""}${i?`<span class="pill known">установлен</span>`:""}</div>
    <p class="small muted" style="margin:4px 0 0">${esc(p.desc||"")}</p><p class="small" style="margin:4px 0 0">${esc(packCounts(p))}</p></div>
    <div class="row">${LIB.working===p.id?'<span class="small muted">Устанавливаю…</span>':i?`${upd?`<button class="btn primary" data-inst="${esc(p.id)}">Обновить</button>`:""}<button class="btn ghost" data-rm="${esc(p.id)}">Удалить</button>`:`<button class="btn" data-inst="${esc(p.id)}" ${LIB.working?"disabled":""}>Установить</button>`}</div></section>`}).join("")}
  ${extra.map(id=>`<section class="sheet packc"><div><b>${esc(inst[id].title||id)}</b> <span class="pill known">установлен</span></div><button class="btn ghost" data-rm="${esc(id)}">Удалить</button></section>`).join("")}
  </div>`;
  const all=$("#liball");if(all)all.onclick=installAll;
  V.querySelectorAll("[data-inst]").forEach(b=>b.onclick=()=>{const p=list.find(x=>x.id===b.dataset.inst);if(p)installPack(p)});
  V.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const id=b.dataset.rm;unapplyPack(id);delete S.packs[id];S.removedPacks=[...new Set((S.removedPacks||[]).concat(id))];if(S.sets)delete S.sets["pack:"+id];save();CS=null;toast("Набор удалён");viewLibrary()});
}

function ruleRead(id){S.readRules=S.readRules||{};if(!S.readRules[id]){S.readRules[id]=dkey();save()}}
function ruleKnown(id){return !!((S.readRules||{})[id]||S.lessons[id])}
function sheetEl(){
  let el=document.getElementById("rsheet");
  if(!el){el=document.createElement("div");el.id="rsheet";el.className="rsheet";el.hidden=true;
    el.innerHTML='<div class="rsbox" role="dialog" aria-modal="true" aria-labelledby="rstitle"><button class="rsx" aria-label="Закрыть">×</button><div class="rsc"></div><div class="rsa row"></div></div>';
    document.body.appendChild(el);
    el.addEventListener("click",e=>{if(e.target===el||e.target.closest(".rsx"))closeSheet()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!el.hidden)closeSheet()});}
  return el;
}
function showSheet(html,acts){
  const el=sheetEl();acts=acts||[];el.querySelector(".rsc").innerHTML=html;const a=el.querySelector(".rsa");
  a.innerHTML=acts.map((x,i)=>`<button class="btn ${i===0?"primary":""}" data-act="${i}">${esc(x.t)}</button>`).join("")+`<button class="btn ghost" data-close>Понятно, к заданию</button>`;
  a.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{closeSheet();acts[+b.dataset.act].go()});
  a.querySelector("[data-close]").onclick=closeSheet;

const COMBO_MSG={3:"Три подряд — отличная серия!",5:"Пять подряд! Ты в ударе.",10:"Десять подряд! Это уже уверенное знание.",20:"Двадцать подряд! Я горжусь тобой."};
const WRONG_OPEN=["Давай разберёмся.","Смотри, в чём дело.","Почти! Вот подсказка.","Не страшно, это частая ошибка.","Ничего, на ошибках и учатся."];
let COMBO=0;
function mascotize(){
  V.querySelectorAll(".card .verdict:not([data-ya])").forEach(v=>{
    v.dataset.ya="1";
    const card=v.closest(".card");
    const state=v.classList.contains("ok")?"ok":v.classList.contains("warn")?"warn":"bad";
    const wh=[...card.querySelectorAll(".why,.note")].find(e=>e.children.length===0&&e.textContent.trim());
    const expl=wh?wh.textContent.trim():"";if(wh)wh.remove();
    const nm=uname();let mood,msg;
    if(state==="ok"){
      mood=COMBO>=3?"proud":"happy";
      let p=COMBO_MSG[COMBO]||pick(PRAISE);
      if(nm&&!COMBO_MSG[COMBO]&&Math.random()<.3)p=p.replace(/!$/,", "+nm+"!");
      msg=p+(expl?" "+expl:"");
    }else if(state==="warn"){mood="happy";msg=expl||"Почти! Смысл верный, проверь написание."}
    else{mood="think";msg=pick(WRONG_OPEN)+" "+(expl||"Запомни правильный вариант и скажи его вслух пару раз. Это задание вернётся к тебе в «Ошибках» — в следующий раз получится.")}
    const el=document.createElement("div");el.className="teach "+state;
    el.innerHTML=yasik(mood,54,{teacher:false,anim:state==="ok"?(COMBO>=3?"party":"jump"):state==="bad"?"tilt":"nod"})+`<div class="ybub">${esc(msg)}</div>`;
    v.after(el);
  });
}

// Звук и вибрация на ответ
let ACX=null;
function feedback(ok){
  if(S.settings.vibrate!==false&&navigator.vibrate){try{navigator.vibrate(ok?15:[25,40,25])}catch(e){}}
  if(S.settings.sound===false)return;
  try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();const t=ACX.currentTime;
    (ok?[660,990]:[330,247]).forEach((f,i)=>{const o=ACX.createOscillator(),g=ACX.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
      const s0=t+i*0.09;g.gain.setValueAtTime(0.0001,s0);g.gain.exponentialRampToValueAtTime(0.09,s0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s0+0.17);
      o.connect(g);g.connect(ACX.destination);o.start(s0);o.stop(s0+0.2)})}catch(e){}
}

function knownCount(){return allWords().filter(w=>status(w.id)==="known").length}
function startedCount(){return Object.keys(S.cards).length}
function fixedCount(){return Object.values(S.mist).filter(m=>m.done).length}
function bestStreak(){const ks=Object.keys(S.days).filter(k=>S.days[k].n>0).concat(S.frozen||[]).sort();let best=0,cur=0,prev=null;
  for(const k of [...new Set(ks)]){const t=new Date(k+"T12:00:00").getTime();cur=prev&&Math.round((t-prev)/DAY)===1?cur+1:1;best=Math.max(best,cur);prev=t}return Math.max(best,streak())}

let ACH_LOCK=false;
function checkAch(){
  if(ACH_LOCK)return;S.ach=S.ach||{};
  const fresh=ACH.filter(a=>!S.ach[a.id]&&(()=>{try{return a.c()}catch(e){return false}})());
  if(!fresh.length)return;fresh.forEach(a=>S.ach[a.id]=dkey());save();
  const a=fresh[0],t=$("#toast");t.classList.add("ach");t.innerHTML=medal(true,34)+`<div><b>Новое достижение: ${esc(a.t)}</b><div class="small">${esc(a.d)}</div></div>`;

/* ---------- GEMINI: свой ключ в приложении + «Открыть в Gemini» через подписку ---------- */
const GKEY="yasny-gemini-key";
function gemKey(){try{return localStorage.getItem(GKEY)||""}catch(e){return""}}
function gemSetKey(k){try{if(k)localStorage.setItem(GKEY,k);else localStorage.removeItem(GKEY)}catch(e){}}
const GEM_BASE="https://generativelanguage.googleapis.com/v1beta/";
function gemCount(){const d=dkey();S.aiCount=S.aiCount||{};return S.aiCount[d]||0}
function gemBump(){const d=dkey();S.aiCount=S.aiCount||{};S.aiCount[d]=(S.aiCount[d]||0)+1;const ks=Object.keys(S.aiCount).sort();while(ks.length>14)delete S.aiCount[ks.shift()]}
// Выбираем модели по тому, что реально доступно ключу
async function gemModels(key,force){
  if(!force&&S.settings.gmModels&&S.settings.gmModels.def)return S.settings.gmModels;
  const r=await fetch(GEM_BASE+"models?pageSize=200",{headers:{"x-goog-api-key":key}});
  if(r.status===400||r.status===401||r.status===403)throw{code:"bad_key"};
  if(!r.ok)throw{code:"upstream_error"};
  const j=await r.json();
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>String(m.name).replace(/^models\//,""));
  const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const clean=n=>!/(image|tts|audio|live|embedding|vision|thinking|exp|preview|native)/.test(n);
  const pickBest=re=>names.filter(n=>re.test(n)&&clean(n)).sort((a,b)=>ver(b)-ver(a)||a.length-b.length)[0]||names.filter(n=>re.test(n)).sort((a,b)=>ver(b)-ver(a))[0];
  const lite=pickBest(/^gemini-[\d.]+-flash-lite/),flash=pickBest(/^gemini-[\d.]+-flash(?!-lite)/);
  const res={quick:lite||flash,def:flash||lite};
  if(!res.def)throw{code:"no_model"};
  S.settings.gmModels=res;save();return res;
}
function gemParseJSON(t){
  const s=String(t).trim();try{return JSON.parse(s)}catch(e){}
  const f=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf("}"),s.lastIndexOf("]"));
  if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}
  throw{code:"invalid_json",text:s};
}
function makeGemini(key){
  async function call(input,opts,asJSON){
    opts=opts||{};const ms=await gemModels(key);
    const order=opts.modelTier==="quick"?[ms.quick,ms.def]:[ms.def,ms.quick];
    const turns=typeof input==="string"?[{role:"user",content:input}]:input;
    const contents=[];for(const t of turns){const role=t.role==="assistant"?"model":"user";const last=contents[contents.length-1];if(last&&last.role===role)last.parts[0].text+="\n\n"+t.content;else contents.push({role,parts:[{text:t.content}]})}
    let lastErr={code:"upstream_error"};
    for(const model of [...new Set(order.filter(Boolean))]){
      let r;
      try{r=await fetch(GEM_BASE+"models/"+encodeURIComponent(model)+":generateContent",{method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({contents,generationConfig:Object.assign({temperature:0.6,maxOutputTokens:4096},asJSON?{responseMimeType:"application/json"}:{})})})}
      catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};lastErr={code:"upstream_error"};continue}
      if(r.status===429){lastErr={code:"gem_limit"};continue}
      if(r.status===400||r.status===401||r.status===403){let j={};try{j=await r.json()}catch(e){}const msg=JSON.stringify(j);if(/API_KEY|PERMISSION|key/i.test(msg))throw{code:"bad_key"};lastErr={code:"upstream_error"};continue}
      if(r.status===404){S.settings.gmModels=null;lastErr={code:"upstream_error"};continue}
      if(!r.ok){lastErr={code:"upstream_error"};continue}
      const j=await r.json();gemBump();save();
      const cand=(j.candidates||[])[0];
      if(!cand||!cand.content){throw{code:(j.promptFeedback&&j.promptFeedback.blockReason)?"refused":"empty_completion"}}
      const text=(cand.content.parts||[]).map(p=>p.text||"").join("");
      if(!text.trim())throw{code:"empty_completion"};
      if(opts.onText)try{opts.onText({text,delta:text})}catch(e){}
      return asJSON?gemParseJSON(text):{text,truncated:cand.finishReason==="MAX_TOKENS"};
    }
    throw lastErr;
  }
  const f=(input,opts)=>call(input,opts,false);
  f.json=(input,opts)=>call(input,opts,true);
  f.gemini=true;
  return f;
}

// Ответ Gemini вставлен обратно: забираем ошибки в «Ошибки»
function importGeminiWriting(raw){
  let data=null;try{data=gemParseJSON((String(raw).match(/```json\s*([\s\S]*?)```/)||[])[1]||raw)}catch(e){}
  const errs=data&&Array.isArray(data.errors)?data.errors.filter(e=>e&&e.wrong&&e.right).slice(0,10):null;
  if(!errs){toast("Не нашёл в ответе блок с ошибками. Скопируй ответ Gemini целиком");return false}
  const text=(PR.text||"").trim();
  errs.forEach(e=>aiMistake(String(e.wrong),String(e.right),String(e.explanation||""),null,sentenceWith(text,String(e.wrong)),"write"));
  S.writings=(S.writings||[]).concat({date:Date.now(),task:curTask(),text,res:{errors:errs,level:""}}).slice(-10);
  bump(errs.length===0,T());save();
  PR.res={errors:errs.map(e=>({wrong:e.wrong,right:e.right,explanation:e.explanation||""})),good:"",tips:[],corrected:"",level:""};PR.lastText=text;
  toast(errs.length?`Ошибок перенесено в «Ошибки»: ${errs.length}`:"Gemini не нашёл ошибок — отлично!");return true;
}

let SEQ=null;
function voicesEn(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return[]}}
function stopSeq(){if(SEQ){SEQ.stop=true;clearTimeout(SEQ.tm);SEQ=null}try{speechSynthesis.cancel()}catch(e){}}
// lines: [[спикер, текст]]; onLine(i) — подсветка; onDone()
function speakSeq(lines,rate,onLine,onDone){
  stopSeq();if(!("speechSynthesis" in window)){toast("Озвучка недоступна в этом браузере");return}
  const vs=voicesEn(),pref=vs.filter(v=>v.lang.replace("_","-")===S.settings.voice);
  const pool=(pref.length>1?pref:vs);
  const voiceFor=sp=>{if(!pool.length)return null;return sp==="B"&&pool.length>1?pool[1]:pool[0]};
  const pitch={A:0.92,B:1.22};
  const me=SEQ={stop:false,i:0};
  const step=()=>{
    if(me.stop)return;
    if(me.i>=lines.length){SEQ=null;onLine&&onLine(-1);onDone&&onDone();return}
    const [sp,tx]=lines[me.i];onLine&&onLine(me.i);
    let fired=false;const next=()=>{if(fired||me.stop)return;fired=true;clearTimeout(me.tm);me.i++;me.tm=setTimeout(step,380)};
    try{
      const u=new SpeechSynthesisUtterance(tx);u.lang=S.settings.voice;u.rate=rate*0.95;u.pitch=pitch[sp]||1;
      const v=voiceFor(sp);if(v)u.voice=v;u.onend=next;u.onerror=next;
      if(me.i===0)speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){}
    // запасной таймер: в приложении на iPhone событие окончания не приходит
    const est=(tx.split(/\s+/).length*0.42+0.7)/Math.max(0.4,rate);
    const reliable=!window.__NATIVE_APP||!!window.__ttsDone;
    me.tm=setTimeout(next,(reliable?est*2.2+2:est)*1000);
  };
  step();
}

const PATH_INTRO={A0:"Буквы, чтение и первые фразы",A1:"Простые предложения о себе и своём дне",A2:"Прошлое, вопросы, артикли и сравнения",B1:"Будущее, условия и модальные глаголы",B2:"Сложные времена, пассив и косвенная речь"};
function stepId(L,s){return L+"-"+s.k+"-"+(s.r||s.d||s.t||s.l+s.n||s.u)}

function stepInfo(L,s){

  if(!i)return null;

// Отметка после завершения шага: тост «следующий шаг»

/* ---------- Контрольная уровня ---------- */
function startExam(L){
  const ls=LESSONS.filter(l=>l.lvl===L&&l.ex&&l.ex.length);
  let items=[];
  ls.forEach(l=>{shuffle(l.ex.map((_,i)=>i)).slice(0,2).forEach(i=>items.push({k:"grammar",ref:l.id+":"+i,t:l.id,l:L}))});
  items=shuffle(items).slice(0,10);
  const sn=shuffle(SENTENCES.map((s,i)=>[s,i]).filter(([s])=>s.l===L)).slice(0,12-items.length);
  sn.forEach(([s,i])=>items.push({k:"tr",ref:String(i),t:s.t||"tr",l:L}));
  if(items.length<4){toast("Для этого уровня пока мало заданий");return}
  const q=shuffle(items).map((x,i)=>({key:"x"+i,k:"exam",ref:x.k+"|"+x.ref,ek:x.k,eref:x.ref,t:x.t,l:x.l,s:0,n:0,exam:true}));
  MS={active:true,quick:true,exam:L,queue:q,done:0,ok:0,cur:null,res:null};MS.cur=MS.queue.shift();
  if(location.hash==="#mistakes")renderReview();else location.hash="#mistakes";
}
const _answerReview=answerReview;
answerReview=function(v){
  const m=MS&&MS.cur;if(!m||!m.exam)return _answerReview(v);
  const t=taskOf(m);let ok=false,typo=false,best=t.show,cres=null;
  if(!v)ok=false;else if(t.input==="choice")ok=v===t.answers[0];
  else{const c=check(v,t.answers,t.tol!==false);cres=c;ok=c.status!=="bad";typo=c.status==="typo";best=c.best||t.show}
  if(!ok)mistake(m.ek,m.eref,false,v,{t:m.t,l:m.l});
  MS.done++;if(ok)MS.ok++;bump(ok,m.l);save();
  MS.res={ok,typo,user:v,best,cres};renderReview();
};
const _renderReview=renderReview;
renderReview=function(){
  if(MS&&MS.exam&&!MS.cur){
    MS.active=false;const L=MS.exam,pc=Math.round(MS.ok/Math.max(1,MS.done)*100),pass=pc>=80;
    S.pathx=S.pathx||{};const p=S.pathx[L];S.pathx[L]={best:Math.max(pc,p?p.best:0),pass:pass||!!(p&&p.pass),date:dkey()};save();

    MS=null;
    if(pass){if(nx&&T()===L)setLevel(nx,"path");else if(!nx)setTimeout(()=>celebrate({badge:"B2",title:"Путь пройден!",text:"Все шаги до уровня B2 позади. Дальше — больше чтения, разговоров и новых наборов слов.",stats:celebStats()}),400)}
    return;

    const vd=V.querySelector(".verdict");if(vd&&MS.res){vd.innerHTML=MS.res.ok?"Верно"+(MS.res.typo?" <span>(с опечаткой)</span>":""):"Неверно <span>· добавлено в ошибки</span>"}

/* ---------- Главная следует пути ---------- */
const _nextAction=nextAction;
nextAction=function(){
  const base=_nextAction();
  if(["test","mist","rrev"].includes(base.k))return base;
  const md=dueMist().length,dw=dueWords().length;
  const c=pathCurrent();
  // много повторений — сначала повторяем, потом новое
  if(md+dw>=15&&base.k==="quick")return base;
  if(c){
    // слова: если на сегодня новые уже взяты — следующий шаг, а слова подтянутся завтра
    if(c.s.k==="words"&&newLeft()<=0){const st=pathSteps(T()),n2=st.find(x=>!x.fin&&x.s.k!=="words");if(n2)return pathAction(n2,base)}

};

function weekStart(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);const wd=(d.getDay()+6)%7;return d.getTime()-wd*DAY}
function weekStats(from){
  const to=from+7*DAY,keys=[];for(let t=from;t<to;t+=DAY)keys.push(dkey(t+3600e3*3));
  let n=0,ok=0,act=0;keys.forEach(k=>{const d=S.days[k];if(d&&d.n){n+=d.n;ok+=d.ok;act++}});
  const kset=new Set(keys);
  const words=Object.values(S.cards).filter(c=>kset.has(c.added)).length;
  const lessons=Object.values(S.lessons||{}).filter(x=>kset.has(x.last)).length+Object.values(S.course||{}).filter(x=>x&&kset.has(x.date)).length;
  const fixed=Object.values(S.mist||{}).filter(m=>m.fixed&&m.fixed>=from&&m.fixed<to).length;
  return{n,ok,act,words,lessons,fixed,acc:n?Math.round(ok/n*100):0};
}
function weakTopic(){const g={};Object.values(S.mist||{}).filter(m=>!m.done).forEach(m=>{const t=m.t||m.k;g[t]=(g[t]||0)+1});const e=Object.entries(g).sort((a,b)=>b[1]-a[1])[0];return e&&e[1]>=2?e[0]:null}
function weeklyCard(){
  const ws=weekStart(),prevFrom=ws-7*DAY;

  const a=weekStats(prevFrom),b=weekStats(prevFrom-7*DAY);

  const wt=weakTopic();const c=pathCurrent();

      <div><b>${a.acc}%</b><span>точность${b.n?` <em class="${a.acc>=b.acc?"up":"down"}">${a.acc>=b.acc?"▲":"▼"}${Math.abs(a.acc-b.acc)}</em>`:""}</span></div>
      <div><b>${a.words}</b><span>новых слов</span></div>
      <div><b>${a.lessons}</b><span>${plural(a.lessons,["урок","урока","уроков"])}</span></div>
      <div><b>${a.fixed}</b><span>${plural(a.fixed,["ошибка исправлена","ошибки исправлены","ошибок исправлено"])}</span></div>
    </div>
    ${wt||c?`<div class="small" style="margin-top:6px"><b>План на эту неделю:</b> ${c?`дойти до шага «${esc(c.t)}»`:"повторять и читать"}${wt?`; подтянуть тему «${esc(topicName(wt))}» — там больше всего ошибок`:""}.</div>`:""}

/* ===================== РАЗГОВОР С ЯСИКОМ (без ИИ) ===================== */
let TK=null;
function talkNorm(s){return String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/[^\w\s']/g," ").replace(/\s+/g," ").trim()}
function talkPick(){
  const L=li(T()),seen=S.talk||{};
  let pool=TALK.filter(x=>li(x.l)<=L&&li(x.l)>=L-1);if(pool.length<4)pool=TALK.filter(x=>li(x.l)<=L);if(!pool.length)pool=TALK.slice();
  const last=TK&&TK.cur?TK.cur.id:null;
  pool=pool.filter(x=>x.id!==last);
  pool.sort((a,b)=>((seen[a.id]||{}).n||0)-((seen[b.id]||{}).n||0)||Math.random()-.5);
  return pool[0];
}
function talkJudge(p,ans){
  const a=talkNorm(ans),words=a?a.split(" ").length:0;
  const miss=(p.need||[]).filter(src=>{try{return !new RegExp(src,"i").test(a)}catch(e){return false}});
  const short=words<(p.min||2);
  return{ok:!short&&!miss.length,short,miss:miss.length,words};
}

    if(r.user&&!AI.off)fb+=TK.ai?`<div class="sheet" style="background:var(--soft)">${TK.ai.busy?"Ясик проверяет грамматику…":TK.ai.err?esc(TK.ai.err):`<b>Исправленный вариант:</b> ${esc(TK.ai.fixed||r.user)}${sayBtn(TK.ai.fixed||r.user)}<div class="small" style="margin-top:6px">${esc(TK.ai.note||"")}</div>`}</div>`:`<div class="row"><button class="btn small" id="tkai">Проверить грамматику с ИИ</button></div>`;
    fb+=`<div class="row">${r.ok?"":`<button class="btn" id="tkagain">Попробовать ещё раз</button>`}<button class="btn primary" id="tknext">Следующий вопрос</button></div>`;
  }
  V.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h1>Разговор с Ясиком</h1><span class="small muted">${TK.n?`По теме: ${TK.ok} из ${TK.n}`:""}</span></div>
  <p class="sub">Ясик задаёт вопрос — ответь ${mic?"вслух (кнопка микрофона) или напиши":"письменно (в приложении на телефоне можно голосом)"}. Отвечай о себе, целыми предложениями. Ошибиться не страшно — главное говорить.</p>
  <div class="card">
    <div class="card-top"><span>Вопрос · ${p.l}</span><span></span></div>
    ${yasay(r?(r.ok?"proud":"think"):"happy",`<b style="font-size:19px">${esc(p.q)}</b>${TK.tr?`<br><span class="small muted">${esc(p.ru)}</span>`:""}`,64,r?(r.ok?"jump":"tilt"):"hello")}
    <div class="row"><button class="btn" data-say="${esc(p.q)}">Повторить вопрос</button><button class="btn" data-say="${esc(p.q)}" data-rate="0.65">Медленно</button><button class="btn ghost" id="tktr">${TK.tr?"Скрыть перевод":"Перевод"}</button></div>
    <textarea id="tkin" placeholder="Твой ответ по-английски" autocomplete="off" autocapitalize="off" spellcheck="false" ${r?"disabled":""}>${r?esc(r.user):""}</textarea>
    ${r?"":`<div class="row"><button class="btn primary" id="tkchk">Ответить</button>${micBtn("tkin")}<button class="btn ghost" id="tkidk">Не знаю, что сказать</button></div>`}
    ${fb}
  </div>`;
  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
  const inp=$("#tkin");
  on("tktr",()=>{TK.tr=!TK.tr;viewTalk()});
  on("tkchk",()=>talkAnswer(inp.value.trim()));on("tkidk",()=>talkAnswer(""));
  on("tkagain",()=>{TK.res=null;TK.ai=null;viewTalk()});
  on("tknext",()=>{TK.cur=talkPick();TK.res=null;TK.ai=null;viewTalk();speak(TK.cur.q)});
  on("tkai",talkAI);
  if(inp&&!r){inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();talkAnswer(inp.value.trim())}}}
  if(!r&&TK.said!==p.id){TK.said=p.id;setTimeout(()=>speak(p.q),250)}
}
function talkAnswer(v){
  const p=TK.cur,j=v?talkJudge(p,v):{ok:false,empty:true};
  TK.res=Object.assign(j,{user:v});TK.n++;if(j.ok)TK.ok++;
  S.talk=S.talk||{};const s=S.talk[p.id]||{n:0,ok:0};s.n++;if(j.ok)s.ok++;s.last=dkey();S.talk[p.id]=s;
  bump(j.ok,p.l);save();viewTalk();
}
async function talkAI(){
  const p=TK.cur,u=TK.res&&TK.res.user;if(!u)return;
  TK.ai={busy:true};viewTalk();
  try{
    const r=await aiJSON(`Ученик уровня ${p.l} ответил на вопрос «${p.q}» так: «${u}». Исправь грамматику и естественность, сохрани смысл и простоту уровня. Ответь только JSON: {"fixed":"исправленный ответ по-английски","note":"1–2 коротких предложения по-русски: какие ошибки и почему, или похвала если ошибок нет"}`,{cache:false});
    TK.ai={fixed:String(r&&r.fixed||u),note:String(r&&r.note||"")};
  }catch(e){TK.ai={err:aiErr(e)}}
  if(location.hash==="#talk")viewTalk();
}

/* ===================== 10 МИНУТ: короткое занятие ===================== */
function tenQueue(){
  const dm=dueMist().slice(0,5);
  const dw=dueWords().slice(0,Math.max(3,8-dm.length)).map(w=>({key:"q:"+w.id,k:"word",ref:w.id,s:0,n:0,synthetic:true}));
  let q=dm.concat(dw);
  // если повторять нечего — пара заданий по уже пройденным правилам
  if(q.length<6){
    const done=Object.keys(S.lessons||{}).map(id=>LESSONS.find(l=>l.id===id)).filter(l=>l&&l.ex&&l.ex.length);
    shuffle(done).slice(0,3).forEach((l,k)=>{const i=Math.floor(Math.random()*l.ex.length);q.push({key:"t"+k,k:"exam",ref:"grammar|"+l.id+":"+i,ek:"grammar",eref:l.id+":"+i,t:l.id,l:l.lvl,s:0,n:0,exam:true})});
  }
  return shuffle(q).slice(0,9);
}
function startTen(){
  const q=tenQueue();
  if(!q.length){const c=pathCurrent();toast("Повторять пока нечего — сразу к шагу пути");if(c)c.go();else location.hash="#cards";return}
  MS={active:true,quick:true,ten:true,queue:q,done:0,ok:0,cur:null,res:null,t0:Date.now()};MS.cur=MS.queue.shift();
  if(location.hash==="#mistakes")renderReview();else location.hash="#mistakes";
}
const _renderReview2=renderReview;
renderReview=function(){
  if(MS&&MS.ten&&!MS.cur){
    MS.active=false;const c=pathCurrent(),nl=Math.min(newLeft(),newWords().length),min=Math.max(1,Math.round((Date.now()-MS.t0)/60000));
    V.innerHTML=resultHTML({title:"Разминка готова",right:MS.ok,total:MS.done,note:`Повтор занял ${min} мин. Чтобы добрать до 10 минут, сделай ещё что-то одно: шаг пути или новые слова.`,
      buttons:`${c?`<button class="btn primary" id="tenpath">Шаг пути: ${esc(c.t)}</button>`:""}${nl?`<a class="btn" href="#cards">${Math.min(3,nl)} новых слова</a>`:""}<a class="btn ghost" href="#today">Хватит на сегодня</a>`});
    const b=$("#tenpath");if(b)b.onclick=()=>c.go();
    MS=null;return;
  }
  _renderReview2();
  if(MS&&MS.ten&&V){const h=V.querySelector("h1");if(h)h.textContent="10 минут";
    if(MS.cur&&MS.cur.exam&&MS.res){const vd=V.querySelector(".verdict");if(vd)vd.innerHTML=MS.res.ok?"Верно":"Неверно <span>· добавлено в ошибки</span>"}
    if(MS.cur&&MS.cur.exam){const ct=V.querySelector(".card-top");if(ct&&ct.children.length>1)ct.lastElementChild.outerHTML=`<span>повтор правила</span>`}}
};
// кнопка на главной и плитка в «Практике»
const _viewToday2=viewToday;
viewToday=function(){
  _viewToday2();
  const hb=V.querySelector(".herob");
  if(hb)hb.insertAdjacentHTML("afterend",`<button class="btn herob2" id="ten">Нет времени? 10 минут</button>`);
  const t=$("#ten");if(t)t.onclick=startTen;
};
const _viewTrain=viewTrain;
viewTrain=function(){
  _viewTrain();
  const g=V.querySelector(".tiles2");if(!g)return;
  const tl=Object.keys(S.talk||{}).length;
  const sp=g.querySelector('a[href="#speak"]');
  const html=tile("#talk","Разговор с Ясиком",`${TALK.length} вопросов о тебе · ${micAvail()?"отвечай голосом":"отвечай письменно или голосом в приложении"}`,"",{v:tl/TALK.length});
  if(sp)sp.insertAdjacentHTML("beforebegin",html);else g.insertAdjacentHTML("beforeend",html);
  const ls=g.querySelector('a[href="#listen"] .tbody span');if(ls)ls.textContent="Диктант и диалоги: послушай и ответь";
};

autoPacks();applyPacks();migrateRrev();applyFreeze();
new MutationObserver(()=>queueMicrotask(()=>{mascotize();budCheck()})).observe(V,{childList:true,subtree:true});
if(!S.onboarded&&!(S.totalAns>0)&&location.hash!=="#hello")location.hash="#hello";else route();
initSync();
</script>
