<title>Ясный английский</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbook — sticky top bar with tabs, one 720px column of exercise sheets; highlighter stroke marks the word you're learning */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#141E33; --muted:#586379; --line:#DBE0E9;
  --accent:#2B52DC; --accent-ink:#FFFFFF; --soft:#E7ECFB;
  --mark:#FFE45E; --ok:#167A4B; --ok-soft:#E0F2E8; --bad:#BF3328; --bad-soft:#FBE6E3; --warn:#9A6400; --warn-soft:#FFF2D6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#141C2F; --ink:#E5E9F2; --muted:#96A0B6; --line:#253049;
  --accent:#86A2FF; --accent-ink:#0C1220; --soft:#1B2641;
  --mark:rgba(232,205,70,.38); --ok:#52C78F; --ok-soft:#12301F; --bad:#FF8173; --bad-soft:#3A1916; --warn:#F2BC55; --warn-soft:#352812;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C2F; --ink:#E5E9F2; --muted:#96A0B6; --line:#253049;
  --accent:#86A2FF; --accent-ink:#0C1220; --soft:#1B2641;
  --mark:rgba(232,205,70,.38); --ok:#52C78F; --ok-soft:#12301F; --bad:#FF8173; --bad-soft:#3A1916; --warn:#F2BC55; --warn-soft:#352812;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 12px 10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 10px;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{text-decoration:none;display:inline-block;appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.right:disabled,.btn.wrong:disabled,.pairopts .btn:disabled{opacity:1}
.btn small{display:block;font-size:11.5px;opacity:.75;font-weight:400}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none;vertical-align:middle}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:16px;height:16px;fill:var(--ink)}

input[type=text],textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:84px}
.big-input{font-size:20px;padding:13px 15px}

/* today */
.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.goal .num{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.plan{display:flex;flex-direction:column}
.plan-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.plan-item:first-child{border-top:0;padding-top:0}
.plan-item:last-child{padding-bottom:0}
.plan-item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.chart .b{fill:var(--accent)}
.chart .b0{fill:var(--line)}
.chart .gl{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.method div{min-width:0}
.method b{display:block;margin-bottom:2px}
.method p{margin:0;color:var(--muted);font-size:14px}
@media (max-width:620px){.method{grid-template-columns:1fr}}

/* flash card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.card-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.prompt{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,5vw,34px);line-height:1.25;text-wrap:balance;margin:6px 0}
.prompt .hl,.hl{background:linear-gradient(transparent 60%,var(--mark) 60%,var(--mark) 94%,transparent 94%);padding:0 2px}
.ipa{font-family:var(--f-mono);color:var(--muted);font-size:15px}
.example{font-size:17px;border-left:3px solid var(--line);padding-left:12px}
.example .ru{display:block;color:var(--muted);font-size:14px}
.answer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.answer .en{font-family:var(--f-display);font-weight:500;font-size:24px}
.verdict{padding:10px 14px;border-radius:8px;font-weight:500}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict span{font-weight:400;color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{padding:10px 6px}
.grades .btn.sugg{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:460px){.grades{grid-template-columns:repeat(2,1fr)}}
.hint{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:500}

/* grammar */
.lessons{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.lesson:first-child{border-top:0}
.lesson:hover{background:var(--soft)}
.lesson .lvl{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:2.2em}
.lesson .t{font-weight:600}
.lesson .d{color:var(--muted);font-size:14px}
.score{font-size:13px;padding:2px 9px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score.none{color:var(--muted);border:1px dashed var(--line)}
.score.good{background:var(--ok-soft);color:var(--ok)}
.score.mid{background:var(--warn-soft);color:var(--warn)}
.theory{font-size:16px}
.theory p{margin:0 0 10px}
.theory ul{margin:0 0 10px;padding-left:20px}
.theory li{margin-bottom:4px}
.theory .ex{font-style:italic}
.theory table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0 12px}
.theory th,.theory td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.theory th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
.q{font-size:20px;line-height:1.9}
.q input{display:inline-block;width:auto;min-width:8ch;padding:4px 8px;font-size:18px;border-width:0 0 2px;border-radius:0;background:transparent;border-color:var(--accent)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices .btn{min-width:72px;font-size:17px}
.choices .btn.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choices .btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:15px}
.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}

/* diff */
.diff{font-size:17px;line-height:1.8}
.diff .miss{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 3px;font-weight:600}
.diff .extra{text-decoration:line-through;color:var(--bad);padding:0 2px}
.variants{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}

/* words */
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:center;font-size:15px}
.wi:first-child{border-top:0}
.wi .e{font-weight:600}
.wi .r{color:var(--muted)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.new{border:1px solid var(--line);color:var(--muted)}
.pill.learn{background:var(--warn-soft);color:var(--warn)}
.pill.known{background:var(--ok-soft);color:var(--ok)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}.wi{grid-template-columns:1fr auto}.wi .r{grid-column:1/2;grid-row:2}}
.settings{display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.levelcta{border-color:var(--accent)}
.lvlbox{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.lvlbig{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 3px}
@media (max-width:520px){.lvlbox{grid-template-columns:auto 1fr}.lvlbox>a{grid-column:1/-1;justify-self:start}}
.advice{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-radius:8px;padding:12px 14px}
.advice p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.advice.up{background:var(--ok-soft)}.advice.down{background:var(--warn-soft)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:var(--f-mono);font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.step.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step.fail{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.warnchip{background:var(--bad-soft);color:var(--bad);text-decoration:none}
.bad-t{color:var(--bad)}
.mstat{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:28px;align-items:center}
.mstat .num{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.mgo{justify-self:end}
@media (max-width:560px){.mstat{grid-template-columns:repeat(3,1fr);gap:14px}.mgo{grid-column:1/-1;justify-self:start}}
.weak{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 2ch auto;gap:12px;align-items:center;font-size:15px}
.wbar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.wbar i{display:block;height:100%;background:var(--bad);border-radius:8px}
.wnum{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
@media (max-width:520px){.wrow{grid-template-columns:minmax(0,1fr) 2ch auto}.wbar{grid-column:1/-1;grid-row:2}}
.mi{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.mi:first-child{border-top:0}
.mtop{display:flex;justify-content:space-between;gap:8px}
.mq{font-weight:500}
.sdots{display:inline-flex;gap:4px;align-items:center}
.sdots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ok)}
.sdots i.on{background:var(--ok)}
.lvlhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill.lv-now{background:var(--accent);color:var(--accent-ink)}.pill.lv-low{background:var(--soft);color:var(--muted)}.pill.lv-high{border:1px dashed var(--line);color:var(--muted)}
.wlv{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:10px 0 14px}
.abcl{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.abcl b{font-family:var(--f-display);font-size:17px}.abcl span{font-size:12px;color:var(--muted)}
.abcl:hover{border-color:var(--accent)}
.choices.col{flex-direction:column;align-items:stretch}.choices.col .btn{text-align:left}
.tline{min-height:54px;border-bottom:2px solid var(--accent);display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;align-items:center}
.tpool{display:flex;flex-wrap:wrap;gap:6px}
.tile{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:17px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--accent)}.tile.used{opacity:.25;cursor:default}
.rtext{font-size:18px;line-height:1.75;margin:0}
.tw{cursor:pointer;border-radius:3px}.tw:hover{background:var(--soft)}.tw.on{background:var(--mark)}
.gloss{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);min-height:44px;display:flex;flex-direction:column;gap:4px}
.rq{display:flex;flex-direction:column;gap:8px}
.sounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.sounds{grid-template-columns:1fr}}
.snd .sym{font-family:var(--f-mono);font-size:20px;font-weight:500}
.pairopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairopts .btn{font-size:22px;padding:16px;font-family:var(--f-display);font-weight:500}
.pairopts .btn.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pairopts .btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.steps-list{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.week{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);width:30px}
.wd i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:block}
.wd.on i{background:var(--accent);border-color:var(--accent)}
.wd.fr i{background:var(--soft);border:1.5px dashed var(--accent)}
.wd.today{color:var(--ink);font-weight:600}.wd.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--muted)}
.week .small{margin-left:6px}
.lpath{display:flex;align-items:center;gap:0}
.lpath i{flex:1;height:2px;background:var(--line);min-width:8px}
.lp{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.lp.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.lp.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.sets{grid-template-columns:1fr}}
.setc{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.setc.on{border-color:var(--accent);background:var(--soft)}
.verbcard{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
@media (max-width:460px){.vgrid{grid-template-columns:1fr}}
input.ok{border-color:var(--ok)!important;background:var(--ok-soft)!important}
input.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.vtable td,.vtable th{white-space:nowrap}
.btn.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.werr{border-left:3px solid var(--bad);padding:2px 0 2px 12px}
mark.errmark{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 2px}
.scenes{display:flex;flex-wrap:wrap;gap:8px}
.chatbox{display:flex;flex-direction:column}
.chatlog{display:flex;flex-direction:column;gap:12px;max-height:60vh;min-height:200px;overflow-y:auto;padding:4px 2px 12px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:85%}
.msg.ai{align-self:flex-start}.msg.me{align-self:flex-end;align-items:flex-end}
.bub{padding:10px 14px;border-radius:14px;font-size:16px;line-height:1.45;white-space:pre-wrap}
.msg.ai .bub{background:var(--soft);border-bottom-left-radius:4px}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.mtools{display:flex;gap:6px;align-items:center}
.fix{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
.chatin{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.chatin textarea{min-height:48px}
[data-sync][data-state="synced"]{color:var(--ok)}

{id:"pres", lvl:"A2", title:"Present Simple или Continuous", desc:"Привычки против «прямо сейчас»",
theory:`<p>В русском одно настоящее время, в английском два. Выбор зависит от того, <b>привычка это или процесс</b>.</p>
<div class="tbl"><table><tr><th>Present Simple</th><th>Present Continuous</th></tr>
<tr><td>Привычки, факты, расписания<br><span class="ex">I work in a bank. Water boils at 100°C.</span></td><td>Происходит сейчас или временно<br><span class="ex">I'm working from home this week.</span></td></tr>
<tr><td>always, usually, often, every day</td><td>now, right now, at the moment, Look!</td></tr>
<tr><td>he/she/it + <b>-s</b>: she work<b>s</b></td><td>am/is/are + <b>-ing</b>: she <b>is</b> work<b>ing</b></td></tr></table></div>
<p><b>Глаголы состояния</b> почти никогда не ставят в Continuous: know, understand, like, love, want, need, believe, remember, belong. Нельзя <i>I am knowing</i> — только <i>I know</i>.</p>`,
ex:[
{q:"She usually ___ (drink) coffee in the morning.", a:["drinks"], why:"«Usually» — это привычка, значит Present Simple. После she добавляем -s."},
{q:"Look! It ___ (rain).", a:["is raining","'s raining"], why:"«Look!» показывает, что действие идёт прямо сейчас: is + -ing."},
{q:"I ___ (not / understand) this word.", a:["don't understand","do not understand"], why:"Understand — глагол состояния, он не бывает в Continuous."},
{q:"Water ___ (boil) at 100 degrees.", a:["boils"], why:"Научный факт — всегда Present Simple."},
{q:"What ___ (you / do) right now?", a:["are you doing"], why:"«Right now» — процесс в данный момент. В вопросе are выходит вперёд."},
{q:"He ___ (work) from home this week.", a:["is working","'s working"], why:"«This week» — временная ситуация, не привычка. Поэтому Continuous."},
{q:"___ (you / like) jazz?", a:["do you like"], why:"Like — глагол состояния. Вопрос в Present Simple строится через do."},
{q:"The train ___ (leave) at 7:15 tomorrow.", a:["leaves"], why:"Расписание, даже если это про будущее, — Present Simple."}

{id:"past", lvl:"A2", title:"Past Simple или Present Perfect", desc:"Главная ловушка для русскоговорящих",
theory:`<p>По-русски «я видел этот фильм» — всегда прошедшее время. По-английски нужно решить: <b>привязано ли действие к моменту в прошлом</b>?</p>
<div class="tbl"><table><tr><th>Past Simple</th><th>Present Perfect</th></tr>
<tr><td>Есть законченное время: yesterday, last year, in 2019, two days ago, when?</td><td>Время не указано, важен результат или опыт: ever, never, already, just, yet</td></tr>
<tr><td><span class="ex">I saw it last week.</span></td><td><span class="ex">I have seen it. (я его видел — знаю, о чём речь)</span></td></tr>
<tr><td>Период закончился</td><td>Период ещё идёт: this week, today, since, for</td></tr></table></div>
<p>«Я живу здесь пять лет» — по-английски Present Perfect: <i>I have lived here for five years</i>. Present Simple тут ошибка.</p>`,
ex:[
{q:"I ___ (see) this film last week.", a:["saw"], why:"«Last week» — законченный момент в прошлом → Past Simple."},
{q:"I ___ (never / be) to Japan.", a:["have never been","'ve never been"], why:"Жизненный опыт без указания времени → Present Perfect. Обрати внимание: been to, а не gone to."},
{q:"She ___ (just / finish) her report.", a:["has just finished","'s just finished"], why:"«Just» — только что, результат виден сейчас."},
{q:"When ___ (you / arrive)?", a:["did you arrive"], why:"«When?» спрашивает о конкретном моменте — только Past Simple. «When have you arrived» — ошибка."},

{id:"art", lvl:"A2", title:"Артикли a, an, the", desc:"Когда нужен, а когда нет",
theory:`<ul>
<li><b>a / an</b> — «один из», упоминаем впервые, называем профессию: <span class="ex">She is a doctor.</span></li>
<li><b>an</b> ставится перед гласным <b>звуком</b>, а не буквой: an hour (h не читается), но a university (звук /j/).</li>
<li><b>the</b> — конкретный, уже известный собеседнику, единственный в своём роде: the sun, the door (вот эта дверь). Также с превосходной степенью: the best.</li>
<li><b>без артикля</b> — когда говорим о чём-то вообще во множественном числе или о неисчисляемом: <span class="ex">I like cats. Music helps me relax.</span> Также с приёмами пищи: have breakfast.</li>
</ul>
<p>Простой тест: можно ли по-русски добавить «какой-то» — значит a. «Тот самый» — the. «Вообще» — без артикля.</p>`,
ex:[
{type:"choice", q:"I saw ___ elephant at the zoo.", o:["a","an","the","—"], a:"an", why:"Впервые упоминаем, один из многих → a/an. Elephant начинается с гласного звука → an."},
{type:"choice", q:"___ sun rises in the east.", o:["a","an","the","—"], a:"the", why:"Солнце одно-единственное → the."},
{type:"choice", q:"She is ___ engineer.", o:["a","an","the","—"], a:"an", why:"Профессия → a/an. Engineer начинается с гласного звука."},
{type:"choice", q:"I love ___ music.", o:["a","an","the","—"], a:"—", why:"Музыка вообще, неисчисляемое → без артикля."},
{type:"choice", q:"It takes ___ hour to get there.", o:["a","an","the","—"], a:"an", why:"В hour буква h не читается, слово начинается со звука /aʊ/ → an."},
{type:"choice", q:"He studies at ___ university in Boston.", o:["a","an","the","—"], a:"a", why:"University читается /juː/ — это согласный звук, поэтому a."},
{type:"choice", q:"Can you close ___ door, please?", o:["a","an","the","—"], a:"the", why:"Обоим понятно, какая дверь — та, что здесь."},
{type:"choice", q:"This is ___ best pizza in town.", o:["a","an","the","—"], a:"the", why:"Превосходная степень (best) всегда с the."},
{type:"choice", q:"We had ___ breakfast at eight.", o:["a","an","the","—"], a:"—", why:"Приёмы пищи (breakfast, lunch, dinner) обычно без артикля."}

{id:"cond", lvl:"B1", title:"Условные предложения 0, 1, 2", desc:"If: реально, вероятно, воображаемо",
theory:`<div class="tbl"><table><tr><th>Тип</th><th>Схема</th><th>Пример</th></tr>

<tr><td>1 — реальное будущее</td><td>If + Present, will</td><td class="ex">If it rains, we'll stay home.</td></tr>
<tr><td>2 — воображаемое</td><td>If + Past, would</td><td class="ex">If I had time, I'd travel.</td></tr></table></div>
<p><b>Главная ошибка:</b> will после if. По-русски «если будет дождь», но по-английски <i>if it rains</i>, без will.</p>
<p>Во втором типе для всех лиц можно ставить <b>were</b>: <i>If I were you…</i> В разговорной речи допустимо и was.</p>`,

<li><b>should</b> — совет: стоит, следует.</li>

<p>Правило: <b>немая e на конце</b> не читается, но заставляет гласную перед ней звучать как своё название в алфавите. Русские буквы здесь — лишь подсказка, слушай звук.</p>`,
ex:[
{type:"audio", say:"cake", o:["cake","cat","cut"], a:"cake", why:"Немая e на конце: a читается как «эй» — cake."},
{type:"audio", say:"cat", o:["cat","cake","kite"], a:"cat", why:"Закрытый слог: a звучит как широкое «э» — cat."},
{type:"audio", say:"site", o:["site","sit","set"], a:"site", why:"Немая e: i читается как «ай»."},
{type:"audio", say:"hot", o:["hot","home","hat"], a:"hot", why:"Закрытый слог: o звучит как короткое «о»."},
{type:"audio", say:"cute", o:["cute","cut","cat"], a:"cute", why:"Немая e: u читается как «ю»."},
{type:"audio", say:"bite", o:["bite","bit","bet"], a:"bite", why:"Немая e: i — «ай»."},
{type:"audio", say:"note", o:["note","not","net"], a:"note", why:"Немая e: o — «оу»."},
{type:"audio", say:"plan", o:["plan","plane","pen"], a:"plan", why:"Закрытый слог: a — «э»."}
]},
{id:"read2", lvl:"A0", title:"Чтение: сочетания букв", desc:"sh, ch, th, ee, oo, ph",
theory:`<div class="tbl"><table><tr><th>Буквы</th><th>Звук</th><th>Пример</th></tr>
<tr><td>sh</td><td>«ш»</td><td class="ex">ship, shop</td></tr>
<tr><td>ch</td><td>«ч»</td><td class="ex">chair, child</td></tr>
<tr><td>th</td><td>язык между зубами, /θ/ или /ð/</td><td class="ex">think, this</td></tr>
<tr><td>ee, ea</td><td>долгое «ии»</td><td class="ex">tree, tea</td></tr>
<tr><td>oo</td><td>долгое «уу»</td><td class="ex">moon, food</td></tr>
<tr><td>ph</td><td>«ф»</td><td class="ex">phone</td></tr>
<tr><td>igh</td><td>«ай»</td><td class="ex">night, light</td></tr></table></div>`,
ex:[
{type:"audio", say:"ship", o:["ship","chip","sip"], a:"ship", why:"sh — «ш»."},
{type:"audio", say:"chair", o:["chair","share","hair"], a:"chair", why:"ch — «ч»."},
{type:"audio", say:"think", o:["think","sink","pink"], a:"think", why:"th — язык между зубами, не «с»."},
{type:"audio", say:"tree", o:["tree","try","true"], a:"tree", why:"ee — долгое «ии»."},
{type:"audio", say:"moon", o:["moon","man","mine"], a:"moon", why:"oo — долгое «уу»."},
{type:"audio", say:"phone", o:["phone","bone","cone"], a:"phone", why:"ph — «ф»."},
{type:"audio", say:"night", o:["night","nut","net"], a:"night", why:"igh — «ай», gh не читается."}
]},
{id:"hello", lvl:"A0", title:"Первые фразы", desc:"Познакомиться, поблагодарить, попросить",
theory:`<div class="tbl"><table><tr><th>Фраза</th><th>Значение</th></tr>
<tr><td class="ex">Hello! / Hi!</td><td>Привет! / Здравствуйте!</td></tr>
<tr><td class="ex">My name is Anna.</td><td>Меня зовут Анна.</td></tr>
<tr><td class="ex">I'm from Russia.</td><td>Я из России.</td></tr>
<tr><td class="ex">How are you? — I'm fine, thanks.</td><td>Как дела? — Хорошо, спасибо.</td></tr>
<tr><td class="ex">Nice to meet you.</td><td>Приятно познакомиться.</td></tr>
<tr><td class="ex">Thank you. / Please. / Sorry.</td><td>Спасибо. / Пожалуйста (просьба). / Извините.</td></tr>
<tr><td class="ex">I don't understand.</td><td>Я не понимаю.</td></tr>
<tr><td class="ex">Goodbye! / Bye!</td><td>До свидания! / Пока!</td></tr></table></div>`,
ex:[
{type:"choice", q:"Как сказать «Меня зовут Анна»?", o:["My name is Anna.","Me name Anna.","I name is Anna."], a:"My name is Anna.", why:"My name is… — «моё имя — …». Глагол is обязателен."},
{type:"choice", q:"Что ответить на «How are you?»", o:["I'm fine, thanks.","I'm 25.","I'm from Russia."], a:"I'm fine, thanks.", why:"How are you? — «Как дела?». Обычный ответ: I'm fine, thanks."},
{type:"choice", q:"«Where are you from?» означает…", o:["Откуда ты?","Где ты сейчас?","Куда ты идёшь?"], a:"Откуда ты?", why:"from — «из». Where are you from? — «Откуда ты родом?»"},
{type:"choice", q:"Как вежливо попросить воды?", o:["Water, please.","Give water!","Water you."], a:"Water, please.", why:"Please в конце делает просьбу вежливой."},
{type:"choice", q:"«Nice to meet you» говорят…", o:["при знакомстве","при прощании","когда извиняются"], a:"при знакомстве", why:"Nice to meet you — «Приятно познакомиться»."},
{type:"choice", q:"Как сказать «Я не понимаю»?", o:["I don't understand.","I not understand.","Me no understand."], a:"I don't understand.", why:"Отрицание строится через don't: I don't understand."}
]},
{id:"there", lvl:"A1", title:"There is / There are", desc:"«Есть», «находится»",
theory:`<p>Когда сообщаем, что где-то <b>есть</b> что-то новое, используем <b>there is</b> (один предмет) или <b>there are</b> (несколько).</p>
<p>Русскую фразу удобно читать с конца: «На столе (есть) книга» → <i>There is a book on the table.</i></p>
<ul><li>Вопрос: <span class="ex">Is there a bank near here? Are there any shops?</span></li>
<li>Отрицание: <span class="ex">There isn't any milk. There aren't any chairs.</span></li></ul>`,
ex:[
{q:"___ a bank near here?", a:["is there"], why:"Вопрос про один предмет: Is there…?"},
{q:"There ___ three bedrooms in the flat.", a:["are"], why:"Три комнаты — множественное число → there are."},
{q:"There ___ (not) any milk in the fridge.", a:["isn't","is not"], why:"Milk неисчисляемое → is. Отрицание: isn't."},
{q:"___ any shops on this street?", a:["are there"], why:"Shops — множественное → Are there…?"},
{q:"There ___ a cat on the sofa.", a:["is","'s"], why:"Одна кошка → there is."}
]},
{id:"poss", lvl:"A1", title:"Чей? my, your, his и 's", desc:"Притяжательные слова",
theory:`<div class="tbl"><table><tr><th>Кто</th><th>Чей</th></tr>
<tr><td>I</td><td><b>my</b> — мой</td></tr><tr><td>you</td><td><b>your</b> — твой, ваш</td></tr>
<tr><td>he</td><td><b>his</b> — его</td></tr><tr><td>she</td><td><b>her</b> — её</td></tr>
<tr><td>it</td><td><b>its</b> — его/её (о предмете, животном)</td></tr>
<tr><td>we</td><td><b>our</b> — наш</td></tr><tr><td>they</td><td><b>their</b> — их</td></tr></table></div>
<p>Принадлежность человеку: <b>'s</b> — <i>Anna's car</i> (машина Анны). В русском есть «свой», в английском его нет: «я люблю свою маму» → <i>I love my mom</i>.</p>
<p>Не путай <b>its</b> (его) и <b>it's</b> (= it is).</p>`,
ex:[
{type:"choice", q:"This is ___ brother. (её)", o:["her","she","hers","his"], a:"her", why:"Её → her."},
{type:"choice", q:"Is this ___ phone? (твой)", o:["your","you","yours","you're"], a:"your", why:"Твой → your. You're = you are."},
{type:"choice", q:"___ name is Tom. (его)", o:["His","He","Him","He's"], a:"His", why:"Его (имя) → his."},
{type:"choice", q:"This is ___ car. (машина Анны)", o:["Anna's","Anna","Annas'","of Anna"], a:"Anna's", why:"Принадлежность человеку → 's."},
{type:"choice", q:"We love ___ house. (наш)", o:["our","us","we","ours"], a:"our", why:"Наш → our."},
{type:"choice", q:"The dog is eating ___ food.", o:["its","it's","it","his"], a:"its", why:"О животном → its. It's значит it is."}
]},
{id:"comp", lvl:"A2", title:"Сравнение: -er, more, the most", desc:"Больше, лучше, самый",
theory:`<div class="tbl"><table><tr><th>Слово</th><th>Сравнение</th><th>Самый</th></tr>
<tr><td>короткое: big, hot, cheap</td><td>+ <b>-er</b> than: bigger, hotter</td><td><b>the -est</b>: the biggest</td></tr>
<tr><td>длинное: interesting, expensive</td><td><b>more</b> interesting</td><td><b>the most</b> interesting</td></tr>
<tr><td>на -y: easy, happy</td><td>easier</td><td>the easiest</td></tr>
<tr><td>исключения</td><td>good → better, bad → worse</td><td>the best, the worst</td></tr></table></div>
<p>«Чем» — <b>than</b>: <i>She is older than me.</i> Если короткое слово кончается на гласная + согласная, согласная удваивается: big → bigger.</p>`,
ex:[
{q:"My flat is ___ (big) than yours.", a:["bigger"], why:"Короткое слово: big → bigger (g удваивается)."},
{q:"This book is ___ (interesting) than the film.", a:["more interesting"], why:"Длинное слово → more + слово."},
{q:"It's the ___ (good) day of my life.", a:["best"], why:"Исключение: good → better → the best."},
{q:"Today is ___ (hot) than yesterday.", a:["hotter"], why:"hot → hotter, t удваивается."},
{q:"My English is ___ (bad) than my French.", a:["worse"], why:"Исключение: bad → worse."},
{q:"This is the ___ (expensive) hotel in town.", a:["most expensive"], why:"Длинное слово → the most."},
{q:"The test was ___ (easy) than I expected.", a:["easier"], why:"На -y: y меняется на i + er."}
]},
{id:"irr", lvl:"A2", title:"Past Simple: неправильные глаголы", desc:"went, saw, bought",
theory:`<p>Обычные глаголы в прошедшем времени получают <b>-ed</b>: work → worked, stop → stopped. Самые частые глаголы <b>неправильные</b>, их формы надо запомнить:</p>
<div class="tbl"><table><tr><th>Глагол</th><th>Прошедшее</th><th>Глагол</th><th>Прошедшее</th></tr>
<tr><td>go</td><td>went</td><td>buy</td><td>bought</td></tr><tr><td>see</td><td>saw</td><td>think</td><td>thought</td></tr>
<tr><td>come</td><td>came</td><td>take</td><td>took</td></tr><tr><td>have</td><td>had</td><td>make</td><td>made</td></tr></table></div>
<p>В вопросе и отрицании нужен <b>did</b>, а глагол возвращается в обычную форму: <i>Did you see? I didn't go.</i> Не «didn't went»!</p>`,
ex:[
{q:"Yesterday I ___ (go) to the cinema.", a:["went"], why:"go → went."},
{q:"We ___ (watch) a film last night.", a:["watched"], why:"Правильный глагол: + ed."},
{q:"She ___ (buy) a new dress.", a:["bought"], why:"buy → bought."},
{q:"I ___ (not / see) him yesterday.", a:["didn't see","did not see"], why:"Отрицание: didn't + глагол в обычной форме."},
{q:"___ (you / call) your mom?", a:["did you call"], why:"Вопрос в прошлом: Did + кто + глагол."},
{q:"They ___ (come) home late.", a:["came"], why:"come → came."},
{q:"He ___ (stop) the car.", a:["stopped"], why:"stop → stopped, p удваивается."},
{q:"I ___ (think) about you.", a:["thought"], why:"think → thought."}
]},
{id:"quest", lvl:"A2", title:"Вопросы: порядок слов", desc:"Вспомогательный глагол перед подлежащим",
theory:`<p>По-русски вопрос можно задать интонацией: «Ты работаешь?». В английском меняется порядок слов, и нужен <b>вспомогательный глагол</b>:</p>
<p><b>Вопросительное слово + do/does/did/am/is/are/have + кто + глагол</b></p>
<ul><li><span class="ex">Where do you work?</span></li><li><span class="ex">What is she doing?</span></li><li><span class="ex">When did they arrive?</span></li></ul>
<p><b>Исключение:</b> если спрашиваем <i>кто?</i> или <i>что?</i> о самом действующем лице, вспомогательный не нужен: <i>Who called you?</i></p>`,
ex:[
{q:"Where ___ (you / work)?", a:["do you work"], why:"Present Simple: do + you + глагол."},
{q:"What ___ (she / want)?", a:["does she want"], why:"She → does, глагол без -s."},
{q:"When ___ (they / arrive) yesterday?", a:["did they arrive"], why:"Прошлое → did."},
{q:"Why ___ (you / be) sad?", a:["are you"], why:"С глаголом be вспомогательный не нужен: are встаёт вперёд."},
{q:"What ___ (you / do) now?", a:["are you doing"], why:"Сейчас → are + you + -ing."},
{q:"Who ___ (call) you yesterday?", a:["called"], why:"Вопрос к подлежащему (кто?): без did, глагол сразу в прошедшем."}
]},
{id:"count", lvl:"A2", title:"some, any, much, many", desc:"Исчисляемое и неисчисляемое",
theory:`<p>Существительные бывают <b>исчисляемые</b> (an apple, two apples) и <b>неисчисляемые</b> (water, money, advice, information). Неисчисляемые не имеют множественного числа и артикля a.</p>
<div class="tbl"><table><tr><th></th><th>Исчисляемые</th><th>Неисчисляемые</th></tr>
<tr><td>Много (в вопросах и отрицаниях)</td><td><b>many</b> friends</td><td><b>much</b> time</td></tr>
<tr><td>Много (в утверждении)</td><td colspan="2"><b>a lot of</b> — подходит для обоих</td></tr>
<tr><td>Немного, какие-то</td><td colspan="2"><b>some</b> — в утверждениях и предложениях; <b>any</b> — в вопросах и отрицаниях</td></tr></table></div>
<p>Ловушка: <i>advice, news, information, money</i> — неисчисляемые, хотя по-русски бывают «советы», «новости».</p>`,
ex:[
{type:"choice", q:"How ___ money do you have?", o:["much","many"], a:"much", why:"Money неисчисляемое → much."},
{type:"choice", q:"How ___ people came?", o:["many","much"], a:"many", why:"People исчисляемое → many."},
{type:"choice", q:"There isn't ___ milk.", o:["any","some","many"], a:"any", why:"Отрицание → any."},
{type:"choice", q:"Would you like ___ tea?", o:["some","any","many"], a:"some", why:"В предложении-угощении используют some."},
{type:"choice", q:"I don't have ___ friends here.", o:["many","much"], a:"many", why:"Friends исчисляемое → many."},
{type:"choice", q:"Can I give you ___ advice?", o:["some","an","many"], a:"some", why:"Advice неисчисляемое: some advice, но не an advice."}
]},
{id:"used", lvl:"B1", title:"used to и be used to", desc:"«Раньше делал» и «привык»",
theory:`<div class="tbl"><table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td><b>used to</b> + глагол</td><td>раньше (а теперь нет)</td><td class="ex">I used to smoke.</td></tr>
<tr><td><b>be used to</b> + -ing</td><td>привык (сейчас)</td><td class="ex">I'm used to getting up early.</td></tr>
<tr><td><b>get used to</b> + -ing</td><td>привыкать</td><td class="ex">I'm getting used to the cold.</td></tr></table></div>
<p>В вопросе и отрицании с did буква d пропадает: <i>Did you use to…? I didn't use to…</i></p>`,
ex:[
{type:"choice", q:"When I was a child, I ___ play football every day.", o:["used to","am used to","use to"], a:"used to", why:"Привычка в прошлом, которой больше нет → used to."},
{type:"choice", q:"I've lived here for years, so I ___ the cold.", o:["am used to","used to","use to"], a:"am used to", why:"Привык сейчас → be used to."},
{type:"choice", q:"She ___ getting up early. It's hard for her.", o:["isn't used to","didn't use to","doesn't used to"], a:"isn't used to", why:"Не привыкла сейчас → isn't used to + -ing."},
{type:"choice", q:"There ___ be a cinema here, but it closed.", o:["used to","was used to","uses to"], a:"used to", why:"Раньше было, теперь нет → used to."},
{type:"choice", q:"Did you ___ have long hair?", o:["use to","used to","using to"], a:"use to", why:"После did — use to без d."},
{type:"choice", q:"I'm getting ___ driving on the left.", o:["used to","use to","using"], a:"used to", why:"Get used to + -ing — привыкать."}
]},
{id:"rel", lvl:"B1", title:"who, which, that, where", desc:"Человек, который…",
theory:`<ul><li><b>who</b> — о людях: <span class="ex">the man who lives here</span></li>
<li><b>which</b> — о предметах и животных: <span class="ex">the phone which I bought</span></li>
<li><b>that</b> — и о людях, и о предметах (разговорное)</li>
<li><b>where</b> — о месте: <span class="ex">the café where we met</span></li>
<li><b>whose</b> — чей: <span class="ex">the woman whose husband is a pilot</span></li></ul>`,
ex:[
{type:"choice", q:"The man ___ lives next door is a doctor.", o:["who","which","where"], a:"who", why:"О человеке → who."},
{type:"choice", q:"This is the book ___ I told you about.", o:["that","who","where"], a:"that", why:"О предмете → that (или which)."},
{type:"choice", q:"That's the café ___ we first met.", o:["where","which","who"], a:"where", why:"О месте → where."},
{type:"choice", q:"I have a friend ___ speaks five languages.", o:["who","which","where"], a:"who", why:"О человеке → who."},
{type:"choice", q:"The phone ___ I bought is broken.", o:["which","who","where"], a:"which", why:"О предмете → which."},
{type:"choice", q:"She's the woman ___ husband is a pilot.", o:["whose","who","who's"], a:"whose", why:"Чей муж → whose. Who's = who is."}
]},
{id:"modperf", lvl:"B2", title:"should have, must have, might have", desc:"Сожаления и догадки о прошлом",
theory:`<div class="tbl"><table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td><b>should have</b> + 3-я форма</td><td>надо было (а не сделал)</td><td class="ex">You should have told me.</td></tr>
<tr><td><b>must have</b> + 3-я форма</td><td>наверняка (уверенная догадка)</td><td class="ex">It must have rained.</td></tr>
<tr><td><b>might / may have</b></td><td>возможно</td><td class="ex">He might have missed the bus.</td></tr>
<tr><td><b>can't / couldn't have</b></td><td>не может быть, чтобы</td><td class="ex">She can't have seen us.</td></tr>
<tr><td><b>could have</b></td><td>мог бы (но не сделал)</td><td class="ex">We could have won.</td></tr></table></div>`,
ex:[
{q:"You ___ (should / tell) me earlier.", a:["should have told","should've told"], why:"Упрёк о прошлом → should have + 3-я форма."},
{q:"He's not here. He ___ (might / miss) the bus.", a:["might have missed","might've missed","may have missed"], why:"Возможная причина → might have."},
{q:"The streets are wet. It ___ (must / rain) at night.", a:["must have rained","must've rained"], why:"Уверенная догадка по признакам → must have."},
{q:"She ___ (can't / see) us, or she would have said hello.", a:["can't have seen","couldn't have seen","cannot have seen"], why:"Не может быть → can't have."},
{q:"I ___ (shouldn't / eat) so much.", a:["shouldn't have eaten","should not have eaten"], why:"Сожаление → shouldn't have + 3-я форма."},
{q:"They ___ (could / win) if they had tried harder.", a:["could have won","could've won"], why:"Мог бы, но не вышло → could have."}
]});

{l:"B2", title:"The myth of multitasking", text:"Many of us are proud of our ability to multitask, but research suggests that the brain cannot genuinely focus on two demanding tasks at once. What we call multitasking is actually rapid switching between tasks, and every switch has a cost. Studies have shown that people who constantly switch between email, messages and work make more mistakes and take longer to finish. Moreover, heavy multitaskers often find it harder to ignore irrelevant information. The solution is not to work harder, but to work in focused blocks: turn off notifications, deal with one task at a time and take short breaks.",

/* ===================== TEXT MATCHING ===================== */
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"«»]/g," ");
  s=s.replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not")
     .replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'m\b/g," am").replace(/'d\b/g," would");
  return s.replace(/[.,!?;:()–—]/g," ").replace(/\s-\s/g," ").replace(/\s+/g," ").trim();
}
function expand(s){
  const m=s.match(/\[([^\[\]]*)\]/);
  if(!m)return[s.replace(/\s+/g," ").replace(/\s+([,.?!])/g,"$1").trim()];
  const out=[];for(const o of m[1].split("|"))out.push(...expand(s.slice(0,m.index)+o+s.slice(m.index+m[0].length)));return out;
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// returns {status:'ok'|'typo'|'bad', best:originalVariant}
function check(user,variants,tol=true){
  const u=norm(user);let best=variants[0],bd=1e9;
  for(const v of variants){const d=lev(u,norm(v));if(d<bd){bd=d;best=v}}
  if(bd===0)return{status:"ok",best};
  const L=norm(best).length;const lim=L<=5?1:Math.max(1,Math.round(L*0.06));
  if(tol&&bd<=lim&&u.length>0)return{status:"typo",best};
  return{status:"bad",best};
}
function wordDiff(user,target){
  const a=norm(user).split(" ").filter(Boolean),bOrig=target.replace(/[.,!?;:]/g,"").split(/\s+/).filter(Boolean),b=bOrig.map(w=>norm(w));
  const m=a.length,n=b.length,L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out=[];
  while(i<m&&j<n){if(a[i]===b[j]){out.push(esc(bOrig[j]));i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push('<span class="extra">'+esc(a[i])+'</span>');i++}else{out.push('<span class="miss">'+esc(bOrig[j])+'</span>');j++}}
  while(i<m)out.push('<span class="extra">'+esc(a[i++])+'</span>');
  while(j<n)out.push('<span class="miss">'+esc(bOrig[j++])+'</span>');
  return out.join(" ");
}

function schedule(c0,g){
  const c=Object.assign({ease:2.5,ivl:0,reps:0,lapses:0,added:dkey()},c0||{});c.upd=Date.now();
  if(g===0){c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=Date.now()+10*60e3;return c}

}

  if(t.autoSay&&!r&&MS.saidFor!==m.key){MS.saidFor=m.key;speak(t.autoSay)}

function answerReview(v){
  const m=MS.cur,t=taskOf(m);let ok=false,typo=false,best=t.show;
  if(!v)ok=false;
  else if(t.input==="choice")ok=v===t.answers[0];
  else if(t.input==="inline")ok=t.answers.some(a=>norm(a)===norm(v));
  else{const c=check(v,t.answers,t.tol);ok=c.status!=="bad";typo=c.status==="typo";best=c.best}
  if(m.synthetic){const w=wordById(m.ref);S.cards[w.id]=schedule(S.cards[w.id],ok?(typo?1:2):0);mistake("word",w.id,ok,v,{t:"vocab",l:w.lvl||null});
    MS.done++;if(ok)MS.ok++;bump(ok,w.lvl||null);save();MS.res={ok,typo,user:v,best,syn:fmtIvl(S.cards[w.id])};renderReview();speak(w.en);return}
  m.prevLast=m.last;
  const before=m.s;
  if(ok){m.s++;if(m.s>=3){m.done=true;m.fixed=Date.now()}else m.due=Date.now()+[1,3][m.s-1]*DAY-3*3600e3}
  else{m.n++;m.s=0;m.last=v;m.lastAt=Date.now();m.due=Date.now()+10*60e3}
  m.upd=Date.now();MS.done++;if(ok)MS.ok++;
  bump(ok,m.l||null);save();
  MS.res={ok,typo,user:v,best,before};renderReview();
  if(t.say&&m.k==="word")speak(t.say);
}

/* ---------- CARDS ---------- */
let CS=null;

function nextCard(){CS.cur=CS.queue.shift()||null;CS.revealed=false;CS.hint=0;CS.res=null;renderCard()}
function viewCards(){if(!CS||(!CS.cur&&!CS.queue.length&&(dueWords().length||newLeft())))startCards();else renderCard()}

    ${yasay("happy","Послушай и повтори вслух 2–3 раза. Через пару карточек я спрошу это слово — проверим, запомнилось ли.",56)}

      body+=hint+`<input type="text" id="ans" class="big-input" placeholder="Напиши по-английски" autocomplete="off" autocapitalize="off" spellcheck="false">

function bindDir(){V.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{S.settings.dir=b.dataset.dir;save();if(CS){CS.revealed=false;CS.res=null;CS.hint=0}renderCard()})}
function doCheck(){const w=CS.cur,u=$("#ans").value.trim();const r=check(u,w.en.split(/\s*[\/;]\s*/));r.user=u;mistake("word",w.id,r.status!=="bad",u,{t:"vocab",l:w.lvl||null});reveal(r)}
function reveal(r){CS.revealed=true;CS.res=r;renderCard();if(S.settings.dir==="ru-en")speak(CS.cur.en);const g=V.querySelector(".grades .sugg")||V.querySelector("[data-g='2']");if(g)g.focus()}
function gradeCard(g){
  const w=CS.cur;S.cards[w.id]=schedule(S.cards[w.id],g);
  CS.done++;if(g>=2)CS.right++;bump(g>=1,w.lvl||null);

document.addEventListener("keydown",e=>{

/* ---------- GRAMMAR ---------- */
let GS=null;
function viewGrammar(){
  if(GS&&GS.active){renderLesson();return}
  const L=T(),order=[L].concat(LEVELS.filter(x=>x!==L));
  const row=l=>{const r=S.lessons[l.id];const cls=!r?"none":r.best/r.total>=.85?"good":"mid";const me=Object.values(S.mist).filter(m=>m.t===l.id&&!m.done).length;
    return `<button class="lesson" data-id="${l.id}"><span class="lvl">${l.lvl}</span><span><span class="t">${esc(l.title)}</span><br><span class="d">${esc(l.desc)}${me?` · <span class="bad-t">ошибок в работе: ${me}</span>`:""}</span></span><span class="score ${cls}">${r?r.best+" / "+r.total:"не пройден"}</span></button>`};
  V.innerHTML=`<h1>Грамматика</h1><p class="sub">Короткое правило, потом упражнения. После каждого ответа видно объяснение, а ошибки уходят в «Ошибки».</p>
  <div class="stack"><section class="sheet verbcard"><div style="min-width:0"><b>Неправильные глаголы</b><p class="small muted" style="margin:2px 0 0">go — went — gone. ${verbPool().length} глаголов для уровня ${L}; чаще попадаются те, где ошибаешься</p></div><a class="btn primary" href="#verbs">Тренировать</a></section>${order.map(x=>{const ls=LESSONS.filter(l=>l.lvl===x);if(!ls.length)return"";const tag=x===L?["now","твой уровень"]:li(x)<li(L)?["low","повторение"]:["high","следующий шаг"];
    return `<section><div class="lvlhead"><h2 style="margin:0">${x} · ${LVLNAME[x]}</h2><span class="pill lv-${tag[0]}">${tag[1]}</span></div><div class="lessons">${ls.map(row).join("")}</div></section>`}).join("")}</div>`;
  V.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>openLesson(b.dataset.id));
}
function openLesson(id,only){
  const l=LESSONS.find(x=>x.id===id);
  GS={active:true,l,stage:only?"ex":"theory",items:only||shuffle(l.ex.map((_,i)=>i)),i:0,right:0,wrong:[],ans:null,retry:!!only};

}

    ruleRead(l.id);$("#go").onclick=()=>{GS.stage="ex";renderLesson()};
  }else if(GS.stage==="ex"){

    let q="";
    if(e.o){
      q=(e.type==="audio"?audioQ(e.say):`<div class="q">${esc(e.q).replace("___",'<b>___</b>')}</div>`)+`<div class="choices">${e.o.map(o=>{let c="";if(done){if(o===e.a)c=" right";else if(o===GS.ans)c=" wrong"}return `<button class="btn${c}" data-o="${esc(o)}" ${done?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`;
    }else{
      const [pre,post]=e.q.split("___");const w=Math.max(8,Math.max(...e.a.map(a=>a.length))+2);
      q=`<div class="q">${esc(pre)}<input type="text" id="gin" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" ${done?"disabled":""} aria-label="Ответ">${esc(post)}</div>
      ${done?"":`<div class="row"><button class="btn primary" id="gchk">Проверить</button><button class="btn ghost" id="gidk">Не знаю</button></div>`}`;
    }
    let fb="";
    if(done){
      const ok=GS.ok;
      fb=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Верно":"Неверно"}${!ok&&!e.o?` <span>Правильно: <b>${esc(e.a[0])}</b>${GS.ans?` · у тебя: ${esc(GS.ans)}`:""}</span>`:""}</div>
      <div class="why">${esc(e.why)}</div>
      <div class="row"><button class="btn primary" id="gnext">${GS.i+1<GS.items.length?"Дальше":"Результат"}</button>${e.type==="audio"?sayBtn(e.say):/[а-яё]/i.test(e.q.replace(/\([^)]*\)/g,""))?"":sayBtn(e.q.replace(/___\s*\([^)]*\)|___/,e.o?(e.a==="—"?"":e.a):e.a[0]).replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim(),"Озвучить предложение")}</div>`;
    }
    V.innerHTML=`${back}<div class="row" style="justify-content:space-between;margin:8px 0 10px"><h2 style="margin:0">${esc(l.title)}${GS.retry?" · работа над ошибками":""}</h2><span class="small muted">${GS.i+1} / ${GS.items.length}</span></div>
    <div class="progress" style="margin-bottom:16px"><i style="width:${GS.i/GS.items.length*100}%"></i></div>
    <div class="card">${q}${fb}<div class="row"><button class="btn ghost small" data-rule-open="${l.id}">Правило и подробный разбор</button></div></div>`;
    if(e.type==="audio"&&!done&&GS.said!==GS.i){GS.said=GS.i;speak(e.say)}
    const gin=$("#gin");
    if(gin&&!done){gin.focus();gin.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();answerG(gin.value.trim())}}}
    const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
    on("gchk",()=>answerG(gin.value.trim()));on("gidk",()=>answerG(""));
    V.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answerG(b.dataset.o));
    on("gnext",()=>{GS.i++;GS.ans=null;if(GS.i>=GS.items.length)GS.stage="end";renderLesson()});
    const nx=$("#gnext");if(nx)nx.focus();
  }else{
    const t=GS.items.length;
    if(!GS.retry){const prev=S.lessons[l.id];S.lessons[l.id]={best:Math.max(GS.right,prev?prev.best:0),total:t,last:dkey()};save()}
    const pct=GS.right/t;

      buttons:`${GS.wrong.length?`<button class="btn primary" id="retry">Повторить ошибки (${GS.wrong.length})</button>`:""}<button class="btn" id="again">Пройти заново</button><button class="btn ghost" id="list">К урокам</button>`});
    const r=$("#retry");if(r)r.onclick=()=>openLesson(l.id,shuffle(GS.wrong));
    $("#again").onclick=()=>openLesson(l.id);$("#list").onclick=()=>{GS=null;viewGrammar()};
  }

}
function answerG(v){
  const e=GS.l.ex[GS.items[GS.i]];
  const ok=e.o?v===e.a:!!v&&e.a.some(a=>norm(a)===norm(v));
  GS.ans=v;GS.ok=ok;if(ok)GS.right++;else GS.wrong.push(GS.items[GS.i]);
  mistake("grammar",GS.l.id+":"+GS.items[GS.i],ok,v,{t:GS.l.id,l:GS.l.lvl});
  bump(ok,GS.l.lvl);renderLesson();
}

/* ---------- TRANSLATE ---------- */
let TS=null;
function startTranslate(){
  const L=T();const order=SENTENCES.map((s,i)=>({s,i})).filter(x=>li(x.s.l)<=li(L)).map(({s,i})=>{const r=S.tr[i]||{n:0,ok:0};return{i,k:(r.n?r.ok/r.n:0.4)+(r.n?0:-0.2)+Math.random()*0.6+(s.l===L?-0.35:0.1)}}).sort((a,b)=>a.k-b.k).slice(0,10).map(x=>x.i);
  TS={items:order,i:0,right:0,res:null};
}
function viewTranslate(){if(!TS)startTranslate();renderTr()}
function renderTr(){
  if(TS.i>=TS.items.length){
    V.innerHTML=resultHTML({title:"Перевод фраз",right:TS.right,total:TS.items.length,note:"Фразы с ошибками будут попадаться чаще, пока не станут лёгкими.",buttons:`<button class="btn primary" id="again">Ещё 10 фраз</button><a class="btn" href="#today">На главную</a>`});
    $("#again").onclick=()=>{startTranslate();renderTr()};return;
  }
  const s=SENTENCES[TS.items[TS.i]],vars=s.en.flatMap(expand),r=TS.res,tiles=!r&&trTiles();
  if(tiles&&TS.tilesFor!==TS.i+":"+TS.items[TS.i]){TS.tilesFor=TS.i+":"+TS.items[TS.i];
    const words=vars[0].replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean),low=words.map(x=>x.toLowerCase());
    const other=shuffle(SENTENCES.filter(x=>x!==s&&li(x.l)<=li(s.l)+1).flatMap(x=>expand(x.en[0])[0].replace(/[.,!?]/g,"").split(/\s+/))).filter(x=>!low.includes(x.toLowerCase()));
    const extra=[...new Set(other)].slice(0,2);TS.tiles={pool:shuffle(words.concat(extra)).map(w=>({w,u:false})),pick:[]}}
  let fb="";
  if(r){
    const others=vars.filter(v=>v!==r.best).slice(0,3);

let RS=null,RG={busy:false,err:"",topic:"",ctl:null};
const IRREG={went:"go",gone:"go",saw:"see",seen:"see",bought:"buy",was:"be",were:"be",is:"be",am:"be",are:"be",has:"have",had:"have",made:"make",took:"take",came:"come",thought:"think",ate:"eat",drank:"drink",slept:"sleep",told:"tell",said:"say",spoke:"speak",wrote:"write",knew:"know",felt:"feel",found:"find",brought:"bring",left:"leave",won:"win",lost:"lose",sent:"send",spent:"spend",chose:"choose"};
function lookup(raw){
  const w=raw.toLowerCase().replace(/^'+|'+$/g,"").replace(/'s$/,"");
  const c=[w,IRREG[w]];
  if(w.endsWith("ies"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("ied"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("es"))c.push(w.slice(0,-2));
  if(w.endsWith("s"))c.push(w.slice(0,-1));
  if(w.endsWith("ed")){c.push(w.slice(0,-2),w.slice(0,-1));if(/(.)\1ed$/.test(w))c.push(w.slice(0,-3))}
  if(w.endsWith("ing")){c.push(w.slice(0,-3),w.slice(0,-3)+"e");if(/(.)\1ing$/.test(w))c.push(w.slice(0,-4))}
  if(w.endsWith("ly"))c.push(w.slice(0,-2));
  const all=allWords();
  for(const x of c){if(!x)continue;const f=all.find(a=>a.en.toLowerCase()===x);if(f)return f}
  return null;
}
function allTexts(){return TEXTS.map((t,i)=>Object.assign({key:String(i)},t)).concat((S.genTexts||[]).map(t=>Object.assign({key:t.id},t))).concat(packTexts())}

const AI={fn:null,off:false,p:null};
function getAI(){
  if(!AI.p)AI.p=(window.claude&&window.claude.use?window.claude.use("sample"):Promise.resolve(null))
    .then(f=>{AI.fn=f;if(!f)AI.off=true;return f}).catch(()=>{AI.off=true;return null});
  return AI.p;
}
getAI().then(()=>{if(AI.off&&["practice"].includes((location.hash||"").slice(1)))route()});
function aiErr(e){
  const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){AI.off=true;return"ИИ недоступен: доступ к Claude для этой страницы не разрешён. Остальные разделы работают как обычно."}
  if(c==="rate_limited")return"Сейчас слишком много запросов или исчерпан лимит Claude. Попробуй чуть позже.";
  if(c==="session_expired")return"Нужно заново войти в claude.ai.";
  if(c==="cancelled")return"";
  if(c==="invalid_json")return"ИИ ответил в неожиданном формате. Нажми ещё раз.";
  if(c==="refused")return"ИИ отказался отвечать на этот текст. Попробуй переформулировать.";
  return"Не удалось связаться с ИИ. Попробуй ещё раз.";
}
async function aiJSON(prompt,opts){const f=await getAI();if(!f)throw{code:"not_granted"};return f.json(prompt,opts||{})}
async function aiText(input,opts){const f=await getAI();if(!f)throw{code:"not_granted"};return f(input,opts||{})}
function validTopic(t){return t&&LESSONS.some(l=>l.id===t)?t:null}
function topicsList(){return LESSONS.map(l=>l.id+" = "+l.title).join("; ")}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
function sentenceWith(text,frag){const ss=text.split(/(?<=[.!?])\s+/);return ss.find(x=>x.includes(frag))||frag}
function aiMistake(wrong,right,why,topic,ctx,src){
  if(!wrong||!right||norm(wrong)===norm(right))return;

}

const SYNC={ref:null,state:"local",lastJSON:"",timer:null,writing:Promise.resolve()};
function mergeState(a,b){
  const newer=(b.updatedAt||0)>(a.updatedAt||0)?b:a,older=newer===a?b:a;
  if((newer.resetAt||0)>(older.updatedAt||0))return Object.assign({},DEF,newer);
  const out=JSON.parse(JSON.stringify(newer));
  const pick=(x,y,better)=>{const r=Object.assign({},x||{});for(const k in (y||{})){if(!(k in r)||better(y[k],r[k]))r[k]=y[k]}return r};
  const byUpd=(o,n)=>(o.upd||0)>(n.upd||0);
  out.cards=pick(newer.cards,older.cards,byUpd);
  out.mist=pick(newer.mist,older.mist,byUpd);
  out.days=pick(newer.days,older.days,(o,n)=>(o.n||0)>(n.n||0));
  out.lessons=pick(newer.lessons,older.lessons,(o,n)=>(o.best||0)>(n.best||0));
  out.read=pick(newer.read,older.read,(o,n)=>(o.best||0)>(n.best||0));
  out.tr=pick(newer.tr,older.tr,(o,n)=>(o.n||0)>(n.n||0));
  out.packs=Object.assign({},older.packs||{},newer.packs||{});
  out.readRules=Object.assign({},older.readRules||{},newer.readRules||{});
  out.course=pick(newer.course,older.course,(o,n)=>(o.right||0)>(n.right||0));
  out.verbs=pick(newer.verbs,older.verbs,(o,n)=>(o.n||0)>(n.n||0));
  out.sets=Object.assign({},older.sets||{},newer.sets||{});
  const del=new Set([...(newer.deleted||[]),...(older.deleted||[])]);out.deleted=[...del].slice(-500);
  const union=(x,y,key)=>{const m=new Map();for(const it of [...(y||[]),...(x||[])])m.set(it[key],it);return [...m.values()]};
  out.custom=union(newer.custom,older.custom,"id").filter(c=>!del.has(c.id));
  out.genTexts=union(newer.genTexts,older.genTexts,"id").filter(t=>!del.has(t.id)).slice(-15);
  out.writings=union(newer.writings,older.writings,"date").sort((p,q)=>p.date-q.date).slice(-10);
  out.frozen=[...new Set([...(newer.frozen||[]),...(older.frozen||[])])].slice(-60);
  out.totalAns=Math.max(newer.totalAns||0,older.totalAns||0);
  return Object.assign({},DEF,out,{settings:Object.assign({},DEF.settings,out.settings||{})});
}
function syncLabel(){return{local:window.__NATIVE_APP?"Прогресс хранится на этом телефоне. Перенести его можно на вкладке «Слова»":"Прогресс хранится только в этом браузере",loading:"Подключаюсь к аккаунту…",synced:"Прогресс сохранён в аккаунте claude.ai и одинаков на всех устройствах",offline:"Нет связи с аккаунтом, прогресс пока сохраняется в браузере",error:"Не удалось сохранить в аккаунт, прогресс пока сохраняется в браузере"}[SYNC.state]}

function pushSync(){
  if(!SYNC.ref)return;
  SYNC.writing=SYNC.writing.then(async()=>{
    const j=JSON.stringify(S);if(j===SYNC.lastJSON)return;
    try{await SYNC.ref.set({s:j,updatedAt:Date.now()});SYNC.lastJSON=j;if(SYNC.state!=="synced"){SYNC.state="synced";syncUI()}}
    catch(e){SYNC.state=e&&e.code==="invalid_argument"?"local":"error";if(SYNC.state==="local")SYNC.ref=null;syncUI()}

async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    SYNC.ref=db.doc("data/users/"+uid+"/state");SYNC.state="loading";syncUI();
    const to=setTimeout(()=>{if(SYNC.state==="loading"){SYNC.state="offline";syncUI()}},10000);
    SYNC.ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const d=snap.exists?snap.data():null;
      if(d&&typeof d.s==="string"&&d.s!==SYNC.lastJSON){
        let remote=null;try{remote=JSON.parse(d.s)}catch(e){}
        if(remote){const before=JSON.stringify(S);S=mergeState(S,remote);SYNC.lastJSON=d.s;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          if(JSON.stringify(S)!==before)softRefresh()}
      }
      if(!snap.metadata.fromCache){clearTimeout(to);if(SYNC.state!=="synced"){SYNC.state="synced";syncUI()}pushSync()}
    },e=>{clearTimeout(to);SYNC.state="error";syncUI()});
  }catch(e){SYNC.state="local";syncUI()}
}

function chatRules(sc,L){
  const simple=li(L)<=1?" Use very simple words and short sentences. If the student seems lost, add a Russian hint in brackets.":"";
  return `You are role-playing for English conversation practice. Your role: ${sc.role}. The student is a native Russian speaker learning English, level ${L}.
Rules:
- Reply ONLY in English, 1–3 short sentences, vocabulary and grammar of level ${L}.${simple} End with a question or prompt so the conversation continues.
- If the student writes in Russian or doesn't know a word, gently give the English version.
- Before your reply, output exactly one service line about the student's LAST message:
FIX: <corrected version of the student's message> || <short explanation of the main mistake in Russian>

function parseChat(raw){
  const m=raw.match(/^\s*FIX:\s*(.*)$/m);let fix=null,body=raw;
  if(m){body=raw.slice(m.index+m[0].length).trim();const v=m[1].trim();if(v&&!/^ok\.?$/i.test(v)){const [c,e]=v.split("||");if(c&&c.trim())fix={right:c.trim(),why:(e||"").trim()}}}
  else if(/^\s*FIX/.test(raw))body="";
  return{fix,body};
}

{t:"В кафе",g:"Заказать и спросить цену",
w:["menu",["can I have","можно мне…","/kæn aɪ hæv/","Can I have a coffee, please?","Можно мне кофе, пожалуйста?"],["how much","сколько (стоит)","/haʊ mʌtʃ/","How much is it?","Сколько это стоит?"],"bill",["cup","чашка","/kʌp/","A cup of tea, please.","Чашку чая, пожалуйста."],["sugar","сахар","/ˈʃʊɡə/","Tea with sugar, please.","Чай с сахаром, пожалуйста."]],

d:[["A","Hello! What would you like?","Здравствуйте! Что желаете?"],["B","Can I have a cup of tea, please?","Можно чашку чая, пожалуйста?"],["A","With sugar?","С сахаром?"],["B","No, thank you. How much is it?","Нет, спасибо. Сколько с меня?"],["A","Two pounds, please.","Два фунта, пожалуйста."]],
tr:[{ru:"Можно мне кофе, пожалуйста?",en:["[Can|Could|May] I have [a |]coffee, please?","I would like [a |]coffee, please."]},{ru:"Сколько это стоит?",en:["How much is it?","How much is this?","How much does it cost?"]},{ru:"Счёт, пожалуйста.",en:["The bill, please.","Can I have the bill, please?","The check, please."]}]},

{t:"Я умею: can",g:"Рассказать, что ты умеешь, и попросить о помощи",
w:[["can","мочь, уметь","/kæn/","I can swim.","Я умею плавать."],["swim","плавать","/swɪm/","Can you swim?","Ты умеешь плавать?"],["drive","водить машину","/draɪv/","My mother can't drive.","Моя мама не умеет водить."],["cook","готовить (еду)","/kʊk/","I cook dinner every day.","Я готовлю ужин каждый день."],["play","играть","/pleɪ/","Let's play football.","Давай сыграем в футбол."],["sing","петь","/sɪŋ/","She can sing very well.","Она очень хорошо поёт."]],

d:[["A","Can you cook?","Ты умеешь готовить?"],["B","Yes, I can. I can cook pasta and soup.","Да. Умею готовить пасту и суп."],["A","I can't cook at all!","А я совсем не умею!"],["B","Come to dinner on Friday, then!","Тогда приходи на ужин в пятницу!"]],
tr:[{ru:"Я умею плавать.",en:["I can swim."]},{ru:"Она не умеет водить.",en:["She [can't|cannot] drive."]},{ru:"Ты можешь мне помочь?",en:["[Can|Could] you help me?"]}]},

{t:"Погода",g:"Поговорить о погоде",

tr:[{ru:"Сегодня холодно.",en:["It is cold today.","Today it is cold."]},{ru:"Мне жарко.",en:["I am hot."]},{ru:"Идёт снег.",en:["It is snowing."]}]},

function courseScreens(L){

  shuffle(words).forEach(w=>sc.push({type:"choice",say:w.en,q:"Что значит «"+w.en+"»?",o:shuffle([w.ru].concat(shuffle(pool.filter(x=>x.ru!==w.ru&&x.id!==w.id)).slice(0,2).map(x=>x.ru))),a:w.ru,wid:w.id}));
  shuffle(words).slice(0,2).forEach(w=>sc.push({type:"type",q:w.ru,a:[w.en],say:w.en,wid:w.id}));

  const lines=L.d.map(x=>x[1]);

      q=`<div class="label">Собери перевод из слов</div><div class="prompt" style="font-size:clamp(21px,4.4vw,28px)">${esc(e.ru)}</div>
      ${r?`<div class="q">${esc(r.user||"—")}</div>`:`<div class="tline" id="tline"></div><div class="tpool" id="tpool"></div><div class="row"><button class="btn primary" id="clchk">Проверить</button><button class="btn ghost" id="clidk">Не знаю</button></div>`}`;
    }
    let fb="";
    if(r){
      fb=r.ok?`<div class="verdict ok">Верно${r.typo?" <span>(с опечаткой)</span>":""}</div>`:`<div class="verdict bad">${e.type==="choice"||e.type==="audio"?"Не то":"Правильно так:"} ${e.type==="choice"||e.type==="audio"?"":`<span><b>${esc(r.best||(e.a&&e.a[0])||"")}</b></span>`}</div>`;
      if(!r.ok&&(e.type==="tiles"||e.type==="type")&&r.user)fb+=`<div class="diff">${wordDiff(r.user,r.best)}</div>`;
      if((e.type==="tiles"||e.type==="type")&&r.best)fb+=`<div class="answer"><span style="font-size:18px;font-weight:500">${esc(r.best)}</span>${sayBtn(r.best)}</div>`;
      if(e.why)fb+=`<div class="why">${esc(e.why)}</div>`;
      fb+=nextBtn();
    }
    body=`<div class="card">${q}${fb}</div>`;
  }
  V.innerHTML=head+body;
  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
  on("clback",()=>{CL=null;viewCourse()});
  on("clnext",()=>{CL.i++;CL.res=null;if(CL.sc[CL.i].type==="end")finishCL();renderCL();window.scrollTo(0,0);const ne=CL.sc[CL.i];if(ne.type==="audio")setTimeout(()=>speak(ne.say),60)});
  on("clru",()=>{CL.ru=!CL.ru;renderCL()});
  on("cllist",()=>{CL=null;viewCourse()});
  on("clnx",()=>{openCourseLesson(L.n+1);window.scrollTo(0,0)});
  on("clchat",()=>{const ws=L.ids.map(wordById).filter(Boolean).map(w=>w.en).join(", ");
    PR.mode="chat";PR.chat={sc:"course",scene:{id:"course",name:"Урок "+L.n+": "+L.t,role:`a friendly, patient conversation partner for a beginner. Practise the lesson topic (in Russian: "${L.t}" — ${L.g}). Use mostly these words: ${ws}. Use very short simple sentences of 3–7 words`},L:L.lvl,turns:[],msgs:[],busy:false,err:""};
    CL=null;location.hash="#practice";setTimeout(chatCall,50)});
  V.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answerCL(b.dataset.o));
  on("clidk",()=>answerCL(""));
  const inp=$("#clin");
  if(inp&&!r){inp.focus();inp.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();answerCL(inp.value.trim())}};on("clchk",()=>answerCL(inp.value.trim()))}
  if(e.type==="tiles"&&!r){
    const P=CL.tiles,draw=()=>{const tl=$("#tline"),tp=$("#tpool");
      tl.innerHTML=P.pick.length?P.pick.map((pi,k)=>`<button class="tile" data-k="${k}">${esc(P.pool[pi].w)}</button>`).join(""):'<span class="muted small">Нажимай на слова ниже по порядку</span>';
      tp.innerHTML=P.pool.map((t,i)=>`<button class="tile${t.u?" used":""}" data-i="${i}" ${t.u?"disabled":""}>${esc(t.w)}</button>`).join("");
      tl.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;P.pool[P.pick[k]].u=false;P.pick.splice(k,1);draw()});
      tp.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;P.pool[i].u=true;P.pick.push(i);draw()})};
    draw();on("clchk",()=>answerCL(P.pick.map(pi=>P.pool[pi].w).join(" ")));
  }
  const nb=$("#clnext");if(nb&&isTask)nb.focus();
  if(e.type==="choice"&&e.say&&!r&&CL.said!==CL.i){CL.said=CL.i;setTimeout(()=>speak(e.say),60)}
}

${XF.open==="imp"?`<textarea id="xfin" placeholder="Вставь сюда код, начинается с YE1:" style="margin-top:10px;font-family:var(--f-mono);font-size:12px"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="xfgo">Объединить с текущим прогрессом</button></div>`:""}

function bindTransfer(){

  on("xfcopy",()=>{const ta=$("#xfcode");const fb=()=>{ta.focus();ta.select();toast("Выдели текст и скопируй вручную")};try{navigator.clipboard.writeText(XF.code).then(()=>toast("Код скопирован"),fb)}catch(e){fb()}});
  on("xfgo",()=>{const v=($("#xfin").value||"").trim();
    try{if(!v.startsWith("YE1:"))throw 0;const remote=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(!remote||typeof remote!=="object"||!remote.cards)throw 0;
      S=mergeState(S,remote);save();CS=null;TS=null;LS=null;XF={open:false,code:"",msg:"Готово: прогресс объединён."};chips();viewWords()}

/* ---------- МИКРОФОН (в приложении для телефона) ---------- */
const ICON_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
const MIC={on:false,cb:null};
function micAvail(){return !!(window.NativeApp&&window.NativeApp.speech)}
function micErr(e){return{permission:"Нет доступа к микрофону. Разреши его в настройках телефона.",nomatch:"Не расслышал. Скажи ещё раз, чуть громче и ближе к телефону.",unavailable:"Распознавание речи недоступно на этом устройстве.",network:"Для распознавания речи нужен интернет."}[e]||"Не удалось распознать речь. Попробуй ещё раз."}
function micUI(){document.querySelectorAll("[data-mic],.micbig").forEach(b=>b.classList.toggle("rec",MIC.on));try{budReact(MIC.on?"listen":"unlisten")}catch(e){}}
function micListen(cb){
  if(!micAvail())return;
  if(MIC.on){window.NativeApp.speech.stop();return}
  MIC.cb=cb;MIC.on=true;micUI();
  try{speechSynthesis.cancel()}catch(e){}
  window.NativeApp.speech.start(S.settings.voice||"en-US");
}
if(window.NativeApp){
  window.NativeApp.onSpeech=ev=>{
    if(!ev)return;
    if(ev.type==="partial"){if(MIC.cb)MIC.cb(ev.text||"",false,ev)}
    else if(ev.type==="final"){MIC.on=false;micUI();const cb=MIC.cb;MIC.cb=null;if(cb)cb(ev.text||"",true,ev)}
    else if(ev.type==="error"){MIC.on=false;micUI();const cb=MIC.cb;MIC.cb=null;toast(micErr(ev.error));if(cb)cb("",true,ev)}
  };
}
window.__nativeReminderDenied=()=>toast("Уведомления запрещены. Разреши их в настройках телефона.");
function micBtn(id){return micAvail()?`<button class="iconbtn mic${MIC.on?" rec":""}" data-mic="${id}" aria-label="Ответить голосом" title="Ответить голосом">${ICON_MIC}</button>`:""}
document.addEventListener("click",e=>{const b=e.target.closest("[data-mic]");if(!b)return;e.preventDefault();
  const el=document.getElementById(b.dataset.mic);
  micListen((t,fin)=>{if(el&&t){el.value=t;el.dispatchEvent(new Event("input",{bubbles:true}))}if(fin&&el)el.focus()})});

// Оценка произношения: какие слова образца распознались в сказанном
function scoreSpeech(target,alts){
  const ow=target.split(/\s+/).filter(Boolean);let best={score:-1,marks:[],heard:""};
  for(const a of alts){if(!a)continue;const hw=norm(a).split(" ").filter(Boolean);
    const marks=ow.map(w=>{const ts=norm(w).split(" ").filter(Boolean);return ts.length===0||ts.every(t=>hw.some(h=>h===t||(t.length>4&&lev(h,t)<=1)))});
    const sc=marks.filter(Boolean).length/Math.max(1,ow.length);if(sc>best.score)best={score:sc,marks,heard:a}}
  if(best.score<0)best={score:0,marks:ow.map(()=>false),heard:""};
  return best;
}
function scoreHTML(target,b){
  const ow=target.split(/\s+/).filter(Boolean);const pct=Math.round(b.score*100);
  return `<div class="diff">${ow.map((w,i)=>b.marks[i]?`<span class="okw">${esc(w)}</span>`:`<span class="miss">${esc(w)}</span>`).join(" ")}</div>
  <div class="verdict ${pct>=90?"ok":pct>=60?"warn":"bad"}">${pct>=90?"Отлично, тебя понятно":pct>=60?"Почти: повтори выделенные слова":"Пока непонятно. Послушай образец и попробуй ещё"} <span>· ${pct}%</span></div>
  <div class="small muted">Распознано: «${esc(b.heard||"—")}»</div>`;
}
function micCheck(target,outId){
  const out=document.getElementById(outId);
  micListen((t,fin,ev)=>{if(!out)return;
    if(!fin){out.innerHTML=`<div class="small muted">Слушаю: ${esc(t)}</div>`;return}
    if(!t&&!(ev&&ev.alts&&ev.alts.length)){out.innerHTML="";return}
    const b=scoreSpeech(target,[t].concat((ev&&ev.alts)||[]));out.innerHTML=scoreHTML(target,b);bump(b.score>=.8,null)});
}

// Режим «Скажи вслух»
function newSay(){const t=li(T());const pool=allWords().filter(w=>li(w.lvl)<=t&&w.ex);const w=pool[Math.floor(Math.random()*pool.length)];
  PS.say=Math.random()<.45?{text:w.en,ru:w.ru}:{text:w.ex,ru:w.exru||""}}
function sayBody(){
  if(!PS.say)newSay();const s=PS.say;
  return `<div class="card"><div class="card-top"><span>Скажи вслух по-английски</span><span>${PS.sayN?`${PS.sayOk} из ${PS.sayN} понятно`:""}</span></div>
  <div class="prompt" style="font-size:clamp(22px,5vw,30px)">${esc(s.text)}</div>${s.ru?`<div class="small muted">${esc(s.ru)}</div>`:""}
  <div class="row"><button class="btn" data-say="${esc(s.text)}">Послушать образец</button><button class="btn" data-say="${esc(s.text)}" data-rate="0.65">Медленно</button></div>
  <div class="row"><button class="btn primary micbig${MIC.on?" rec":""}" id="saymic">${ICON_MIC}<span>${MIC.on?"Слушаю… нажми, чтобы закончить":"Говорить"}</span></button></div>
  <div id="sayres"></div>
  <div class="row"><button class="btn ghost" id="saynext">Другая фраза</button></div></div>
  <p class="small muted">Распознавание работает как собеседник-носитель: если система поняла слово, тебя поймёт и человек. Слова, которые не распознались, выделены жёлтым.</p>`;
}
function bindSay(){
  const s=PS.say,out=()=>document.getElementById("sayres");
  const m=$("#saymic");if(m)m.onclick=()=>{
    micListen((t,fin,ev)=>{const o=out();if(!o)return;
      if(!fin){o.innerHTML=`<div class="small muted">Слушаю: ${esc(t)}</div>`;const b=$("#saymic span");if(b)b.textContent="Слушаю… нажми, чтобы закончить";return}
      const b2=$("#saymic span");if(b2)b2.textContent="Говорить ещё раз";
      if(!t&&!(ev&&ev.alts&&ev.alts.length)){o.innerHTML="";return}
      const b=scoreSpeech(s.text,[t].concat((ev&&ev.alts)||[]));PS.sayN=(PS.sayN||0)+1;if(b.score>=.8)PS.sayOk=(PS.sayOk||0)+1;
      o.innerHTML=scoreHTML(s.text,b);bump(b.score>=.8,null)});
    const sp=$("#saymic span");if(sp)sp.textContent="Слушаю… нажми, чтобы закончить";
  };
  const n=$("#saynext");if(n)n.onclick=()=>{newSay();viewSpeak()};
}
