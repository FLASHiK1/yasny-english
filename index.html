w:[["take","брать; делать (фото)","/teɪk/","I took a photo of the sea.","Я сфотографировал(а) море."],["buy","покупать","/baɪ/","She bought a souvenir.","Она купила сувенир."],["come","приходить, приезжать","/kʌm/","They came home late.","Они пришли домой поздно."],["find","находить","/faɪnd/","We found a nice café.","Мы нашли милое кафе."],["leave","уезжать, уходить; оставлять","/liːv/","We left the hotel at ten.","Мы выехали из отеля в десять."],["spend","тратить; проводить (время)","/spend/","I spent a week in Rome.","Я провёл(ла) неделю в Риме."]],
r:`<p>Многие частые глаголы в прошлом не получают -ed — их форму нужно запомнить:</p>${sayRow(["take — took","buy — bought","come — came","find — found","leave — left","spend — spent"])}<p>В вопросе и отрицании — снова начальная форма: <b>Did you buy</b> anything? We <b>didn't take</b> a taxi.</p>`,
rx:[{type:"choice",q:"Прошедшая форма buy:",o:["bought","buyed","brought"],a:"bought",why:"Buy → bought. Brought — это от bring."},
{type:"fill",q:"We ___ a week in Italy. (spend)",a:["spent"],why:"Spend → spent."},
{type:"choice",q:"Выбери правильное:",o:["Did you take many photos?","Did you took many photos?","Do you took many photos?"],a:"Did you take many photos?",why:"После did — начальная форма: take."}],
d:[["A","How was your trip to Spain?","Как прошла поездка в Испанию?"],["B","Amazing! We spent five days in Barcelona.","Потрясающе! Мы провели пять дней в Барселоне."],["A","Did you take lots of photos?","Много фотографировали?"],["B","Hundreds! And we found a tiny restaurant by the sea.","Сотни! И нашли крошечный ресторанчик у моря."],["A","Did you buy any souvenirs?","Сувениры купили?"],["B","Just a magnet — we left all our money in that restaurant!","Только магнитик — все деньги мы оставили в том ресторане!"]],
tr:[{ru:"Мы нашли хороший отель.",en:["We found a [good|nice] hotel."]},{ru:"Она купила новое платье.",en:["She bought a new dress."]},{ru:"Они приехали в пятницу.",en:["They [came|arrived] on Friday."]}]},

{t:"Что ты делал(а) в тот момент: was doing",g:"Опишешь, что происходило, когда что-то случилось",say:["I was cooking when you called.","Я готовил(а), когда ты позвонил(а)."],
w:[["happen","случаться","/ˈhæpən/","What happened?","Что случилось?"],["suddenly","вдруг","/ˈsʌdənli/","Suddenly the lights went out.","Вдруг погас свет."],["while","пока, в то время как","/waɪl/","I read while he was cooking.","Я читал(а), пока он готовил."],["rain","дождь; идти (о дожде)","/reɪn/","It was raining all day.","Весь день шёл дождь."],["ring","звонить (о телефоне)","/rɪŋ/","The phone rang.","Зазвонил телефон."],["drop","ронять","/drɒp/","I dropped my cup.","Я уронил(а) чашку."]],
r:`<p><b>Past Continuous</b> — процесс в прошлом: <b>was/were + -ing</b>. <b>I was cooking. They were sleeping.</b></p><p>Часто вместе с коротким событием в Past Simple: <b>I was cooking when the phone rang.</b> — Я готовил(а), когда зазвонил телефон.</p><p>I/he/she/it — <b>was</b>, you/we/they — <b>were</b>.</p>`,
rx:[{type:"fill",q:"They ___ watching TV when I came.",a:["were"],why:"They — were + -ing."},
{type:"choice",q:"I ___ when you called.",o:["was sleeping","am sleeping","sleeping"],a:"was sleeping",why:"Процесс, который прервали: was sleeping."},
{type:"choice",q:"«Что ты делал(а) в восемь?»",o:["What were you doing at eight?","What did you doing at eight?","What was you doing at eight?"],a:"What were you doing at eight?",why:"You — were: What were you doing?"}],
d:[["A","What happened to your phone?","Что случилось с твоим телефоном?"],["B","I was running for the bus, and I dropped it.","Я бежал(а) к автобусу и уронил(а) его."],["A","Oh no! Was it raining?","Ой! Шёл дождь?"],["B","Yes, it was raining really hard.","Да, шёл очень сильный дождь."],["A","Poor you! Did it break?","Бедняжка! Он сломался?"],["B","Only the screen. It still works!","Только экран. Он всё ещё работает!"]],
tr:[{ru:"Я спал(а), когда ты позвонил(а).",en:["I was sleeping when you called."]},{ru:"Что ты делал(а) в восемь часов?",en:["What were you doing at eight[ o'clock|]?"]},{ru:"Шёл дождь.",en:["It was raining."]}]},

{t:"Больше и лучше: сравнение",g:"Сравнишь города, кафе и цены",say:["The bus is cheaper than the taxi.","Автобус дешевле такси."],
w:[["cheap","дешёвый","/tʃiːp/","This café is cheap.","Это кафе недорогое."],["expensive","дорогой","/ɪkˈspensɪv/","London is expensive.","Лондон — дорогой город."],["quiet","тихий","/ˈkwaɪət/","My street is quiet.","Моя улица тихая."],["noisy","шумный","/ˈnɔɪzi/","The city centre is noisy.","В центре города шумно."],["better","лучше","/ˈbetə/","Your English is better now.","Твой английский теперь лучше."],["worse","хуже","/wɜːs/","The weather is worse today.","Сегодня погода хуже."]],
r:`<p>Короткие слова: <b>-er + than</b>: cheap → <b>cheaper than</b>, quiet → <b>quieter</b>. Если слово кончается на -y: noisy → <b>noisier</b>. Одна гласная + согласная: big → <b>bigger</b>.</p><p>Длинные слова: <b>more</b> + слово: <b>more expensive than</b>.</p><p>Исключения: good → <b>better</b>, bad → <b>worse</b>.</p>`,
rx:[{type:"choice",q:"Moscow is ___ than my town.",o:["bigger","more big","biggest"],a:"bigger",why:"Big → bigger: удваиваем g и добавляем -er."},
{type:"fill",q:"A taxi is more ___ than a bus.",a:["expensive"],why:"Длинное слово: more expensive."},
{type:"choice",q:"Today the weather is ___ than yesterday.",o:["worse","badder","more bad"],a:"worse",why:"Bad → worse — исключение."}],
d:[["A","Shall we go to the new café or the old one?","Пойдём в новое кафе или в старое?"],["B","The new one is nicer, but it's more expensive.","Новое приятнее, но дороже."],["A","The old one is quieter, too.","А в старом ещё и тише."],["B","OK, and the coffee there is better.","Ладно, и кофе там лучше."],["A","The old café, then!","Значит, в старое!"]],
tr:[{ru:"Мой брат выше меня.",en:["My brother is taller than [me|I am]."]},{ru:"Это кафе дешевле.",en:["This [café|cafe] is cheaper."]},{ru:"Сегодня лучше, чем вчера.",en:["Today is better than yesterday.","It's better today than yesterday."]}]},

{t:"Самый: the best",g:"Расскажешь о самом лучшем: месте, дне, фильме",say:["It was the best day of my life!","Это был лучший день в моей жизни!"],
w:[["best","лучший","/best/","She's my best friend.","Она моя лучшая подруга."],["worst","худший","/wɜːst/","It was the worst film ever.","Это был худший фильм на свете."],["beautiful","красивый","/ˈbjuːtɪfl/","It's the most beautiful city in the world.","Это самый красивый город в мире."],["popular","популярный","/ˈpɒpjələ/","This is the most popular dish here.","Это самое популярное блюдо здесь."],["high","высокий (о горах, зданиях)","/haɪ/","What's the highest mountain?","Какая гора самая высокая?"],["ever","когда-либо, на свете","/ˈevə/","It was the best holiday ever.","Это был лучший отпуск на свете."]],
r:`<p>«Самый» — <b>the + -est</b>: cheap → <b>the cheapest</b>, big → <b>the biggest</b>, happy → <b>the happiest</b>.</p><p>Длинные слова — <b>the most</b>: <b>the most beautiful</b>, <b>the most popular</b>.</p><p>Исключения: good → <b>the best</b>, bad → <b>the worst</b>. Не забывай <b>the</b>!</p>`,
rx:[{type:"choice",q:"It's ___ restaurant in town.",o:["the best","the goodest","the most good"],a:"the best",why:"Good → the best."},
{type:"fill",q:"Paris is the most ___ city I know.",a:["beautiful"],why:"Длинное слово: the most beautiful."},
{type:"choice",q:"Everest is ___ mountain in the world.",o:["the highest","the most high","highest the"],a:"the highest",why:"Короткое слово: the highest."}],
d:[["A","What's the best place in your city?","Какое самое лучшее место в твоём городе?"],["B","The old park. It's the most beautiful place, especially in autumn.","Старый парк. Самое красивое место, особенно осенью."],["A","And the worst?","А самое худшее?"],["B","The main street at six o'clock. It's the noisiest place ever!","Главная улица в шесть вечера. Самое шумное место на свете!"],["A","Ha-ha! Then I'll go to the park.","Ха-ха! Тогда я пойду в парк."]],
tr:[{ru:"Это самый дешёвый отель.",en:["[This|It] is the cheapest hotel.","It's the cheapest hotel."]},{ru:"Она моя лучшая подруга.",en:["She is my best friend.","She's my best friend."]},{ru:"Это самое популярное кафе.",en:["[This|It] is the most popular [café|cafe].","It's the most popular [café|cafe]."]}]},

{t:"Какой он? Внешность и характер",g:"Опишешь человека: как выглядит и какой по характеру",say:["She has long dark hair and she's really kind.","У неё длинные тёмные волосы, и она очень добрая."],
w:[["tall","высокий (о человеке)","/tɔːl/","My dad is very tall.","Мой папа очень высокий."],["short","невысокий; короткий","/ʃɔːt/","She has short hair.","У неё короткие волосы."],["hair","волосы","/heə/","He has curly hair.","У него кудрявые волосы."],["kind","добрый","/kaɪnd/","Our teacher is very kind.","Наша учительница очень добрая."],["funny","смешной, весёлый","/ˈfʌni/","My brother is so funny!","Мой брат такой смешной!"],["look like","быть похожим, выглядеть как","/lʊk laɪk/","You look like your mum.","Ты похож(а) на маму."]],
r:`<p>Внешность: <b>What does he look like?</b> — Как он выглядит? Ответ: <b>He's tall. He has short dark hair.</b></p><p>Характер: <b>What's she like?</b> — Какая она (по характеру)? Ответ: <b>She's kind and funny.</b></p><p><b>Hair</b> — неисчисляемое: <b>her hair is long</b>, а не <i>are</i>.</p>`,
rx:[{type:"choice",q:"«Как она выглядит?»",o:["What does she look like?","How does she look like?","What is she look like?"],a:"What does she look like?",why:"What does she look like? — с what, а не how."},
{type:"fill",q:"His hair ___ very long.",a:["is","'s"],why:"Hair — неисчисляемое, поэтому is."},
{type:"choice",q:"«What's your sister like?» — это вопрос о…",o:["характере","внешности","том, что она любит"],a:"характере",why:"What's she like? — какая она по характеру. «Что она любит» — What does she like?"}],
d:[["A","I'm meeting my new boss tomorrow. What's she like?","Завтра встречаюсь с новой начальницей. Какая она?"],["B","She's really kind, and she's very funny too.","Очень добрая и ещё очень весёлая."],["A","Great! And what does she look like? I don't want to miss her.","Отлично! А как она выглядит? Не хочу её пропустить."],["B","She's tall, with short red hair and glasses.","Высокая, с короткими рыжими волосами и в очках."],["A","Thanks! That helps.","Спасибо! Это поможет."]],
tr:[{ru:"Он высокий и весёлый.",en:["He is tall and funny.","He's tall and funny."]},{ru:"Как он выглядит?",en:["What does he look like?"]},{ru:"Ты похож(а) на папу.",en:["You look like your [dad|father]."]}]},

{t:"Слишком и достаточно: too, enough",g:"Скажешь, что вещь слишком дорогая или недостаточно тёплая",say:["It's too expensive for me.","Это слишком дорого для меня."],
w:[["too","слишком","/tuː/","This coffee is too hot.","Этот кофе слишком горячий."],["enough","достаточно","/ɪˈnʌf/","Is it big enough?","Он достаточно большой?"],["size","размер","/saɪz/","Do you have a bigger size?","У вас есть размер побольше?"],["fit","подходить по размеру","/fɪt/","These shoes don't fit.","Эти туфли не подходят по размеру."],["warm","тёплый","/wɔːm/","This jacket isn't warm enough.","Эта куртка недостаточно тёплая."],["tight","тесный","/taɪt/","The jeans are too tight.","Джинсы слишком тесные."]],
r:`<p><b>too</b> + прилагательное — «слишком» (это плохо): <b>too expensive, too small</b>.</p><p><b>enough</b> ставится после прилагательного: <b>big enough</b> — достаточно большой, <b>not warm enough</b> — недостаточно тёплый.</p><p>Перед существительным — наоборот: <b>enough money</b>, <b>enough time</b>.</p>`,
rx:[{type:"choice",q:"«Достаточно тёплый»",o:["warm enough","enough warm","too warm"],a:"warm enough",why:"Enough после прилагательного: warm enough."},
{type:"fill",q:"I can't buy it. It's ___ expensive.",a:["too"],why:"Слишком дорого — too expensive."},
{type:"choice",q:"We don't have ___ .",o:["enough time","time enough","too time"],a:"enough time",why:"Перед существительным: enough time."}],
d:[["A","How are the jeans?","Как джинсы?"],["B","They're too tight. Do you have a bigger size?","Слишком тесные. У вас есть размер побольше?"],["A","Here you are. And the jacket?","Вот, пожалуйста. А куртка?"],["B","It's nice, but it isn't warm enough for winter.","Красивая, но для зимы недостаточно тёплая."],["A","Try this one — it's really warm.","Примерьте эту — она очень тёплая."],["B","Perfect. It fits!","Отлично. Подходит!"]],
tr:[{ru:"Это слишком дорого.",en:["[It's|It is|That's|That is] too expensive."]},{ru:"У меня недостаточно денег.",en:["I [don't|do not] have enough money.","I haven't got enough money."]},{ru:"Комната достаточно большая.",en:["The room is big enough."]}]},

{t:"Как? Наречия: quickly, well",g:"Расскажешь, как ты что-то делаешь: быстро, хорошо, внимательно",say:["She speaks English really well.","Она очень хорошо говорит по-английски."],
w:[["quickly","быстро","/ˈkwɪkli/","He eats very quickly.","Он ест очень быстро."],["slowly","медленно","/ˈsləʊli/","Can you speak slowly, please?","Говорите медленнее, пожалуйста."],["well","хорошо","/wel/","You sing well!","Ты хорошо поёшь!"],["carefully","внимательно, аккуратно","/ˈkeəfəli/","Read the text carefully.","Прочитай текст внимательно."],["hard","усердно; трудный","/hɑːd/","She works hard.","Она усердно работает."],["fast","быстрый; быстро","/fɑːst/","He drives fast.","Он быстро водит."]],
r:`<p>Прилагательное отвечает на «какой?», наречие — на «как?». Обычно наречие = прилагательное + <b>-ly</b>: quick → <b>quickly</b>, careful → <b>carefully</b>.</p><p>Исключения: good → <b>well</b>, fast → <b>fast</b>, hard → <b>hard</b>.</p><p><b>She is a good driver. She drives well.</b> — Она хороший водитель. Она хорошо водит.</p>`,
rx:[{type:"choice",q:"He speaks English very ___ .",o:["well","good","goodly"],a:"well",why:"Как говорит? — well. Good отвечает на «какой?»."},
{type:"fill",q:"Please drive ___ . (careful)",a:["carefully"],why:"Как вести машину? — carefully."},
{type:"choice",q:"She is a ___ runner.",o:["fast","fastly","fastful"],a:"fast",why:"Fast — и прилагательное, и наречие. Fastly не бывает."}],
d:[["A","Your English is really good now!","Твой английский теперь очень хороший!"],["B","Thanks! I practise every day, and I listen carefully to podcasts.","Спасибо! Я занимаюсь каждый день и внимательно слушаю подкасты."],["A","Do you understand them?","Ты их понимаешь?"],["B","When people speak slowly, yes. When they speak fast — not always!","Когда говорят медленно — да. Когда быстро — не всегда!"],["A","You're working hard. Well done!","Ты усердно трудишься. Молодец!"]],
tr:[{ru:"Говори медленнее, пожалуйста.",en:["[Speak|Please speak] [slowly|more slowly][, please|].","Can you speak [slowly|more slowly][, please|]?"]},{ru:"Она хорошо поёт.",en:["She sings well."]},{ru:"Он усердно работает.",en:["He works hard."]}]},

{t:"Обещания и решения: will",g:"Пообещаешь, предложишь помощь и примешь решение прямо сейчас",say:["I'll call you tonight, I promise.","Я позвоню тебе вечером, обещаю."],
w:[["promise","обещать","/ˈprɒmɪs/","I promise I'll help you.","Обещаю, что помогу тебе."],["help","помогать","/help/","I'll help you with your bags.","Я помогу тебе с сумками."],["tonight","сегодня вечером","/təˈnaɪt/","I'll call you tonight.","Я позвоню тебе вечером."],["probably","вероятно","/ˈprɒbəbli/","It will probably rain.","Вероятно, пойдёт дождь."],["carry","нести","/ˈkæri/","I'll carry the box.","Я понесу коробку."],["open","открывать","/ˈəʊpən/","I'll open the window.","Я открою окно."]],
r:`<p><b>will</b> (коротко <b>'ll</b>) + глагол — будущее. Его используют для решений «здесь и сейчас», обещаний и предложений помощи: <b>It's hot. I'll open the window.</b></p><p>Отрицание: <b>won't</b> (will not): <b>I won't forget.</b> Вопрос: <b>Will you help me?</b></p><p>После will — без to: <b>I'll call</b>, а не <i>I'll to call</i>.</p>`,
rx:[{type:"choice",q:"«Я тебе помогу!»",o:["I'll help you!","I help you will!","I'll to help you!"],a:"I'll help you!",why:"Will + глагол без to: I'll help."},
{type:"fill",q:"Don't worry, I ___ forget. (не забуду)",a:["won't","will not"],why:"Отрицание — won't."},
{type:"choice",q:"The phone is ringing. — ___ answer it.",o:["I'll","I","I'm going"],a:"I'll",why:"Решение в момент речи — I'll."}],
d:[["A","This box is so heavy!","Эта коробка такая тяжёлая!"],["B","Wait, I'll help you. I'll carry it.","Подожди, я помогу. Я понесу."],["A","Thank you! Will you come to my party on Saturday?","Спасибо! Придёшь ко мне на вечеринку в субботу?"],["B","I'll probably be late, but I'll come, I promise.","Наверное, опоздаю, но приду, обещаю."],["A","Great! I won't start without you.","Отлично! Без тебя не начну."]],
tr:[{ru:"Я позвоню тебе завтра.",en:["[I'll|I will] call you tomorrow."]},{ru:"Я не забуду.",en:["I [won't|will not] forget."]},{ru:"Ты мне поможешь?",en:["Will you help me?","Can you help me?"]}]},

{t:"Планы на завтра: I'm meeting…",g:"Расскажешь о планах, о которых уже договорился(лась)",say:["I'm meeting Anna at six.","Я встречаюсь с Анной в шесть."],
w:[["plan","план; планировать","/plæn/","What are your plans for the weekend?","Какие планы на выходные?"],["busy","занятой","/ˈbɪzi/","I'm busy tomorrow.","Я завтра занят(а)."],["free","свободный","/friː/","Are you free on Friday?","Ты свободен(на) в пятницу?"],["arrange","договариваться","/əˈreɪndʒ/","We arranged to meet at noon.","Мы договорились встретиться в полдень."],["dinner","ужин","/ˈdɪnə/","We're having dinner with friends.","Мы ужинаем с друзьями."],["fly","лететь","/flaɪ/","I'm flying to Rome on Monday.","В понедельник я лечу в Рим."]],
r:`<p>Если о планах уже договорились (есть время, место, билет), говорят <b>Present Continuous</b>: <b>I'm meeting Tom at six. We're flying to Rome on Monday.</b></p><p>Вопрос о планах: <b>What are you doing tonight?</b> — Что ты делаешь сегодня вечером?</p><p>Сравни: <b>I'm meeting him tomorrow</b> (договорились) и <b>I'll call him</b> (решил(а) прямо сейчас).</p>`,

COURSE.forEach((L,ix)=>{L.n=ix+1;L.lvl=ix<15?"A0":ix<30?"A1":"A2";L.ids=L.w.map(w=>{if(typeof w==="string")return w;if(!BASE_WORDS.some(x=>x.id===w[0]))BASE_WORDS.push(Object.assign(mkW(w,L.lvl),{theme:"course"}));return w[0]})});

let CL=null;
function courseDone(n){return !!(S.course||{})[n]}
function courseNext(){if(li(T())>=2){const a=COURSE.find(L=>L.n>30&&!courseDone(L.n));if(a)return a}return COURSE.find(L=>!courseDone(L.n))||null}
function courseUnlocked(n){const lv=li(T());return n===1||courseDone(n-1)||courseDone(n)||(n<=31&&lv>=2)||lv>=3}
function courseTodayCard(){
  const nx=courseNext();if(!nx)return"";
  const doneN=Object.keys(S.course||{}).length;
  if(li(T())>2&&!doneN)return"";
  const today=Object.values(S.course||{}).some(c=>c.date===dkey());
  return `<section class="sheet coursecta"><div style="min-width:0"><div class="label">${nx.n>30?"Курс A2":"Курс с нуля"} · ${doneN} из ${COURSE.length}</div><h2 style="margin:6px 0 4px">Урок ${nx.n}: ${esc(nx.t)}</h2><p class="small muted" style="margin:0">${esc(nx.g)}.${nx.say?` Скажешь: «${esc(nx.say[0])}»`:""} ${today?"Сегодняшний урок уже пройден — следующий лучше завтра, но можно и сейчас.":"15–20 минут."}</p></div><a class="btn ${today?"":"primary"}" href="#course" data-open="${nx.n}">${doneN?"Продолжить":"Начать курс"}</a></section>`;
}
function courseScreens(L){
  const words=L.ids.map(wordById).filter(Boolean),sc=[{type:"words"}];
  const pool=allWords().filter(x=>li(x.lvl)<=Math.max(1,li(L.lvl))&&!x.custom);
  shuffle(words).forEach(w=>sc.push({type:"choice",say:w.en,q:"Что значит «"+w.en+"»?",o:shuffle([w.ru].concat(shuffle(pool.filter(x=>x.ru!==w.ru&&x.id!==w.id)).slice(0,2).map(x=>x.ru))),a:w.ru,wid:w.id}));
  shuffle(words).slice(0,2).forEach(w=>sc.push({type:"type",q:w.ru,a:[w.en],say:w.en,wid:w.id}));
  sc.push({type:"rule"});
  L.rx.forEach(e=>sc.push(Object.assign({},e)));
  sc.push({type:"dialog"});
  const lines=L.d.map(x=>x[1]);
  shuffle(lines).slice(0,2).forEach(l=>sc.push({type:"audio",say:l,o:shuffle([l].concat(shuffle(lines.filter(x=>x!==l)).slice(0,2))),a:l}));
  const short=shuffle(L.d.filter(x=>x[1].split(" ").length<=8))[0];
  if(short)sc.push({type:"tiles",ru:short[2],en:[short[1]]});
  L.tr.forEach(t=>sc.push({type:L.n<=15?"tiles":"type",ru:t.ru,en:t.en}));
  sc.push({type:"end"});
  return sc;
}
function openCourseLesson(n){const L=COURSE[n-1];CL={active:true,L,sc:courseScreens(L),i:0,res:null,right:0,total:0,tiles:null};renderCL()}
function clTaskData(e){const d={type:e.type};["q","o","a","say","ru","en","why"].forEach(k=>{if(e[k]!==undefined)d[k]=e[k]});return d}
function answerCL(v){
  const e=CL.sc[CL.i],L=CL.L;let ok=false,typo=false,best=null,cres=null;
  if(e.type==="choice"||e.type==="audio")ok=v===e.a;
  else if(e.type==="fill"){if(v){cres=check(v,e.a);ok=cres.status!=="bad";typo=cres.status==="typo"}}
  else{const vars=e.en?e.en.flatMap(expand):e.a;if(v){cres=check(v,vars,true);ok=cres.status!=="bad";typo=cres.status==="typo";best=cres.best}else best=vars[0]}
  CL.res={ok,typo,user:v,best,cres};CL.total++;if(ok)CL.right++;
  if(e.wid)mistake("word",e.wid,ok,v,{t:"vocab",l:L.lvl});
  else mistake("course",L.n+":"+hashStr(JSON.stringify(clTaskData(e))),ok,v,{t:"course",l:L.lvl,data:clTaskData(e)});
  bump(ok,L.lvl);renderCL();
  if(e.type==="type"&&e.say)speak(e.say);
}
function finishCL(){

  on("clchat",()=>{const ws=L.ids.map(wordById).filter(Boolean).map(w=>w.en).join(", ");
    PR.mode="chat";PR.chat={sc:"course",scene:{id:"course",name:"Урок "+L.n+": "+L.t,role:`a friendly, patient conversation partner for a beginner. Practise the lesson topic (in Russian: "${L.t}" — ${L.g}). Use mostly these words: ${ws}. Use very short simple sentences of 3–7 words`},L:L.lvl,turns:[],msgs:[],busy:false,err:""};
    CL=null;location.hash="#practice";setTimeout(chatCall,50)});
  V.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answerCL(b.dataset.o));
  on("clidk",()=>answerCL(""));
  const inp=$("#clin");
  if(inp&&!r){inp.focus();inp.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();answerCL(inp.value.trim())}};on("clchk",()=>answerCL(inp.value.trim()))}
  if(e.type==="tiles"&&!r){
    const P=CL.tiles,draw=()=>{const tl=$("#tline"),tp=$("#tpool");
      tl.innerHTML=P.pick.length?P.pick.map((pi,k)=>`<button class="tile" data-k="${k}">${esc(P.pool[pi].w)}</button>`).join(""):'<span class="muted small">Нажимай на слова ниже по порядку</span>';
      tp.innerHTML=P.pool.map((t,i)=>`<button class="tile${t.u?" used":""}" data-i="${i}" ${t.u?"disabled":""}>${esc(t.w)}</button>`).join("");
      tl.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;P.pool[P.pick[k]].u=false;P.pick.splice(k,1);draw()});
      tp.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;P.pool[i].u=true;P.pick.push(i);draw()})};
    draw();on("clchk",()=>answerCL(P.pick.map(pi=>P.pool[pi].w).join(" ")));
  }
  const nb=$("#clnext");if(nb&&isTask)nb.focus();
  if(e.type==="choice"&&e.say&&!r&&CL.said!==CL.i){CL.said=CL.i;setTimeout(()=>speak(e.say),60)}
}

${XF.open==="imp"?`<textarea id="xfin" placeholder="Вставь сюда код, начинается с YE1:" style="margin-top:10px;font-family:var(--f-mono);font-size:12px"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="xfgo">Объединить с текущим прогрессом</button></div>`:""}

function bindTransfer(){

  on("xfgo",()=>{const v=($("#xfin").value||"").trim();
    try{if(!v.startsWith("YE1:"))throw 0;const remote=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(!remote||typeof remote!=="object"||!remote.cards)throw 0;
      S=mergeState(S,remote);save();CS=null;TS=null;LS=null;XF={open:false,code:"",msg:"Готово: прогресс объединён."};chips();viewSettings()}

/* ---------- МИКРОФОН (в приложении для телефона) ---------- */
const ICON_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
const MIC={on:false,cb:null};
function micAvail(){return !!(window.NativeApp&&window.NativeApp.speech)}
function micErr(e){return{permission:"Нет доступа к микрофону. Разреши его в настройках телефона.",nomatch:"Не расслышал. Скажи ещё раз, чуть громче и ближе к телефону.",unavailable:"Распознавание речи недоступно на этом устройстве.",network:"Для распознавания речи нужен интернет."}[e]||"Не удалось распознать речь. Попробуй ещё раз."}
function micUI(){document.querySelectorAll("[data-mic],.micbig").forEach(b=>b.classList.toggle("rec",MIC.on));try{budReact(MIC.on?"listen":"unlisten")}catch(e){}}
function micListen(cb){
  if(!micAvail())return;
  if(MIC.on){window.NativeApp.speech.stop();return}
  MIC.cb=cb;MIC.on=true;micUI();
  try{speechSynthesis.cancel()}catch(e){}
  window.NativeApp.speech.start(S.settings.voice||"en-US");
}
if(window.NativeApp){
  window.NativeApp.onSpeech=ev=>{
    if(!ev)return;
    if(ev.type==="partial"){if(MIC.cb)MIC.cb(ev.text||"",false,ev)}
    else if(ev.type==="final"){MIC.on=false;micUI();const cb=MIC.cb;MIC.cb=null;if(cb)cb(ev.text||"",true,ev)}
    else if(ev.type==="error"){MIC.on=false;micUI();const cb=MIC.cb;MIC.cb=null;toast(micErr(ev.error));if(cb)cb("",true,ev)}
  };
}
window.__nativeReminderDenied=()=>toast("Уведомления запрещены. Разреши их в настройках телефона.");
function micBtn(id){return micAvail()?`<button class="iconbtn mic${MIC.on?" rec":""}" data-mic="${id}" aria-label="Ответить голосом" title="Ответить голосом">${ICON_MIC}</button>`:""}
document.addEventListener("click",e=>{const b=e.target.closest("[data-mic]");if(!b)return;e.preventDefault();
  const el=document.getElementById(b.dataset.mic);
  micListen((t,fin)=>{if(el&&t){el.value=t;el.dispatchEvent(new Event("input",{bubbles:true}))}if(fin&&el)el.focus()})});

// Оценка произношения: какие слова образца распознались в сказанном
function scoreSpeech(target,alts){
  const ow=target.split(/\s+/).filter(Boolean);let best={score:-1,marks:[],heard:""};
  for(const a of alts){if(!a)continue;const hw=norm(a).split(" ").filter(Boolean);
    const marks=ow.map(w=>{const ts=norm(w).split(" ").filter(Boolean);return ts.length===0||ts.every(t=>hw.some(h=>h===t||(t.length>4&&lev(h,t)<=1)))});
    const sc=marks.filter(Boolean).length/Math.max(1,ow.length);if(sc>best.score)best={score:sc,marks,heard:a}}
  if(best.score<0)best={score:0,marks:ow.map(()=>false),heard:""};
  return best;
}
function scoreHTML(target,b){
  const ow=target.split(/\s+/).filter(Boolean);const pct=Math.round(b.score*100);
  return `<div class="diff">${ow.map((w,i)=>b.marks[i]?`<span class="okw">${esc(w)}</span>`:`<span class="miss">${esc(w)}</span>`).join(" ")}</div>
  <div class="verdict ${pct>=90?"ok":pct>=60?"warn":"bad"}">${pct>=90?"Отлично, тебя понятно":pct>=60?"Почти: повтори выделенные слова":"Пока непонятно. Послушай образец и попробуй ещё"} <span>· ${pct}%</span></div>
  <div class="small muted">Распознано: «${esc(b.heard||"—")}»</div>`;
}
function micCheck(target,outId){
  const out=document.getElementById(outId);
  micListen((t,fin,ev)=>{if(!out)return;
    if(!fin){out.innerHTML=`<div class="small muted">Слушаю: ${esc(t)}</div>`;return}
    if(!t&&!(ev&&ev.alts&&ev.alts.length)){out.innerHTML="";return}
    const b=scoreSpeech(target,[t].concat((ev&&ev.alts)||[]));out.innerHTML=scoreHTML(target,b);bump(b.score>=.8,null)});
}

// Режим «Скажи вслух»
function newSay(){const t=li(T());const pool=allWords().filter(w=>li(w.lvl)<=t&&w.ex);const w=pool[Math.floor(Math.random()*pool.length)];
  PS.say=Math.random()<.45?{text:w.en,ru:w.ru}:{text:w.ex,ru:w.exru||""}}
function sayBody(){
  if(!PS.say)newSay();const s=PS.say;
  return `<div class="card"><div class="card-top"><span>Скажи вслух по-английски</span><span>${PS.sayN?`${PS.sayOk} из ${PS.sayN} понятно`:""}</span></div>
  <div class="prompt" style="font-size:clamp(22px,5vw,30px)">${esc(s.text)}</div>${s.ru?`<div class="small muted">${esc(s.ru)}</div>`:""}
  <div class="row"><button class="btn" data-say="${esc(s.text)}">Послушать образец</button><button class="btn" data-say="${esc(s.text)}" data-rate="0.65">Медленно</button></div>
  <div class="row"><button class="btn primary micbig${MIC.on?" rec":""}" id="saymic">${ICON_MIC}<span>${MIC.on?"Слушаю… нажми, чтобы закончить":"Говорить"}</span></button></div>
  <div id="sayres"></div>
  <div class="row"><button class="btn ghost" id="saynext">Другая фраза</button></div></div>
  <p class="small muted">Распознавание работает как собеседник-носитель: если система поняла слово, тебя поймёт и человек. Слова, которые не распознались, выделены жёлтым.</p>`;
}
function bindSay(){
  const s=PS.say,out=()=>document.getElementById("sayres");
  const m=$("#saymic");if(m)m.onclick=()=>{
    micListen((t,fin,ev)=>{const o=out();if(!o)return;
      if(!fin){o.innerHTML=`<div class="small muted">Слушаю: ${esc(t)}</div>`;const b=$("#saymic span");if(b)b.textContent="Слушаю… нажми, чтобы закончить";return}
      const b2=$("#saymic span");if(b2)b2.textContent="Говорить ещё раз";
      if(!t&&!(ev&&ev.alts&&ev.alts.length)){o.innerHTML="";return}
      const b=scoreSpeech(s.text,[t].concat((ev&&ev.alts)||[]));PS.sayN=(PS.sayN||0)+1;if(b.score>=.8)PS.sayOk=(PS.sayOk||0)+1;
      o.innerHTML=scoreHTML(s.text,b);bump(b.score>=.8,null)});
    const sp=$("#saymic span");if(sp)sp.textContent="Слушаю… нажми, чтобы закончить";
  };
  const n=$("#saynext");if(n)n.onclick=()=>{newSay();viewSpeak()};
}

ела? (разговорное)","/haʊz ɪt ˈɡəʊɪŋ/","Hi Tom! How's it going?","Привет, Том! Как дела?","A2"],["Not bad","неплохо","/nɒt bæd/","Not bad, thanks. And you?","Неплохо, спасибо. А у тебя?","A1"],["What do you do?","чем ты занимаешься? (о работе)","/wɒt duː juː duː/","So, what do you do?","Так чем ты занимаешься?","A1"],["by the way","кстати","/baɪ ðə weɪ/","By the way, have you seen the new film?","Кстати, ты видел новый фильм?","A2"],["Really?","правда?","/ˈrɪəli/","Really? That's amazing!","Правда? Это потрясающе!","A1"],["That sounds great","звучит здорово","/ðæt saʊndz ɡreɪt/","A trip to Italy? That sounds great!","Поездка в Италию? Звучит здорово!","A2"],["I see","понятно","/aɪ siː/","I see. And how long have you worked there?","Понятно. А сколько ты там работаешь?","A2"],["Nice talking to you","приятно было поговорить","/naɪs ˈtɔːkɪŋ tə juː/","I have to go. Nice talking to you!","Мне пора. Приятно было поговорить!","A2"],["Take care","береги себя, пока","/teɪk keə/","See you soon. Take care!","До скорого. Береги себя!","A2"],["What about you?","а ты?","/wɒt əˈbaʊt juː/","I love hiking. What about you?","Я люблю походы. А ты?","A1"],["It depends","смотря как, по-разному","/ɪt dɪˈpendz/","Do you like big cities? — It depends.","Ты любишь большие города? — По-разному.","A2"],["I have to go","мне пора","/aɪ hæv tə ɡəʊ/","Sorry, I have to go now.","Извини, мне пора.","A1"]],"lessons":[{"id":"pk-smalltalk","lvl":"A2","title":"Small talk: поддержать разговор","desc":"Вопросы-эхо, реакции и вежливое завершение","theory":"<p>В английском разговор поддерживают короткими <b>реакциями<\/b> и <b>встречными вопросами<\/b>. Молчание или ответ одним словом звучит холодно.<\/p><ul><li>Реакции: <i>Really? That sounds great! I see. Oh no!<\/i><\/li><li>Встречный вопрос: <i>What about you? And you?<\/i><\/li><li>Вопросы-эхо: <i>I live in Spain. — Oh, do you?<\/i> (повторяем вспомогательный глагол)<\/li><li>Завершить: <i>Anyway, I have to go. Nice talking to you!<\/i><\/li><\/ul>","ex":[{"type":"choice","q":"— I've just come back from Japan. — ___","o":["Really? How was it?","Yes.","I know."],"a":"Really? How was it?","why":"Реакция + вопрос поддерживают разговор."},{"type":"choice","q":"— I work in a bank. — Oh, ___ you?","o":["do","are","have"],"a":"do","why":"Эхо-вопрос повторяет вспомогательный глагол: I work → do you?"},{"type":"choice","q":"— I'm going to Paris next week. — Oh, ___ you?","o":["are","do","will"],"a":"are","why":"I'm going → are you?"},{"type":"choice","q":"Как вежливо закончить разговор?","o":["Anyway, I have to go. Nice talking to you!","Bye. I go.","Stop talking, please."],"a":"Anyway, I have to go. Nice talking to you!","why":"Anyway + причина + Nice talking to you — вежливо."},{"type":"choice","q":"— I love hiking. ___","o":["What about you?","What you?","And what?"],"a":"What about you?","why":"What about you? — «А ты?»"},{"type":"choice","q":"— How's it going? — ___","o":["Not bad, thanks. And you?","I'm going home.","It goes."],"a":"Not bad, thanks. And you?","why":"How's it going? — «Как дела?», а не «куда идёшь»."}]}],"texts":[{"title":"Meeting a neighbour","l":"A2","text":"Hi! You're the new neighbour, right? I'm Mike from number twelve. — Oh, hi Mike! Yes, I'm Olga. We moved in last week. — Nice to meet you, Olga. How do you like the area? — It's great. It's quiet, and the park is really close. — Oh, do you run? I run there every morning. — Really? I've just started running! — Great, we can run together sometime. Anyway, I have to go to work. Nice talking to you! — You too. Take care!","q":[{"q":"Когда Ольга переехала?","o":["На прошлой неделе","Вчера","Месяц назад"],"a":"На прошлой неделе"},{"q":"Что Ольге нравится в районе?","o":["Тишина и парк рядом","Магазины","Много кафе"],"a":"Тишина и парк рядом"},{"q":"Что предлагает Майк?","o":["Бегать вместе","Пойти в кафе","Помочь с переездом"],"a":"Бегать вместе"}]}],"id":"small-talk","title":"Small talk: как поддержать разговор","level":"A2"},"shopping":{"words":[["cash","наличные","/kæʃ/","Can I pay in cash?","Можно оплатить наличными?","A2"],["card","карта (банковская)","/kɑːd/","I'll pay by card.","Я заплачу картой.","A1"],["keep the change","сдачи не надо","/kiːp ðə tʃeɪndʒ/","Here you are. Keep the change!","Вот, сдачи не надо!","A2"],["discount","скидка","/ˈdɪskaʊnt/","Is there a discount for students?","Есть скидка для студентов?","A2"],["on sale","со скидкой","/ɒn seɪl/","These shoes are on sale.","Эти туфли со скидкой.","A2"],["size","размер","/saɪz/","What size are you?","Какой у вас размер?","A1"],["try on","примерить","/traɪ ɒn/","Can I try on this jacket?","Можно примерить эту куртку?","A2"],["fitting room","примерочная","/ˈfɪtɪŋ ruːm/","Where is the fitting room?","Где примерочная?","A2"],["refund","возврат денег","/ˈriːfʌnd/","I'd like a refund, please.","Я бы хотел вернуть деньги.","B1"],["queue","очередь","/kjuː/","There's a long queue at the checkout.","На кассе длинная очередь.","A2"],["checkout","касса","/ˈtʃekaʊt/","Please pay at the checkout.","Оплатите на кассе, пожалуйста.","A2"],["bargain","выгодная покупка","/ˈbɑːɡən/","This coat was a real bargain!","Это пальто — настоящая находка!","B1"],["save up","копить","/seɪv ʌp/","I'm saving up for a new laptop.","Я коплю на новый ноутбук.","B1"]],"texts":[{"title":"In a clothes shop","l":"A2","text":"Excuse me, can I try on this jacket? — Of course. What size are you? — Medium, I think. — Here you are. The fitting room is over there. … How is it? — It's a bit small. Do you have it in large? — Yes, here's a large one. And good news: it's on sale today, thirty percent off. — Great! I'll take it. Can I pay by card? — Sure. Would you like a bag? — No, thanks. I have one.","q":[{"q":"Какой размер подошёл покупателю?","o":["Большой (large)","Средний (medium)","Маленький (small)"],"a":"Большой (large)"},{"q":"Какая скидка на куртку?","o":["30%","50%","Скидки нет"],"a":"30%"},{"q":"Как покупатель платит?","o":["Картой","Наличными","Не платит"],"a":"Картой"}]}],"id":"shopping","title":"Покупки и деньги","level":"A2"},"tech":{"words":[["download","скачать","/ˌdaʊnˈləʊd/","Download the app for free.","Скачай приложение бесплатно.","A2"],["upload","загрузить (в сеть)","/ˌʌpˈləʊd/","I uploaded the photos yesterday.","Я загрузил фото вчера.","A2"],["password","пароль","/ˈpɑːswɜːd/","Never share your password.","Никому не сообщай свой пароль.","A2"],["log in","войти (в аккаунт)","/lɒɡ ɪn/","I can't log in to my account.","Не могу войти в аккаунт.","A2"],["sign up","зарегистрироваться","/saɪn ʌp/","Sign up with your email.","Зарегистрируйся по почте.","A2"],["screen","экран","/skriːn/","My phone screen is broken.","У меня разбит экран телефона.","A2"],["battery","аккумулятор","/ˈbætəri/","My battery is almost dead.","У меня почти сел аккумулятор.","A2"],["charge","заряжать","/tʃɑːdʒ/","I need to charge my phone.","Мне нужно зарядить телефон.","A2"],["settings","настройки","/ˈsetɪŋz/","Check your privacy settings.","Проверь настройки конфиденциальности.","B1"],["app","приложение","/æp/","This app helps me learn English.","Это приложение помогает мне учить английский.","A2"],["crash","вылетать (о программе)","/kræʃ/","The game keeps crashing.","Игра постоянно вылетает.","B1"],["notification","уведомление","/ˌnəʊtɪfɪˈkeɪʃn/","Turn off notifications at night.","Выключай уведомления на ночь.","B1"],["scroll","листать (ленту)","/skrəʊl/","I scroll social media too much.","Я слишком много листаю соцсети.","B1"],["online","онлайн, в сети","/ˌɒnˈlaɪn/","I buy most things online.","Почти всё я покупаю онлайн.","A2"]],"id":"tech","title":"Технологии и интернет","level":"B1"},"interview":{"words":[["CV","резюме","/ˌsiː ˈviː/","Please send us your CV.","Пришлите, пожалуйста, ваше резюме.","B1"],["apply for","подавать заявку на","/əˈplaɪ fɔː/","I'm applying for a job in marketing.","Я подаю заявку на работу в маркетинге.","B1"],["position","должность","/pəˈzɪʃn/","Why are you interested in this position?","Почему вас интересует эта должность?","B1"],["strengths","сильные стороны","/streŋθs/","What are your main strengths?","Каковы ваши главные сильные стороны?","B1"],["weaknesses","слабые стороны","/ˈwiːknəsɪz/","Tell me about your weaknesses.","Расскажите о своих слабых сторонах.","B1"],["be responsible for","отвечать за","/biː rɪˈspɒnsəbl fɔː/","I was responsible for a team of five.","Я отвечал за команду из пяти человек.","B1"],["achievement","достижение","/əˈtʃiːvmənt/","What's your biggest achievement?","Какое ваше самое большое достижение?","B1"],["work under pressure","работать в условиях стресса","/wɜːk ˈʌndə ˈpreʃə/","I can work under pressure.","Я умею работать под давлением.","B1"],["team player","человек, умеющий работать в команде","/tiːm ˈpleɪə/","I'm a real team player.","Я хорошо работаю в команде.","B1"],["notice period","срок отработки при увольнении","/ˈnəʊtɪs ˈpɪəriəd/","My notice period is one month.","Мне нужно отработать месяц.","B2"],["benefits","льготы, соцпакет","/ˈbenɪfɪts/","What benefits does the company offer?","Какой соцпакет предлагает компания?","B1"],["full-time","полный рабочий день","/ˌfʊl ˈtaɪm/","Is it a full-time job?","Это работа на полный день?","A2"],["part-time","неполный рабочий день","/ˌpɑːt ˈtaɪm/","I work part-time.","Я работаю на полставки.","A2"]],"texts":[{"title":"The interview","l":"B1","text":"So, tell me about yourself. — I've been working as a project manager for four years. In my current job I'm responsible for a team of six people. — Why are you applying for this position? — I'd like to work on bigger international projects, and your company is known for them. — What would you say is your main strength? — I'm well organised and I can work under pressure. Last year our team delivered a big project two weeks early. — And your weaknesses? — Sometimes I try to do everything myself, but I'm learning to delegate more. — Great. What's your notice period? — One month.","q":[{"q":"Сколько лет кандидат работает менеджером проектов?","o":["Четыре года","Шесть лет","Один год"],"a":"Четыре года"},{"q":"Почему он хочет в эту компанию?","o":["Хочет работать над крупными международными проектами","Там больше платят","Офис ближе к дому"],"a":"Хочет работать над крупными международными проектами"},{"q":"Какую слабость он называет?","o":["Старается всё делать сам","Опаздывает","Плохо работает в стрессе"],"a":"Старается всё делать сам"}]}],"id":"interview","title":"Собеседование на работу","level":"B1"},"business":{"words":[["I hope this email finds you well","надеюсь, у вас всё хорошо (начало письма)","/aɪ həʊp ðɪs ˈiːmeɪl faɪndz juː wel/","Hi Tom, I hope this email finds you well.","Привет, Том, надеюсь, у тебя всё хорошо.","B1"],["I'm writing to","пишу, чтобы…","/aɪm ˈraɪtɪŋ tə/","I'm writing to confirm our meeting.","Пишу, чтобы подтвердить нашу встречу.","B1"],["Please find attached","во вложении","/pliːz faɪnd əˈtætʃt/","Please find attached the report.","Отчёт во вложении.","B1"],["Let me know","дайте знать","/let miː nəʊ/","Let me know if you have any questions.","Дайте знать, если будут вопросы.","A2"],["at your earliest convenience","как только сможете","/ət jɔːr ˈɜːliɪst kənˈviːniəns/","Please reply at your earliest convenience.","Пожалуйста, ответьте, как только сможете.","B2"],["Best regards","с уважением (в конце письма)","/best rɪˈɡɑːdz/","Best regards, Anna","С уважением, Анна","A2"],["agenda","повестка","/əˈdʒendə/","Let's look at the agenda.","Давайте посмотрим повестку.","B1"],["to schedule a meeting","назначить встречу","/tə ˈʃedjuːl ə ˈmiːtɪŋ/","Can we schedule a meeting for Monday?","Можем назначить встречу на понедельник?","B1"],["to postpone","перенести (на позже)","/tə pəˈspəʊn/","We need to postpone the call.","Нам нужно перенести созвон.","B1"],["Can you hear me?","вы меня слышите?","/kæn juː hɪə miː/","Sorry, can you hear me now?","Извините, теперь меня слышно?","A2"],["You're on mute","у вас выключен микрофон","/jɔːr ɒn mjuːt/","Tom, I think you're on mute.","Том, кажется, у тебя выключен микрофон.","B1"],["to sum up","подводя итог","/tə sʌm ʌp/","To sum up, we need two more weeks.","Подводя итог: нам нужно ещё две недели.","B1"],["action items","задачи по итогам встречи","/ˈækʃn ˈaɪtəmz/","I'll send the action items after the call.","Я пришлю задачи после созвона.","B2"],["to be on the same page","одинаково понимать ситуацию","/tə biː ɒn ðə seɪm peɪdʒ/","Let's make sure we're on the same page.","Давайте убедимся, что мы понимаем друг друга.","B2"]],"texts":[{"title":"An email to a colleague","l":"B1","text":"Hi Sarah, I hope this email finds you well. I'm writing to confirm our meeting with the client on Thursday at 10 a.m. Please find attached the latest version of the presentation. Unfortunately, Mark can't join us, so we may need to postpone the second part of the discussion until next week. Could you please check the agenda and let me know if anything is missing? I'd also appreciate it if you could prepare a short summary of the budget. Thanks in advance. Best regards, Dmitry","q":[{"q":"Зачем Дмитрий пишет письмо?","o":["Подтвердить встречу с клиентом","Отменить проект","Попросить отпуск"],"a":"Подтвердить встречу с клиентом"},{"q":"Что приложено к письму?","o":["Презентация","Договор","Счёт"],"a":"Презентация"},{"q":"О чём Дмитрий просит Сару?","o":["Проверить повестку и подготовить сводку бюджета","Позвонить клиенту","Забронировать переговорную"],"a":"Проверить повестку и подготовить сводку бюджета"}]}],"id":"business","title":"Деловой английский: письма и встречи","level":"B1"},"grammar-plus":{"lessons":[{"id":"pk-ppc","lvl":"B1","title":"Present Perfect Continuous","desc":"Давно и до сих пор: have been + -ing","theory":"<p><b>have / has been + глагол с -ing<\/b> — действие началось в прошлом и <b>продолжается до сих пор<\/b> или только что закончилось, и виден результат.<\/p><ul><li><span class=\"ex\">I've been waiting for an hour!<\/span> — Я жду уже час!<\/li><li><span class=\"ex\">She's tired because she's been running.<\/span> — она бегала, поэтому устала.<\/li><\/ul><p>Вопрос «как долго?»: <b>How long have you been learning English?<\/b><\/p><p>Глаголы состояния (know, like, want, believe) в Continuous не ставят: <i>I've known him for years<\/i>, а не <i>I've been knowing<\/i>.<\/p>","ex":[{"q":"I ___ (wait) for you for an hour!","a":["have been waiting","'ve been waiting"],"why":"Началось час назад и продолжается → have been + -ing."},{"q":"She is tired because she ___ (run).","a":["has been running","'s been running"],"why":"Результат сейчас (устала) от недавнего длительного действия."},{"q":"How long ___ (you / learn) English?","a":["have you been learning"],"why":"How long + действие до сих пор → Present Perfect Continuous."},{"q":"It ___ (rain) since morning.","a":["has been raining","'s been raining"],"why":"С утра и до сих пор."},{"q":"I ___ (know) him for ten years.","a":["have known","'ve known"],"why":"Know — глагол состояния, только Present Perfect, без -ing."},{"q":"They ___ (work) on this project since May.","a":["have been working","'ve been working","have worked","'ve worked"],"why":"С мая и до сих пор: подходят обе формы, Continuous подчёркивает процесс."}]},{"id":"pk-art2","lvl":"B1","title":"Артикли: особые случаи","desc":"Реки, страны, инструменты, спорт, school и the school","theory":"<div class=\"tbl\"><table><tr><th>С the<\/th><th>Без артикля<\/th><\/tr><tr><td>реки, моря, океаны: the Thames, the Pacific<\/td><td>озёра и отдельные горы: Lake Baikal, Everest<\/td><\/tr><tr><td>страны-союзы: the USA, the UK<\/td><td>большинство стран: Russia, France<\/td><\/tr><tr><td>музыкальные инструменты: play the guitar<\/td><td>спорт и игры: play football, play chess<\/td><\/tr><\/table><\/div><p><b>go to school / work / bed / hospital<\/b> без артикля — когда идём туда по назначению (учиться, работать, спать, лечиться). С <b>the<\/b> — когда это просто здание: <i>Mum went to the school to talk to the teacher.<\/i><\/p>","ex":[{"type":"choice","q":"We sailed down ___ Thames.","o":["the","—","a"],"a":"th const PRAISE=["Молодец!","Отлично!","Верно!","Так держать!","Именно так!","Супер!","Браво!","Умница!","Точно!"];
const COMBO_MSG={3:"Три подряд — отличная серия!",5:"Пять подряд! Ты в ударе.",10:"Десять подряд! Это уже уверенное знание.",20:"Двадцать подряд! Я горжусь тобой."};

  V.querySelectorAll(".card .verdict:not([data-ya])").forEach(v=>{

    const nm=uname();let mood,msg;
    if(state==="ok"){
      mood=COMBO>=3?"proud":"happy";
      let p=COMBO_MSG[COMBO]||pick(PRAISE);
      if(nm&&!COMBO_MSG[COMBO]&&Math.random()<.3)p=p.replace(/!$/,", "+nm+"!");
      msg=yasRight(p)+(expl?" "+expl:"");
    }else if(state==="warn"){mood="happy";msg=yasTypo(expl)}

    el.innerHTML=yasik(mood,54,{teacher:false,anim:state==="ok"?(COMBO>=3?"party":"jump"):"nod"})+`<div class="ybub">${esc(msg)}</div>`;

let ACX=null;
function feedback(ok){
  if(S.settings.vibrate!==false&&navigator.vibrate){try{navigator.vibrate(ok?15:[25,40,25])}catch(e){}}
  if(S.settings.sound===false)return;
  try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();const t=ACX.currentTime;
    (ok?[660,990]:[330,247]).forEach((f,i)=>{const o=ACX.createOscillator(),g=ACX.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
      const s0=t+i*0.09;g.gain.setValueAtTime(0.0001,s0);g.gain.exponentialRampToValueAtTime(0.09,s0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s0+0.17);
      o.connect(g);g.connect(ACX.destination);o.start(s0);o.stop(s0+0.2)})}catch(e){}
}

  if(cn&&li(T())<=2&&!lessonToday)return{k:"course",t:`Урок ${cn.n}: ${cn.t}`,d:cn.g,b:"Начать урок",go:()=>{location.hash="#course";setTimeout(()=>{openCourseLesson(cn.n);window.scrollTo(0,0)},0)}};

/* ---------- GEMINI: свой ключ в приложении + «Открыть в Gemini» через подписку ---------- */
const GKEY="yasny-gemini-key";
function gemKey(){try{return localStorage.getItem(GKEY)||""}catch(e){return""}}
function gemSetKey(k){try{if(k)localStorage.setItem(GKEY,k);else localStorage.removeItem(GKEY)}catch(e){}}
const GEM_BASE="https://generativelanguage.googleapis.com/v1beta/";
function gemCount(){const d=dkey();S.aiCount=S.aiCount||{};return S.aiCount[d]||0}
function gemBump(){const d=dkey();S.aiCount=S.aiCount||{};S.aiCount[d]=(S.aiCount[d]||0)+1;const ks=Object.keys(S.aiCount).sort();while(ks.length>14)delete S.aiCount[ks.shift()]}
// Выбираем модели по тому, что реально доступно ключу
async function gemModels(key,force){
  if(!force&&S.settings.gmModels&&S.settings.gmModels.def)return S.settings.gmModels;
  const r=await fetch(GEM_BASE+"models?pageSize=200",{headers:{"x-goog-api-key":key}});
  if(r.status===400||r.status===401||r.status===403)throw{code:"bad_key"};
  if(!r.ok)throw{code:"upstream_error"};
  const j=await r.json();
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>String(m.name).replace(/^models\//,""));
  const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const clean=n=>!/(image|tts|audio|live|embedding|vision|thinking|exp|preview|native)/.test(n);
  const pickBest=re=>names.filter(n=>re.test(n)&&clean(n)).sort((a,b)=>ver(b)-ver(a)||a.length-b.length)[0]||names.filter(n=>re.test(n)).sort((a,b)=>ver(b)-ver(a))[0];
  const lite=pickBest(/^gemini-[\d.]+-flash-lite/),flash=pickBest(/^gemini-[\d.]+-flash(?!-lite)/);
  const res={quick:lite||flash,def:flash||lite};
  if(!res.def)throw{code:"no_model"};
  S.settings.gmModels=res;save();return res;
}
function gemParseJSON(t){
  const s=String(t).trim();try{return JSON.parse(s)}catch(e){}
  const f=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf("}"),s.lastIndexOf("]"));
  if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}
  throw{code:"invalid_json",text:s};
}
function makeGemini(key){
  async function call(input,opts,asJSON){
    opts=opts||{};const ms=await gemModels(key);
    const order=opts.modelTier==="quick"?[ms.quick,ms.def]:[ms.def,ms.quick];
    const turns=typeof input==="string"?[{role:"user",content:input}]:input;
    const contents=[];for(const t of turns){const role=t.role==="assistant"?"model":"user";const last=contents[contents.length-1];if(last&&last.role===role)last.parts[0].text+="\n\n"+t.content;else contents.push({role,parts:[{text:t.content}]})}
    let lastErr={code:"upstream_error"};
    for(const model of [...new Set(order.filter(Boolean))]){
      let r;
      try{r=await fetch(GEM_BASE+"models/"+encodeURIComponent(model)+":generateContent",{method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({contents,generationConfig:Object.assign({temperature:0.6,maxOutputTokens:4096},asJSON?{responseMimeType:"application/json"}:{})})})}
      catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};lastErr={code:"upstream_error"};continue}
      if(r.status===429){lastErr={code:"gem_limit"};continue}
      if(r.status===400||r.status===401||r.status===403){let j={};try{j=await r.json()}catch(e){}const msg=JSON.stringify(j);if(/API_KEY|PERMISSION|key/i.test(msg))throw{code:"bad_key"};lastErr={code:"upstream_error"};continue}
      if(r.status===404){S.settings.gmModels=null;lastErr={code:"upstream_error"};continue}
      if(!r.ok){lastErr={code:"upstream_error"};continue}
      const j=await r.json();gemBump();save();
      const cand=(j.candidates||[])[0];
      if(!cand||!cand.content){throw{code:(j.promptFeedback&&j.promptFeedback.blockReason)?"refused":"empty_completion"}}
      const text=(cand.content.parts||[]).map(p=>p.text||"").join("");
      if(!text.trim())throw{code:"empty_completion"};
      if(opts.onText)try{opts.onText({text,delta:text})}catch(e){}
      return asJSON?gemParseJSON(text):{text,truncated:cand.finishReason==="MAX_TOKENS"};
    }
    throw lastErr;
  }
  const f=(input,opts)=>call(input,opts,false);
  f.json=(input,opts)=>call(input,opts,true);
  f.gemini=true;
  return f;
}

let SEQ=null;
function voicesEn(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return[]}}
function stopSeq(){if(SEQ){SEQ.stop=true;clearTimeout(SEQ.tm);SEQ=null}try{speechSynthesis.cancel()}catch(e){}}
// lines: [[спикер, текст]]; onLine(i) — подсветка; onDone()
function speakSeq(lines,rate,onLine,onDone){
  stopSeq();if(!("speechSynthesis" in window)){toast("Озвучка недоступна в этом браузере");return}
  const vs=voicesEn(),pref=vs.filter(v=>v.lang.replace("_","-")===S.settings.voice);
  const pool=(pref.length>1?pref:vs);
  const voiceFor=sp=>{if(!pool.length)return null;return sp==="B"&&pool.length>1?pool[1]:pool[0]};
  const pitch={A:0.92,B:1.22};
  const me=SEQ={stop:false,i:0};
  const step=()=>{
    if(me.stop)return;
    if(me.i>=lines.length){SEQ=null;onLine&&onLine(-1);onDone&&onDone();return}
    const [sp,tx]=lines[me.i];onLine&&onLine(me.i);
    let fired=false;const next=()=>{if(fired||me.stop)return;fired=true;clearTimeout(me.tm);me.i++;me.tm=setTimeout(step,380)};
    try{
      const u=new SpeechSynthesisUtterance(tx);u.lang=S.settings.voice;u.rate=rate*0.95;u.pitch=pitch[sp]||1;
      const v=voiceFor(sp);if(v)u.voice=v;u.onend=next;u.onerror=next;
      if(me.i===0)speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){}
    // запасной таймер: в приложении на iPhone событие окончания не приходит
    const est=(tx.split(/\s+/).length*0.42+0.7)/Math.max(0.4,rate);
    const reliable=!window.__NATIVE_APP||!!window.__ttsDone;
    me.tm=setTimeout(next,(reliable?est*2.2+2:est)*1000);
  };
  step();
}

// Отметка после завершения шага: тост «следующий шаг»

/* ---------- Контрольная уровня ---------- */
function startExam(L){
  const ls=LESSONS.filter(l=>l.lvl===L&&l.ex&&l.ex.length);
  let items=[];
  ls.forEach(l=>{shuffle(l.ex.map((_,i)=>i)).slice(0,2).forEach(i=>items.push({k:"grammar",ref:l.id+":"+i,t:l.id,l:L}))});
  items=shuffle(items).slice(0,10);
  const sn=shuffle(SENTENCES.map((s,i)=>[s,i]).filter(([s])=>s.l===L)).slice(0,12-items.length);
  sn.forEach(([s,i])=>items.push({k:"tr",ref:String(i),t:s.t||"tr",l:L}));
  if(items.length<4){toast("Для этого уровня пока мало заданий");return}
  const q=shuffle(items).map((x,i)=>({key:"x"+i,k:"exam",ref:x.k+"|"+x.ref,ek:x.k,eref:x.ref,t:x.t,l:x.l,s:0,n:0,exam:true}));
  MS={active:true,quick:true,exam:L,queue:q,done:0,ok:0,cur:null,res:null};MS.cur=MS.queue.shift();
  if(location.hash==="#mistakes")renderReview();else location.hash="#mistakes";
}
const _answerReview=answerReview;
answerReview=function(v){
  const m=MS&&MS.cur;if(!m||!m.exam)return _answerReview(v);
  const t=taskOf(m);let ok=false,typo=false,best=t.show,cres=null;
  if(!v)ok=false;else if(t.input==="choice")ok=v===t.answers[0];
  else{const c=check(v,t.answers,t.tol!==false);cres=c;ok=c.status!=="bad";typo=c.status==="typo";best=c.best||t.show}
  if(!ok)mistake(m.ek,m.eref,false,v,{t:m.t,l:m.l});
  MS.done++;if(ok)MS.ok++;bump(ok,m.l);save();
  MS.res={ok,typo,user:v,best,cres};renderReview();
};
const _renderReview=renderReview;
renderReview=function(){
  if(MS&&MS.exam&&!MS.cur){
    MS.active=false;const L=MS.exam,pc=Math.round(MS.ok/Math.max(1,MS.done)*100),pass=pc>=80;
    S.pathx=S.pathx||{};const p=S.pathx[L];S.pathx[L]={best:Math.max(pc,p?p.best:0),pass:pass||!!(p&&p.pass),date:dkey()};save();
    const nx=LEVELS[li(L)+1];
    V.innerHTML=resultHTML({title:"Контрольная "+L,right:MS.ok,total:MS.done,note:pass?(nx?`Сдано! Уровень ${L} пройден.`:"Сдано! Весь путь пройден."):`Нужно 80%, у тебя ${pc}%. Ошибки ушли в повтор — поработай с ними и попробуй снова завтра.`,buttons:`<a class="btn" href="#path">Мой путь</a><a class="btn primary" href="#today">На главную</a>`});
    MS=null;
    if(pass){if(nx&&T()===L)setLevel(nx,"path");else if(!nx)setTimeout(()=>celebrate({badge:"B2",title:"Путь пройден!",text:"Все шаги до уровня B2 позади. Дальше — больше чтения, разговоров и новых наборов слов.",stats:celebStats()}),400)}
    return;
  }
  _renderReview();
  if(MS&&MS.exam&&V){const h=V.querySelector("h1");if(h)h.textContent="Контрольная "+MS.exam;
    const vd=V.querySelector(".verdict");if(vd&&MS.res){vd.innerHTML=MS.res.ok?"Верно"+(MS.res.typo?" <span>(с опечаткой)</span>":""):"Неверно <span>· добавлено в ошибки</span>"}
    const ct=V.querySelector(".card-top");if(ct&&ct.lastElementChild&&ct.children.length>1)ct.lastElementChild.outerHTML=`<span>контрольная</span>`}

/* ---------- Главная следует пути ---------- */
const _nextAction=nextAction;
nextAction=function(){
  const base=_nextAction();
  if(["test","mist","rrev"].includes(base.k))return base;
  const md=dueMist().length,dw=dueWords().length;
  const c=pathCurrent();
  // много повторений — сначала повторяем, потом новое
  if(md+dw>=15&&base.k==="quick")return base;
  if(c){
    // слова: если на сегодня новые уже взяты — следующий шаг, а слова подтянутся завтра
    if(c.s.k==="words"&&newLeft()<=0){const st=pathSteps(T()),n2=st.find(x=>!x.fin&&x.s.k!=="words");if(n2)return pathAction(n2,base)}

  }

};

}

/* ===================== ИТОГИ НЕДЕЛИ ОТ ЯСИКА ===================== */
function weekStart(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);const wd=(d.getDay()+6)%7;return d.getTime()-wd*DAY}
function weekStats(from){
  const to=from+7*DAY,keys=[];for(let t=from;t<to;t+=DAY)keys.push(dkey(t+3600e3*3));
  let n=0,ok=0,act=0;keys.forEach(k=>{const d=S.days[k];if(d&&d.n){n+=d.n;ok+=d.ok;act++}});
  const kset=new Set(keys);
  const words=Object.values(S.cards).filter(c=>kset.has(c.added)).length;
  const lessons=Object.values(S.lessons||{}).filter(x=>kset.has(x.last)).length+Object.values(S.course||{}).filter(x=>x&&kset.has(x.date)).length;
  const fixed=Object.values(S.mist||{}).filter(m=>m.fixed&&m.fixed>=from&&m.fixed<to).length;
  return{n,ok,act,words,lessons,fixed,acc:n?Math.round(ok/n*100):0};
}
function weakTopic(){const g={};Object.values(S.mist||{}).filter(m=>!m.done).forEach(m=>{const t=m.t||m.k;g[t]=(g[t]||0)+1});const e=Object.entries(g).sort((a,b)=>b[1]-a[1])[0];return e&&e[1]>=2?e[0]:null}
function weeklyCard(){
  const ws=weekStart(),prevFrom=ws-7*DAY;
  if((S.weeklySeen||0)>=ws)return"";
  const a=weekStats(prevFrom),b=weekStats(prevFrom-7*DAY);
  if(!a.n)return"";
  const nm=uname(),diff=a.n-b.n;
  const cmp=b.n?(diff>0?`На ${diff} ${plural(diff,["ответ","ответа","ответов"])} больше, чем неделей раньше — растём!`:diff<0?`Чуть меньше, чем неделей раньше (${b.n}). Ничего — главное не бросать.`:"Ровно как неделей раньше — стабильность!"):"Это твоя первая полная неделя — отличное начало!";
  const wt=weakTopic();const c=pathCurrent();
  const mood=a.act>=5?"proud":a.act>=3?"happy":"think";
  const head=a.act>=5?`${nm?nm+", ты":"Ты"} занимался(ась) ${a.act} ${plural(a.act,["день","дня","дней"])} из 7 — это очень круто!`:a.act>=3?`${a.act} ${plural(a.act,["день","дня","дней"])} занятий на прошлой неделе — хороший ритм.`:`На прошлой неделе было ${a.act} ${plural(a.act,["день","дня","дней"])} занятий. Давай на этой попробуем хотя бы 4 — по 10 минут.`;

    <div class="rstats wk">
      <div><b>${a.n}</b><span>${plural(a.n,["ответ","ответа","ответов"])}</span></div>
      <div><b>${a.acc}%</b><span>точность${b.n?` <em class="${a.acc>=b.acc?"up":"down"}">${a.acc>=b.acc?"▲":"▼"}${Math.abs(a.acc-b.acc)}</em>`:""}</span></div>
      <div><b>${a.words}</b><span>новых слов</span></div>
      <div><b>${a.lessons}</b><span>${plural(a.lessons,["урок","урока","уроков"])}</span></div>
      <div><b>${a.fixed}</b><span>${plural(a.fixed,["ошибка исправлена","ошибки исправлены","ошибок исправлено"])}</span></div>
    </div>
    ${wt||c?`<div class="small" style="margin-top:6px"><b>План на эту неделю:</b> ${c?`дойти до шага «${esc(c.t)}»`:"повторять и читать"}${wt?`; подтянуть тему «${esc(topicName(wt))}» — там больше всего ошибок`:""}.</div>`:""}
  </section>`;

/* ===================== РАЗГОВОР С ЯСИКОМ (без ИИ) ===================== */
let TK=null;
function talkNorm(s){return String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/[^\w\s']/g," ").replace(/\s+/g," ").trim()}
function talkPick(){
  const L=li(T()),seen=S.talk||{};
  let pool=TALK.filter(x=>li(x.l)<=L&&li(x.l)>=L-1);if(pool.length<4)pool=TALK.filter(x=>li(x.l)<=L);if(!pool.length)pool=TALK.slice();
  const last=TK&&TK.cur?TK.cur.id:null;
  pool=pool.filter(x=>x.id!==last);
  pool.sort((a,b)=>((seen[a.id]||{}).n||0)-((seen[b.id]||{}).n||0)||Math.random()-.5);
  return pool[0];
}
function talkJudge(p,ans){
  const a=talkNorm(ans),words=a?a.split(" ").length:0;
  const miss=(p.need||[]).filter(src=>{try{return !new RegExp(src,"i").test(a)}catch(e){return false}});
  const short=words<(p.min||2);
  return{ok:!short&&!miss.length,short,miss:miss.length,words};
}

    if(r.user&&!AI.off)fb+=TK.ai?`<div class="sheet" style="background:var(--soft)">${TK.ai.busy?"Ясик проверяет грамматику…":TK.ai.err?esc(TK.ai.err):`<b>Исправленный вариант:</b> ${esc(TK.ai.fixed||r.user)}${sayBtn(TK.ai.fixed||r.user)}<div class="small" style="margin-top:6px">${esc(TK.ai.note||"")}</div>`}</div>`:`<div class="row"><button class="btn small" id="tkai">Проверить грамматику с ИИ</button></div>`;
    fb+=`<div class="row">${r.ok?"":`<button class="btn" id="tkagain">Попробовать ещё раз</button>`}<button class="btn primary" id="tknext">Следующий вопрос</button></div>`;
  }

  <p class="sub">Ясик задаёт вопрос — ответь ${mic?"вслух (кнопка микрофона) или напиши":"письменно (в приложении на телефоне можно голосом)"}. Отвечай о себе, целыми предложениями. Ошибиться не страшно — главное говорить.</p>
  <div class="card">
    <div class="card-top"><span>Вопрос · ${p.l}</span><span></span></div>

    <div class="row"><button class="btn" data-say="${esc(p.q)}">Повторить вопрос</button><button class="btn" data-say="${esc(p.q)}" data-rate="0.65">Медленно</button><button class="btn ghost" id="tktr">${TK.tr?"Скрыть перевод":"Перевод"}</button></div>
    <textarea id="tkin" placeholder="Твой ответ по-английски" autocomplete="off" autocapitalize="off" spellcheck="false" ${r?"disabled":""}>${r?esc(r.user):""}</textarea>
    ${r?"":`<div class="row"><button class="btn primary" id="tkchk">Ответить</button>${micBtn("tkin")}<button class="btn ghost" id="tkidk">Не знаю, что сказать</button></div>`}

  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};

function talkAnswer(v){

/* ===================== 10 МИНУТ: короткое занятие ===================== */
function tenQueue(){
  const dm=dueMist().slice(0,5);
  const dw=dueWords().slice(0,Math.max(3,8-dm.length)).map(w=>({key:"q:"+w.id,k:"word",ref:w.id,s:0,n:0,synthetic:true}));
  let q=dm.concat(dw);
  // если повторять нечего — пара заданий по уже пройденным правилам
  if(q.length<6){
    const done=Object.keys(S.lessons||{}).map(id=>LESSONS.find(l=>l.id===id)).filter(l=>l&&l.ex&&l.ex.length);
    shuffle(done).slice(0,3).forEach((l,k)=>{const i=Math.floor(Math.random()*l.ex.length);q.push({key:"t"+k,k:"exam",ref:"grammar|"+l.id+":"+i,ek:"grammar",eref:l.id+":"+i,t:l.id,l:l.lvl,s:0,n:0,exam:true})});
  }
  return shuffle(q).slice(0,9);
}

/* ===================== КАРТОЧКИ СЛОВ: собрать ответ нажатиями ===================== */
const WT={};
function tilesOn(kind){const m=(S.settings.tileMode||{})[kind];return m?m==="tiles":li(T())<=1}
function setTilesMode(kind,on){S.settings.tileMode=S.settings.tileMode||{};S.settings.tileMode[kind]=on?"tiles":"type";save()}
function tileWords(s){return String(s||"").replace(/[.,!?;:"«»]/g," ").split(/\s+/).filter(Boolean)}
// inputId — поле ответа; key — уникальный ключ задания; answer — эталон; extras — слова-отвлекалки
function attachTiles(inputId,key,answer,extras,kind,rerender){
  const el=document.getElementById(inputId);if(!el||el.disabled)return;
  const inline=!!el.closest(".q");
  const host=inline?el.closest(".q"):el;
  const sw=document.createElement("button");sw.className="tswitch";sw.type="button";
  if(!tilesOn(kind)){
    sw.textContent="Собрать из карточек";sw.onclick=()=>{setTilesMode(kind,true);rerender()};
    host.insertAdjacentElement("afterend",sw);return;
  }
  if(!WT[key]){
    const words=tileWords(answer),low=words.map(w=>w.toLowerCase());
    const ex=shuffle([...new Set(tileWords((extras||[]).join(" ")).filter(w=>!low.includes(w.toLowerCase())))]).slice(0,words.length<=2?3:Math.min(4,Math.ceil(words.length/2)));
    WT[key]={pool:shuffle(words.concat(ex)).map(w=>({w,u:false})),pick:[]};
  }
  const P=WT[key];
  const box=document.createElement("div");box.className="wtbox";
  box.innerHTML=(inline?"":`<div class="tline" aria-label="Твой ответ"></div>`)+`<div class="tpool"></div>`;
  host.insertAdjacentElement("afterend",box);
  if(inline){el.readOnly=true;el.classList.add("tfill")}else el.hidden=true;
  sw.textContent="Набрать текстом";sw.onclick=()=>{setTilesMode(kind,false);delete WT[key];rerender()};
  box.insertAdjacentElement("afterend",sw);
  const tl=box.querySelector(".tline"),tp=box.querySelector(".tpool");
  const draw=()=>{
    const val=P.pick.map(i=>P.pool[i].w).join(" ");
    if(tl)tl.innerHTML=P.pick.length?P.pick.map((pi,k)=>`<button class="tile" type="button" data-k="${k}">${esc(P.pool[pi].w)}</button>`).join(""):'<span class="muted small">Нажимай на слова по порядку</span>';
    tp.innerHTML=P.pool.map((t,i)=>`<button class="tile${t.u?" used":""}" type="button" data-i="${i}" ${t.u?"disabled":""}>${esc(t.w)}</button>`).join("");
    if(inline&&P.pick.length){el.style.width=Math.max(8,val.length+2)+"ch"}
    el.value=val;
    const back=k=>{P.pool[P.pick[k]].u=false;P.pick.splice(k,1);draw()};
    if(tl)tl.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>back(+b.dataset.k));
    else el.onclick=()=>{if(P.pick.length)back(P.pick.length-1)};
    tp.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;P.pool[i].u=true;P.pick.push(i);draw()});
  };
  draw();
}

function enVoices(){let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}

function accentName(lang){const m={US:"американский",GB:"британский",AU:"австралийский",IE:"ирландский",IN:"индийский",ZA:"южноафриканский",CA:"канадский",NZ:"новозеландский",SC:"шотландский"};const c=(lang.split(/[-_]/)[1]||"").toUpperCase();return m[c]||lang}
function pickVoice(alt){
  const vs=enVoices();if(!vs.length)return null;
  const name=S.settings.voiceName;let main=name&&vs.find(v=>v.name===name);
  if(!main)main=vs.find(v=>v.lang.replace("_","-")===S.settings.voice&&VQ_RE.test(v.name))||vs.find(v=>v.lang.replace("_","-")===S.settings.voice)||vs[0];
  if(!alt)return main;
  return vs.find(v=>v!==main&&v.lang===main.lang)||vs.find(v=>v!==main)||main;
}
function voiceRate(){return S.settings.rate||1}
speak=function(text,rate=1){
  if(!("speechSynthesis" in window)){toast("Озвучка недоступна в этом браузере");return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=pickVoice(false);
    u.lang=v?v.lang.replace("_","-"):S.settings.voice;if(v)u.voice=v;u.rate=rate*0.95*voiceRate();
    speechSynthesis.speak(u)}catch(e){toast("Не получилось озвучить")}
};
// диалоги: второй собеседник — другим голосом
voicesEn=function(){const a=pickVoice(false),b=pickVoice(true);return a?[a,b||a]:[]};
const _speakSeqV=speakSeq;
speakSeq=function(lines,rate,onLine,onDone){return _speakSeqV(lines,rate*voiceRate(),onLine,onDone)};
const SAMPLE="Hello! I'm your English voice. Let's learn together.";
function voiceHTML(){
  const vs=enVoices(),cur=pickVoice(false),r=voiceRate();
  const native=!!window.__NATIVE_APP&&!window.__TG&&!vs.length;
  return `<section class="sheet"><h2>Голос</h2>
  ${native?`<p class="small muted" style="margin:-4px 0 10px">В приложении на телефоне голос берётся из настроек телефона: Настройки → Специальные возможности → Синтез речи (на Android — «Синтезатор речи Google», там можно скачать голоса получше). Выбор голоса прямо здесь появится в следующей версии приложения.</p>`
   :vs.length?`<p class="small muted" style="margin:-4px 0 10px">Нажми ▶, чтобы послушать. Голоса с пометкой «живой» обычно звучат естественнее.</p>
  <div class="vlist">${vs.slice(0,24).map((v,i)=>`<div class="vrow ${cur&&v.name===cur.name?"on":""}"><button class="iconbtn" data-vplay="${i}" aria-label="Послушать">${ICON_PLAY}</button><button class="vpick" data-vpick="${i}"><b>${esc(v.name.replace(/^(Microsoft|Google|Apple)\s+/,"").replace(/\s*\(.*\)$/,"").slice(0,40))}</b><span class="small muted">${esc(accentName(v.lang))}${VQ_RE.test(v.name)?" · живой":""}</span></button>${cur&&v.name===cur.name?`<span class="pill known">выбран</span>`:""}</div>`).join("")}</div>`
   :`<p class="small muted" style="margin:0">Голоса ещё загружаются… Если список не появится, этот браузер не даёт выбрать голос.</p>`}
  <div class="label" style="margin:14px 0 8px">Скорость речи</div>
  <div class="seg" role="group" aria-label="Скорость">${[[0.8,"Медленно"],[0.9,"Спокойно"],[1,"Обычно"],[1.1,"Быстро"]].map(([k,t])=>`<button data-vrate="${k}" aria-pressed="${k===r}">${t}</button>`).join("")}</div>
  </section>`;
}
const _viewSettingsV=viewSettings;
viewSettings=function(){
  _viewSettingsV();
  const th=V.querySelector(".swatches");const sec=th?th.closest("section"):null;
  if(sec)sec.insertAdjacentHTML("afterend",voiceHTML());
  const vs=enVoices();
  V.querySelectorAll("[data-vplay]").forEach(b=>b.onclick=()=>{const v=vs[+b.dataset.vplay];try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SAMPLE);u.voice=v;u.lang=v.lang;u.rate=0.95*voiceRate();speechSynthesis.speak(u)}catch(e){}});
  V.querySelectorAll("[data-vpick]").forEach(b=>b.onclick=()=>{const v=vs[+b.dataset.vpick];S.settings.voiceName=v.name;S.settings.voice=/GB/i.test(v.lang)?"en-GB":"en-US";save();viewSettings();speak(SAMPLE)});
  V.querySelectorAll("[data-vrate]").forEach(b=>b.onclick=()=>{S.settings.rate=+b.dataset.vrate;save();viewSettings();speak("This is how fast I speak now.")});
  // старый выбор «Произношение» больше не нужен, если есть список голосов
  if(vs.length){const sv=$("#svoice");if(sv){const lab=V.querySelector('label[for="svoice"]');sv.remove();if(lab)lab.remove()}}
};

/* ---------- Ситуации ---------- */

/* ---------- Найди ошибку ---------- */
let FX=null;
function fixPick(){const pool=FIXES.filter(f=>lvlOk(f[5]));const seen=(S.fixSeen||[]);const fresh=pool.filter(f=>!seen.includes(f[0]));return shuffle((fresh.length>=3?fresh:pool).slice())[0]}
function fixIdx(f){const m=new RegExp("(^|[^A-Za-z'])"+f[1]+"(?![A-Za-z])").exec(f[0]);return m?m.index+m[1].length:f[0].indexOf(f[1])}
function fixChunks(f){const s=f[0],i=fixIdx(f),pre=s.slice(0,i).trim(),post=s.slice(i+f[1].length).trim();
  const tk=x=>x?x.split(/\s+/):[];return tk(pre).map(w=>({w,bad:false})).concat([{w:f[1]+(post&&/^[.,!?]/.test(post)?post.match(/^[.,!?]+/)[0]:""),bad:true}]).concat(tk(post.replace(/^[.,!?]+\s*/,"")).map(w=>({w,bad:false})))}
function fixed(f){const i=fixIdx(f),s=(f[0].slice(0,i)+f[2]+f[0].slice(i+f[1].length)).replace(/\s{2,}/g," ").replace(/\s([.,!?])/g,"$1");return s.charAt(0).toUpperCase()+s.slice(1)}
function viewFix(){if(!FX)FX={f:fixPick(),stage:"tap",n:0,ok:0};renderFix()}
function renderFix(){
  const f=FX.f,ch=fixChunks(f);
  let body="";
  if(FX.stage==="tap")body=`<div class="label">Нажми на слово с ошибкой</div><div class="fixline">${ch.map((c,i)=>`<button class="tile" data-ci="${i}">${esc(c.w)}</button>`).join("")}</div>`;
  else if(FX.stage==="fix")body=`<div class="label">Верно, ошибка здесь! Как исправить?</div><div class="fixline">${ch.map(c=>`<span class="fixw ${c.bad?"bad":""}">${esc(c.w)}</span>`).join(" ")}</div>
    <div class="choices col">${FX.o.map(o=>`<button class="btn" data-fx="${esc(o)}">${o?esc(o):`убрать «${esc(f[1])}»`}</button>`).join("")}</div>`;
  else{const good=fixed(f);
    body=`<div class="verdict ${FX.res?"ok":"bad"}">${FX.res?"Исправлено!":FX.miss?"Почти! Ошибка пряталась в другом месте":"Почти! Исправить нужно чуть иначе"}</div>
    <div class="fixline">${ch.map(c=>`<span class="fixw ${c.bad?"bad":""}">${esc(c.w)}</span>`).join(" ")}</div>
    <div class="example"><span class="row" style="gap:8px;flex-wrap:nowrap"><span><b>${esc(good)}</b></span>${sayBtn(good)}</span></div>
    <div class="why">${esc(f[4])}</div><div class="row"><button class="btn primary" id="fxnext">Следующее</button></div>`}
  V.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h1 style="margin:0">Найди ошибку</h1><span class="small muted">${FX.n?`Верно: ${FX.ok} из ${FX.n}`:f[5]}</span></div>
  <p class="sub">В каждом предложении ровно одна ошибка — найди её и исправь.</p><div class="card">${body}</div>`;
  const done=(ok,user)=>{FX.n++;if(ok)FX.ok++;S.fixSeen=(S.fixSeen||[]).concat(f[0]).slice(-40);practiceLog("fix",ok);mistake("fix",FIXES.indexOf(f),ok,user||"",{t:"fix",l:f[5]});bump(ok,f[5]);FX.stage="done";FX.res=ok;renderFix()};
  V.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.ci];if(c.bad){FX.stage="fix";FX.o=shuffle([f[2]].concat(f[3]));renderFix()}else{FX.miss=true;done(false,c.w)}});
  V.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{FX.miss=false;done(b.dataset.fx===f[2],b.dataset.fx)});
  const nx=$("#fxnext");if(nx){nx.focus();nx.onclick=()=>{FX.f=fixPick();FX.stage="tap";FX.miss=false;renderFix()}}

/* ---------- Собери диалог ---------- */

function orderPool(){
  const ds=DIALOGS.filter(d=>lvlOk(d.l)).map(d=>({t:d.title,l:d.l,lines:d.lines}));
  COURSE.forEach(L=>{if(courseDone(L.n)||li(L.lvl)<=li(T())-1||(li(T())<=1&&L.n<=30))ds.push({t:"Урок "+L.n+": "+L.t,l:L.lvl==="A0"?"A1":L.lvl,lines:L.d})});
  return ds.filter(d=>d.lines.length>=4);
}
function orderPick(){const p=orderPool(),seen=S.orderSeen||[];const fresh=p.filter(d=>!seen.includes(d.t));const d=shuffle((fresh.length?fresh:p).slice())[0];
  const lines=d.lines.slice(0,6);
  let mix;do{mix=shuffle(lines.map((x,i)=>i))}while(lines.length>1&&mix.every((x,i)=>x===i));
  return{d,lines,mix,pick:[],res:null}}
function viewOrder(){if(!OD)OD=Object.assign(orderPick(),{n:0,ok:0});renderOrder()}

let SP=null;
function sprintWords(){const L=li(T());let ws=allWords().filter(w=>!w.custom&&li(w.lvl)<=L&&w.ru&&w.ru.length<40);const st=ws.filter(w=>S.cards[w.id]);if(st.length>=30)ws=st;return ws}
function sprintNext(){const ws=SP.ws,w=ws[Math.floor(Math.random()*ws.length)];let ru=w.ru,truth=Math.random()<.5;
  if(!truth){const tk=x=>x.toLowerCase().split(/[\s,;()\/.!?«»—-]+/).filter(t=>t.length>2),mine=new Set(tk(w.ru));const o=ws.filter(x=>x.id!==w.id&&x.en!==w.en&&!tk(x.ru).some(t=>mine.has(t)));if(o.length)ru=o[Math.floor(Math.random()*o.length)].ru;else truth=true}
  SP.cur={w,ru,truth}}
function viewSprint(){
  clearInterval(SP&&SP.tm);

  if(!SP||SP.state!=="run"&&SP.state!=="end"){
    V.innerHTML=`<h1>Спринт</h1><p class="sub">60 секунд: верный перевод или нет? Отвечай как можно быстрее. Каждый верный ответ — очко в соревновании.</p>
    <div class="card" style="text-align:center">${yasay("happy",best?`Твой рекорд — <b>${best}</b>. Побьёшь?`:"Готов(а)? Время пойдёт сразу!",64)}
    <div class="row" style="justify-content:center"><button class="btn primary big" id="spgo">Старт</button></div>
    <p class="small muted" style="margin:0">На клавиатуре: ← неверно, → верно</p></div>`;
    $("#spgo").onclick=()=>{SP={state:"run",ws:sprintWords(),t0:Date.now(),n:0,ok:0,combo:0,best:0,miss:[]};sprintNext();renderSprint()};
    return;
  }

}
function renderSprint(){
  clearInterval(SP.tm);

    const rec=SP.ok>((S.sprint||{}).best||0)&&!SP.saved;
    if(!SP.saved){SP.saved=true;SP.rec=rec;S.sprint=S.sprint||{best:0,n:0};S.sprint.n++;if(rec)S.sprint.best=SP.ok;questBest("sprintBest",SP.ok);questCheck();save()}
    V.innerHTML=`<h1>Спринт</h1><div class="card" style="text-align:center">${yasay(SP.rec?"proud":SP.ok>=10?"happy":"think",SP.rec?`Новый рекорд — <b>${SP.ok}</b>!`:`Результат: <b>${SP.ok}</b>. Рекорд — ${S.sprint.best}.`,72)}

    ${SP.miss.length?`<div style="text-align:left"><div class="label" style="margin-bottom:6px">Что повторить</div>${SP.miss.slice(0,6).map(m=>`<div class="small"><b>${esc(m.en)}</b> — ${esc(m.ru)}</div>`).join("")}</div>`:""}
    <div class="row" style="justify-content:center"><button class="btn primary" id="spagain">Ещё раз</button><a class="btn ghost" href="#train">К практике</a></div></div>`;
    $("#spagain").onclick=()=>{SP={state:"run",ws:sprintWords(),t0:Date.now(),n:0,ok:0,combo:0,best:0,miss:[]};sprintNext();renderSprint()};
    return;
  }
  const left=()=>Math.max(0,60-Math.floor((Date.now()-SP.t0)/1000));
  const c=SP.cur;
  V.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h1 style="margin:0">Спринт</h1><span class="sptime" id="sptime">${left()}</span></div>
  <div class="meter sptbar"><i id="spbar" style="width:${left()/60*100}%"></i></div>
  <div class="card spcard ${SP.flash||""}" style="text-align:center">
    <div class="small muted">Верно: ${SP.ok}${SP.combo>=3?` · серия ${SP.combo}`:""}</div>
    <div class="prompt" style="margin:8px 0 2px">${esc(c.w.en)}</div><div class="spru">${esc(c.ru)}</div>
    <div class="row sprow"><button class="btn big spno" id="spno">Неверно</button><button class="btn big primary spyes" id="spyes">Верно</button></div></div>`;
  SP.flash="";
  const ans=v=>{if(SP.state!=="run")return;const ok=v===c.truth;SP.n++;if(ok){SP.ok++;SP.combo++;SP.best=Math.max(SP.best,SP.combo)}else{SP.combo=0;SP.miss.push({en:c.w.en,ru:c.w.ru})}
    SP.flash=ok?"fok":"fbad";practiceLog("sprint",ok);bump(ok,null);sprintNext();if(left()<=0){SP.state="end"}renderSprint()};
  $("#spno").onclick=()=>ans(false);$("#spyes").onclick=()=>ans(true);
  document.onkeydown=e=>{if((location.hash||"").slice(1)!=="sprint"||!SP||SP.state!=="run"){document.onkeydown=null;return}if(e.key==="ArrowLeft"){e.preventDefault();ans(false)}else if(e.key==="ArrowRight"){e.preventDefault();ans(true)}};
  SP.tm=setInterval(()=>{if((location.hash||"").slice(1)!=="sprint"){clearInterval(SP.tm);SP.state="idle";return}
    const l=left(),t=$("#sptime"),b=$("#spbar");if(t)t.textContent=l;if(b)b.style.width=(l/60*100)+"%";if(l<=0){SP.state="end";renderSprint()}},250);
}
