 e:{n:"See you around!",ru:"Ещё увидимся!",end:"Теперь у тебя есть знакомый сосед — и, кажется, новый друг."}}},
{id:"market",l:"A1",t:"На рынке",d:"Купить фрукты и узнать цену",start:"a",nodes:{
 a:{n:"Hi there! Lovely apples today!",ru:"Привет! Сегодня чудесные яблоки!",o:[["How much are the apples?",1,"b"],["How much is the apples?",0,null,"Apples — много, поэтому are: How much are the apples?"],["How many are the apples?",0,null,"Цена — how much. How many — «сколько штук»."]]},
 b:{n:"Two pounds a kilo.",ru:"Два фунта за килограмм.",o:[["A kilo, please.",1,"c"],["Two kilos, please.",1,"c"],["A kilo apples, please.",0,null,"Нужно of: a kilo of apples. Или коротко: A kilo, please."]]},
 c:{n:"Here you are. Would you like some strawberries too? They're sweet.",ru:"Вот, пожалуйста. Может, ещё клубники? Она сладкая.",o:[["Yes, please. A small box.",1,"d1"],["No, thanks. Just the apples.",1,"d2"],["Yes, please. A small boxes.",0,null,"A — значит одна: a small box."]]},
 d1:{n:"Try one first! … Good?",ru:"Сначала попробуйте! … Ну как?",o:[["Mmm, it's delicious!",1,"e1"],["It's very tasty!",1,"e1"],["It's deliciously!",0,null,"После it's — прилагательное: delicious."]]},
 d2:{n:"No problem. That's two pounds.",ru:"Без проблем. Два фунта.",o:[["Here you are. Thank you!",1,"e2"],["Keep it.",0,null,"Keep the change — «сдачи не надо», но сдачи тут нет. Просто: Here you are."],["Here is you are.",0,null,"Правильно: Here you are."]]},
 e1:{n:"Then I'll give you an extra one for free!",ru:"Тогда добавлю вам ещё одну бесплатно!",end:"Яблоки, клубника и подарок от продавца — улыбка творит чудеса."},
 e2:{n:"Thanks! Come again!",ru:"Спасибо! Приходите ещё!",end:"Яблоки куплены — быстро и вежливо."}}},
{id:"room",l:"A2",t:"Проблема в номере",d:"Не работает кондиционер",start:"a",nodes:{
 a:{n:"Reception, how can I help you?",ru:"Ресепшен, чем могу помочь?",o:[["Hi, this is room 204. The air conditioning doesn't work.",1,"b"],["Hi, room 204. The air conditioning don't work.",0,null,"It (кондиционер) — doesn't: it doesn't work."],["Hi, I'm angry! Everything is bad!",0,"a1","Так не понять, что случилось. Скажи конкретно: The air conditioning doesn't work."]]},
 a1:{n:"I'm sorry to hear that. What exactly is the problem?",ru:"Мне жаль. А в чём именно проблема?",o:[["The air conditioning doesn't work, and it's very hot.",1,"b"],["Everything!",0,null,"Конкретнее: The air conditioning doesn't work."],["It's broken the air.",0,null,"Сломан — doesn't work или is broken: The air conditioning is broken."]]},
 b:{n:"I'm so sorry. I can send someone to fix it in thirty minutes, or move you to another room.",ru:"Прошу прощения. Могу прислать мастера через полчаса или переселить вас в другой номер.",o:[["I'd prefer another room, please.",1,"c1"],["Thirty minutes is fine. Thank you.",1,"c2"],["I prefer to move me.",0,null,"«Я бы предпочёл(ла)» — I'd prefer another room."]]},
 c1:{n:"Of course. Room 310 is ready. It has a sea view.",ru:"Конечно. Номер 310 готов. С видом на море.",o:[["Wonderful! Thank you so much.",1,"e1"],["Thanks. Who brings my bags?",0,"d","Вежливее попросить: Could someone help me with my bags?"],["Sea view? It's wonderfully!",0,null,"It's wonderful — нужно прилагательное."]]},
 d:{n:"Sorry? Oh, you'd like help with your bags?",ru:"Простите? А, вам помочь с сумками?",o:[["Yes, please. Could someone help me with my bags?",1,"e1"],["Yes. Bring.",0,null,"Вежливо: Could someone help me with my bags?"],["No.",0,null,"Попробуй: Yes, please. Could someone help me with my bags?"]]},
 c2:{n:"Great. And as an apology, breakfast tomorrow is free.",ru:"Отлично. А в качестве извинения завтрак завтра бесплатно.",o:[["That's very kind of you!",1,"e2"],["You're kind very.",0,null,"Порядок слов: That's very kind of you!"],["Free? Why?",0,null,"Это извинение. Ответь: That's very kind of you!"]]},
 e1:{n:"Enjoy your stay in room 310!",ru:"Приятного отдыха в номере 310!",end:"Вежливая жалоба — и номер с видом на море!"},
 e2:{n:"You're welcome. Have a good evening!",ru:"Пожалуйста. Хорошего вечера!",end:"Мастер всё починит, а завтрак — в подарок. Вежливая жалоба работает."}}},
{id:"train",l:"A2",t:"Поезд отменили",d:"Найти другой способ доехать",start:"a",nodes:{
 a:{n:"I'm afraid the 10:15 to Oxford is cancelled.",ru:"К сожалению, поезд 10:15 до Оксфорда отменён.",o:[["Oh no! When is the next train?",1,"b"],["Oh no! When the next train is?",0,null,"В вопросе is встаёт перед подлежащим: When is the next train?"],["Why you cancelled it?",0,"a1","Вопрос без did и звучит грубовато. Лучше узнать про следующий поезд."]]},
 a1:{n:"There's a problem with the line. I'm sorry.",ru:"Проблема на линии. Мне жаль.",o:[["I see. When is the next train?",1,"b"],["It's your problem.",0,null,"Сотрудник не виноват. Спроси: When is the next train?"],["OK. And now what?",0,null,"Спроси конкретно: When is the next train?"]]},
 b:{n:"The next one is at 11:40. Or you can take a bus at 10:30.",ru:"Следующий в 11:40. Или можно сесть на автобус в 10:30.",o:[["I'll take the bus. Where does it leave from?",1,"c1"],["I'll wait for the train.",1,"c2"],["I will taking the bus.",0,null,"После will — начальная форма: I'll take the bus."]]},
 c1:{n:"From the front of the station. Your train ticket is valid on the bus.",ru:"От входа в вокзал. Ваш билет на поезд действует и в автобусе.",o:[["Great, thanks for your help!",1,"e1"],["Really? That's great!",1,"e1"],["Thanks for your helping.",0,null,"Правильно: Thanks for your help."]]},
 c2:{n:"OK. There's a café on platform 2 if you'd like to wait there.",ru:"Хорошо. На второй платформе есть кафе, если хотите подождать там.",o:[["Perfect, I'll get a coffee.",1,"e2"],["Perfect, I get a coffee.",0,null,"Решение прямо сейчас — will: I'll get a coffee."],["Where is platform two is?",0,null,"Одного is достаточно: Where is platform two?"]]},
 e1:{n:"You're welcome. Have a good trip!",ru:"Пожалуйста. Хорошей поездки!",end:"Выход найден: в 10:30 ты уже едешь на автобусе."},
 e2:{n:"Enjoy your coffee!",ru:"Приятного кофе!",end:"Кофе, спокойствие и поезд в 11:40 — тоже отличный план."}}},
{id:"gym",l:"A2",t:"Записаться в спортзал",d:"Выбрать абонемент",start:"a",nodes:{
 a:{n:"Hi! Can I help you?",ru:"Здравствуйте! Чем помочь?",o:[["Hi! I'd like to join the gym.",1,"b"],["Hi! I want join the gym.",0,null,"После want нужен to: I want to join. Вежливее: I'd like to join the gym."],["Hi! I'd like to joy the gym.",0,null,"Записаться — join. Joy — это «радость»."]]},
 b:{n:"Great! We have two options: a monthly pass for forty pounds or a yearly pass for three hundred.",ru:"Отлично! Есть два варианта: абонемент на месяц за сорок фунтов или на год за триста.",o:[["Which one is cheaper per month?",1,"c"],["I'll take the monthly pass, please.",1,"d"],["Which one is more cheap?",0,null,"Cheap → cheaper: Which one is cheaper?"]]},
 c:{n:"The yearly one. It's twenty-five pounds a month.",ru:"Годовой. Получается двадцать пять фунтов в месяц.",o:[["Then I'll take the yearly pass.",1,"d"],["I'll take the monthly one anyway.",1,"d"],["Then I take yearly.",0,null,"Решение в момент речи — I'll take: Then I'll take the yearly pass."]]},
 d:{n:"Perfect. Do you have any injuries or health problems?",ru:"Отлично. Есть травмы или проблемы со здоровьем?",o:[["No, I don't. I'm fine.",1,"e"],["Sometimes my back hurts.",1,"d1"],["No, I'm not have.",0,null,"Отрицание с have: I don't have или коротко No, I don't."]]},
 d1:{n:"Thanks for telling me. Our trainer can show you some safe exercises.",ru:"Спасибо, что сказали. Тренер покажет вам безопасные упражнения.",o:[["That would be great, thank you.",1,"e"],["It would be greatly.",0,null,"Правильно: That would be great."],["No need, I'm very strong!",0,null,"Лучше принять помощь: That would be great, thank you."]]},
 e:{n:"Welcome to the club! See you tomorrow.",ru:"Добро пожаловать в клуб! До завтра.",end:"Абонемент оформлен. Завтра — первая тренировка!"}}},
{id:"cinema",l:"A2",t:"Билеты в кино",d:"Купить билеты, когда всё распродано",start:"a",nodes:{
 a:{n:"Hi, which film would you like to see?",ru:"Здравствуйте, на какой фильм хотите?",o:[["Two tickets for 'Space Cats' at seven, please.",1,"b"],["Two ticket for 'Space Cats', please.",0,null,"Два билета — two tickets, с -s."],["I'd like to look 'Space Cats'.",0,null,"Смотреть фильм — see или watch: I'd like to see 'Space Cats'."]]},
 b:{n:"Sorry, the seven o'clock show is sold out. There are seats at nine.",ru:"Извините, на семь всё распродано. Есть места на девять.",o:[["Nine is fine. Two tickets, please.",1,"c"],["What a pity! Is there anything else at seven?",1,"b1"],["Sold out? What does it mean?",0,"b2","Sold out — «всё распродано». Можно согласиться на другое время."]]},
 b2:{n:"It means there are no tickets left for seven.",ru:"Это значит, что на семь билетов не осталось.",o:[["Oh, I see. Then nine is fine.",1,"c"],["I see. I'll come tomorrow.",1,"e2"],["Then give for nine.",0,null,"Вежливо: Then nine is fine, please."]]},
 b1:{n:"Yes, a comedy — 'My Crazy Grandma'.",ru:"Да, комедия «Моя сумасшедшая бабушка».",o:[["Sounds fun! Two tickets for that, please.",1,"c"],["Sounds great! Two tickets, please.",1,"c"],["Sounds funnily!",0,null,"После sounds — прилагательное: Sounds fun!"]]},
 c:{n:"Would you like popcorn? Small or large?",ru:"Попкорн хотите? Маленький или большой?",o:[["Large, please — we're sharing.",1,"e1"],["No, thanks.",1,"e1"],["Yes, a big one popcorn.",0,null,"Проще: Large, please."]]},
 e1:{n:"Enjoy the film!",ru:"Приятного просмотра!",end:"Билеты куплены — вечер обещает быть отличным."},
 e2:{n:"OK, see you tomorrow!",ru:"Хорошо, до завтра!",end:"Тоже вариант: завтра будут билеты на любое время."}}},
{id:"allergy",l:"A2",t:"В аптеке: аллергия",d:"Объяснить симптомы и понять, как пить лекарство",start:"a",nodes:{
 a:{n:"Hello. What can I do for you?",ru:"Здравствуйте. Чем могу помочь?",o:[["I think I have an allergy. My eyes are red and itchy.",1,"b"],["I have allergic.",0,null,"Аллергия — an allergy: I have an allergy. Allergic — прилагательное: I'm allergic to cats."],["My eyes is red.",0,null,"Eyes — много, поэтому are: my eyes are red."]]},
 b:{n:"Are you allergic to anything?",ru:"У вас на что-то аллергия?",o:[["Yes, I'm allergic to cats. I visited a friend with a cat yesterday.",1,"c"],["I don't know.",1,"c"],["Yes, I'm allergic on cats.",0,null,"Аллергия на — allergic to: I'm allergic to cats."]]},
 c:{n:"I see. These tablets will help. Take one a day. They might make you sleepy.",ru:"Понятно. Эти таблетки помогут. По одной в день. От них может клонить в сон.",o:[["Can I drive after taking them?",1,"d"],["Sleepy? Then I'll take them at night.",1,"d2"],["Can I to drive after them?",0,null,"После can — без to: Can I drive?"]]},
 d:{n:"It's better not to drive after taking them.",ru:"Лучше не садиться за руль после них.",o:[["OK, I'll take them in the evening then.",1,"d2"],["OK, I won't drive.",1,"d2"],["OK, I won't driving.",0,null,"После won't — начальная форма: I won't drive."]]},
 d2:{n:"Good idea. That's six pounds.",ru:"Хорошая мысль. С вас шесть фунтов.",o:[["Here you are. Thanks for your help!",1,"e"],["Here you are. Thank you for help.",0,null,"Спасибо за помощь — Thanks for your help."],["Six? It's expensive very.",0,null,"Порядок: very expensive. Но лучше просто поблагодарить."]]},
 e:{n:"Feel better soon!",ru:"Поправляйтесь!",end:"Лекарство куплено, и понятно, как его принимать. Будь здоров(а)!"}}},
{id:"luggage",l:"A2",t:"Потерялся багаж",d:"Описать чемодан и договориться о доставке",start:"a",nodes:{
 a:{n:"Good afternoon. How can I help?",ru:"Добрый день. Чем помочь?",o:[["My suitcase didn't arrive. I was on the flight from Moscow.",1,"b"],["My suitcase don't arrive.",0,null,"В прошлом — didn't arrive."],["I lost. Help!",0,"a1","Непонятно, что потерялось. Скажи: My suitcase didn't arrive."]]},
 a1:{n:"Don't worry. What did you lose?",ru:"Не волнуйтесь. Что вы потеряли?",o:[["My suitcase. It didn't arrive.",1,"b"],["My suitcase lost me.",0,null,"Скажи: My suitcase didn't arrive или I lost my suitcase."],["All.",0,null,"Конкретнее: My suitcase didn't arrive."]]},
 b:{n:"I'm sorry. Can you describe it?",ru:"Сожалею. Можете его описать?",o:[["It's a big blue suitcase with a yellow ribbon.",1,"c"],["It's big and blue, with a yellow ribbon on the handle.",1,"c"],["It's blue big suitcase.",0,null,"Порядок прилагательных: a big blue suitcase. И нужен артикль a."]]},
 c:{n:"Thank you. It's probably still in Moscow. It'll be here tomorrow. Where are you staying?",ru:"Спасибо. Скорее всего, он ещё в Москве. Будет здесь завтра. Где вы остановились?",o:[["At the Park Hotel. Can you deliver it there?",1,"d"],["Tomorrow? But all my clothes are in it!",1,"c1"],["In the Park Hotel. Can you bring?",0,null,"В отеле — at the hotel. И нужно it: Can you bring it there?"]]},
 c1:{n:"I understand. You can buy some things you need, and we'll pay you back. Keep the receipts.",ru:"Понимаю. Купите необходимое, а мы компенсируем. Сохраните чеки.",o:[["Really? That's great. I'm staying at the Park Hotel.",1,"d"],["OK, I'll keep the receipts. I'm at the Park Hotel.",1,"d"],["I will keeping receipts.",0,null,"После will — начальная форма: I'll keep the receipts."]]},
 d:{n:"Of course. We'll bring it to the hotel tomorrow.",ru:"Конечно. Доставим в отель завтра.",o:[["Thank you so much!",1,"e"],["Thank you very much for your help!",1,"e"],["Thanks, you're welcome!",0,null,"You're welcome отвечают на спасибо. Тебе — просто Thank you!"]]},
 e:{n:"Here's your reference number. Have a nice stay!",ru:"Вот номер вашего обращения. Хорошего отдыха!",end:"Чемодан найдётся и приедет прямо в отель. Всё решено!"}}},
{id:"wrongdish",l:"A2",t:"Принесли не то блюдо",d:"Вежливо сказать, что заказ перепутали",start:"a",nodes:{
 a:{n:"Here's your steak!",ru:"Ваш стейк!",o:[["Excuse me, I think there's a mistake. I ordered the fish.",1,"b"],["It's not my! I didn't order it!",0,"a1","Так звучит резко. Вежливо: Excuse me, I think there's a mistake. I ordered the fish."],["Excuse me, I ordered fish not this.",0,null,"Лучше: Excuse me, I think there's a mistake. I ordered the fish."]]},
 a1:{n:"Oh! Sorry… What did you order?",ru:"Ой! Простите… А что вы заказывали?",o:[["The fish, please. No problem!",1,"b"],["Fish! Fish!",0,null,"Спокойнее: I ordered the fish."],["I order fish.",0,null,"В прошлом — ordered: I ordered the fish."]]},
 b:{n:"I'm so sorry! I'll bring the fish right away.",ru:"Простите! Сейчас принесу рыбу.",o:[["No problem, thank you.",1,"c"],["It's OK. How long will it take?",1,"c"],["No problems.",0,null,"Устойчивая фраза: No problem."]]},
 c:{n:"About ten minutes. Would you like some free bread while you wait?",ru:"Минут десять. Хотите бесплатного хлеба, пока ждёте?",o:[["Yes, please, that would be lovely.",1,"e1"],["No, thanks. I'm fine.",1,"e2"],["Yes, please, it would be lovely bread.",0,null,"Проще: Yes, please, that would be lovely."]]},
 e1:{n:"Here you are. And dessert is on us today.",ru:"Пожалуйста. А десерт сегодня за наш счёт.",end:"Спокойный тон — и вместо проблемы бесплатный десерт!"},
 e2:{n:"Of course. Your fish will be here soon.",ru:"Конечно. Рыба скоро будет.",end:"Путаницу исправили быстро: всё было сказано вежливо и чётко."}}},
{id:"gift",l:"A2",t:"Подарок другу",d:"Выбрать подарок в магазине",start:"a",nodes:{
 a:{n:"Hello! Are you looking for anything special?",ru:"Здравствуйте! Ищете что-то особенное?",o:[["Yes, I'm looking for a present for my friend.",1,"b"],["Yes, I search a present.",0,null,"Искать — look for: I'm looking for a present."],["Yes, a presence for my friend.",0,null,"Подарок — present или gift. Presence — «присутствие»."]]},
 b:{n:"What does your friend like?",ru:"Что любит ваш друг?",o:[["She likes reading and cooking.",1,"c1"],["He's into music and games.",1,"c2"],["She like reading.",0,null,"С she — likes, с -s."]]},
 c1:{n:"How about this cookbook? It's very popular.",ru:"Как насчёт этой кулинарной книги? Она очень популярна.",o:[["Perfect! Can you wrap it, please?",1,"d"],["How much does it cost?",1,"c3"],["How much it costs?",0,null,"В вопросе нужен does: How much does it cost?"]]},
 c2:{n:"How about these headphones? They're on sale.",ru:"Как насчёт этих наушников? На них скидка.",o:[["Great! Can you wrap them, please?",1,"d"],["How much do they cost?",1,"c3"],["Can you wrap it?",0,null,"Headphones — они, значит them: Can you wrap them?"]]},
 c3:{n:"Twenty-five pounds.",ru:"Двадцать пять фунтов.",o:[["OK, I'll take it. Can you wrap it, please?",1,"d"],["That's a bit expensive. Do you have anything cheaper?",1,"e2"],["It's too much expensive.",0,null,"Слишком дорого — too expensive, без much."]]},
 d:{n:"Of course! Would you like a card too?",ru:"Конечно! Открытку тоже хотите?",o:[["Yes, please. I'll write a few words.",1,"e1"],["No, thank you.",1,"e1"],["Yes, I'll writing.",0,null,"После I'll — начальная форма: I'll write."]]},
 e1:{n:"Here you are. I'm sure your friend will love it!",ru:"Вот, пожалуйста. Уверена, вашему другу понравится!",end:"Подарок упакован — день рождения удастся!"},
 e2:{n:"Sure, this notebook is ten pounds.",ru:"Конечно, этот блокнот стоит десять фунтов.",end:"Подарок по бюджету найден. Спросить «есть ли дешевле» — совершенно нормально."}}},
{id:"interview",l:"B1",t:"Собеседование",d:"Рассказать о себе и задать вопросы",start:"a",nodes:{
 a:{n:"Thanks for coming. Could you tell me a bit about yourself?",ru:"Спасибо, что пришли. Расскажете немного о себе?",o:[["Sure. I'm a graphic designer, and I've worked in advertising for four years.",1,"b"],["Sure. I work as designer since four years.",0,null,"До сих пор — Present Perfect с for: I've worked… for four years. И a designer."],["I was born in 1998. My mother is a teacher…",0,"a1","Начни с работы и опыта, а не с детства."]]},
 a1:{n:"Ha-ha, maybe a little more about your work?",ru:"Ха-ха, может, чуть больше о работе?",o:[["Of course! I've worked as a designer for four years.",1,"b"],["My work is good.",0,null,"Конкретнее: I've worked as a designer for four years."],["I always work very hard.",0,null,"Расскажи про опыт: I've worked as a designer for four years."]]},
 b:{n:"Why do you want to work for us?",ru:"Почему вы хотите работать у нас?",o:[["I really like your projects, and I'd like to work with a bigger team.",1,"c"],["I'd like to grow and learn new things.",1,"c"],["Because you pay more.",0,"b1","Честно, но начинать с этого не стоит. Расскажи, чем нравится компания."]]},
 b1:{n:"Well… is that the only reason?",ru:"Хм… и это единственная причина?",o:[["Not at all! I also love your projects and want to learn from your team.",1,"c"],["Yes.",0,null,"Добавь что-то о компании: I also love your projects."],["Money is important, no?",0,null,"Лучше: I also love your projects and want to learn from your team."]]},
 c:{n:"What's your biggest weakness?",ru:"Ваша главная слабая сторона?",o:[["Sometimes I spend too much time on details, but I'm learning to plan better.",1,"d"],["I'm a bit of a perfectionist, but I'm working on it.",1,"d"],["I don't have any weaknesses.",0,null,"Так говорить рискованно. Назови слабость и расскажи, как с ней справляешься."]]},
 d:{n:"Do you have any questions for us?",ru:"У вас есть вопросы к нам?",o:[["Yes. What would a typical day look like?",1,"e"],["Yes. What are the next steps?",1,"e"],["No.",0,null,"Лучше задать вопрос — это показывает интерес. Например: What would a typical day look like?"]]},
 e:{n:"Great question. We'll be in touch by Friday.",ru:"Отличный вопрос. Мы свяжемся с вами до пятницы.",end:"Собеседование прошло уверенно — ждём ответа до пятницы!"}}},

function yPick(kind){const a=YW[kind];let x;do{x=a[Math.floor(Math.random()*a.length)]}while(a.length>1&&x===YW.last[kind]);YW.last[kind]=x;return x}
function yName(s){const nm=uname();return nm&&Math.random()<.25?nm+", "+s.charAt(0).toLowerCase()+s.slice(1):s}
function yasWrong(expl){const k=YW.run>=3?"run3":YW.run===2?"run2":"wrong";return yName(yPick(k))+" "+(expl||yPick("tail"))}

function qSeed(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}}

/* ---------- анонимный вход ---------- */
let fbTok=null,fbAuthP=null;
function fbAuth(){
  const a=fbTok||lsGet(FB.AUTH);
  if(a&&a.id&&a.exp>Date.now()+60e3)return Promise.resolve(a.id);
  return fbAuthP||(fbAuthP=(async()=>{
    if(a&&a.rt){
      try{const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.key,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.rt)});
        if(r.ok){const d=await r.json();fbTok={id:d.id_token,rt:d.refresh_token,exp:Date.now()+(+d.expires_in||3600)*1000};lsSet(FB.AUTH,fbTok);return fbTok.id}}catch(e){}
    }
    const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB.key,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok)throw new Error("auth "+r.status);
    const d=await r.json();fbTok={id:d.idToken,rt:d.refreshToken,exp:Date.now()+(+d.expiresIn||3600)*1000};lsSet(FB.AUTH,fbTok);return fbTok.id;
  })().finally(()=>{fbAuthP=null}));
}

/* ---------- Firestore REST ---------- */
function fbEnc(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==="string")return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(fbEnc)}};
  if(v.__b!==undefined)return{bytesValue:v.__b};
  return{mapValue:{fields:fbFields(v)}};
}
function fbFields(o){const f={};for(const k in o)if(o[k]!==undefined)f[k]=fbEnc(o[k]);return f}
function fbDec(x){
  if("stringValue" in x)return x.stringValue;if("integerValue" in x)return +x.integerValue;if("doubleValue" in x)return x.doubleValue;
  if("booleanValue" in x)return x.booleanValue;if("bytesValue" in x)return{__b:x.bytesValue};
  if("arrayValue" in x)return(x.arrayValue.values||[]).map(fbDec);if("mapValue" in x)return fbObj(x.mapValue.fields);return null;
}
function fbObj(f){const o={};for(const k in f||{})o[k]=fbDec(f[k]);return o}
async function fbReq(method,path,body,query){
  for(let i=0;;i++){
    const tok=await fbAuth();
    const r=await fetch(FB_BASE+path+(query||""),{method,headers:Object.assign({Authorization:"Bearer "+tok},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined});
    if(r.status===404&&method==="GET")return null;
    if(r.ok)return r.json();
    if(i<2&&(r.status===401||r.status===409||r.status>=500)){if(r.status===401){fbTok=null;lsSet(FB.AUTH,null)}await new Promise(res=>setTimeout(res,400*(i+1)));continue}
    throw new Error("firestore "+r.status);
  }
}
async function fbGet(p){const d=await fbReq("GET",p);return d?fbObj(d.fields):null}
async function fbSet(p,o){await fbReq("PATCH",p,{fields:fbFields(o)})}
async function fbDel(p){try{await fbReq("DELETE",p)}catch(e){}}
async function fbList(p){const d=await fbReq("GET",p,null,"?pageSize=50");return((d&&d.documents)||[]).map(x=>Object.assign(fbObj(x.fields),{_id:x.name.split("/").pop()}))}

/* ---------- упаковка состояния (gzip + base64, чтобы влезть в лимит документа 1 МБ) ---------- */
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function packState(obj){
  const j=JSON.stringify(obj);let out={s:j},size=j.length*2;
  if(window.CompressionStream){try{const u=new Uint8Array(await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());out={z:{__b:b64(u)}};size=u.length}catch(e){}}
  if(size>1000000)throw new Error("too big");
  return out;
}
async function unpackState(d){
  if(!d)return null;
  if(typeof d.s==="string")return JSON.parse(d.s);
  if(d.z&&d.z.__b)return JSON.parse(await new Response(new Blob([unb64(d.z.__b)]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return null;
}
function okState(x){return !!(x&&typeof x==="object"&&x.cards&&typeof x.cards==="object")}
// слить пришедшее состояние с текущим (как при вставке длинного кода)
function takeRemote(remote){
  if(!okState(remote))return false;
  const before=JSON.stringify(S),fresh=!S.totalAns&&!S.onboarded&&!Object.keys(S.cards||{}).length;
  S=fresh?Object.assign(JSON.parse(JSON.stringify(DEF)),remote):mergeState(S,remote);
  save();CS=null;TS=null;LS=null;
  if(S.onboarded&&location.hash==="#hello")location.hash="#today";
  return JSON.stringify(S)!==before;

/* ---------- ПЕРЕНОС ПО КОРОТКОМУ КОДУ ---------- */
// A: transfer/{6 символов} = {k:"state", exp, z}; B вводит код, сливает, пишет обратно {k:"back"} —
// A ждёт ответ и тоже сливает. В итоге прогресс одинаковый на обоих устройствах.
const XS={code:"",exp:0,open:false,busy:false,msg:"",poll:null};
function xsRerender(){if((location.hash||"").slice(1)==="settings")viewSettings()}
function xsStop(){clearInterval(XS.poll);XS.poll=null}
async function xsGet(){
  XS.busy=true;XS.msg="";XS.open=false;xsRerender();
  try{
    if(XS.code)fbDel("transfer/"+XS.code);
    const code=rndCode(6),exp=Date.now()+15*60e3;
    await fbSet("transfer/"+code,Object.assign({k:"state",exp},await packState(S)));
    XS.code=code;XS.exp=exp;xsStop();XS.poll=setInterval(xsCheckBack,3000);
  }catch(e){XS.msg=String(e&&e.message)==="too big"?"Прогресс слишком большой для короткого кода — воспользуйся длинным кодом ниже.":netMsg()}
  XS.busy=false;xsRerender();
}
async function xsCheckBack(){
  if(!XS.code)return xsStop();
  if(Date.now()>XS.exp){fbDel("transfer/"+XS.code);XS.code="";XS.msg="Срок кода истёк. Если нужно, получи новый.";xsStop();xsRerender();return}
  if(document.hidden)return;
  try{const d=await fbGet("transfer/"+XS.code);
    if(d&&d.k==="back"){xsStop();const code=XS.code;XS.code="";takeRemote(await unpackState(d));fbDel("transfer/"+code);chips();
      XS.msg="Готово: прогресс с другого устройства объединён. Теперь он одинаковый на обоих.";toast("Прогресс объединён");xsRerender();try{softRefresh()}catch(e){}}
  }catch(e){}
}
async function xsGo(raw){
  const code=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==6){XS.msg="В коде 6 символов — проверь, всё ли введено.";xsRerender();return}
  if(code===XS.code){XS.msg="Это код с этого же устройства. Введи его на другом.";xsRerender();return}
  XS.busy=true;XS.msg="";xsRerender();
  try{
    const d=await fbGet("transfer/"+code);
    if(!d||d.k!=="state")XS.msg="Код не найден. Проверь буквы или получи новый.";
    else if(d.exp<Date.now()){XS.msg="Срок кода истёк. Получи новый на другом устройстве.";fbDel("transfer/"+code)}
    else{
      const remote=await unpackState(d);if(!okState(remote))throw new Error("bad");

      XS.open=false;XS.msg="Готово: прогресс объединён. На другом устройстве он обновится сам через пару секунд.";toast("Прогресс перенесён");
    }
  }catch(e){XS.msg=netMsg()}
  XS.busy=false;xsRerender();
}

function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v)}

function tgCloud(){const tg=window.Telegram&&window.Telegram.WebApp;return window.__TG&&tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")?tg.CloudStorage:null}
function tgCloudGet(k){const c=tgCloud();return c?new Promise(res=>c.getItem(k,(e,v)=>res(e?null:v||null))):Promise.resolve(null)}
function tgCloudSet(k,v){const c=tgCloud();return c?new Promise(res=>c.setItem(k,v,()=>res())):Promise.resolve()}

// rooms/{код пары}/members/{pid}: n — имя, pts — очки недели, wk — неделя, st — серия, kw — выучено слов,
// h — очки по неделям (JSON), since — неделя вступления, ch — вызов (у автора), cp — прогресс вызова.
const PTS_RULE="+1 за верный ответ, +2 за новое слово, +10 за урок, +20 за все задания дня";
function wkKey(t){return dkey(weekStart(t)+3*3600e3)}
function bonusIn(from,to){let b=0;for(const k in S.days){const t=new Date(k+"T12:00:00").getTime();if(t>=from&&t<to)b+=S.days[k].bonus||0}return b}
function weekPts(from){const a=weekStats(from);return a.ok+2*a.words+10*a.lessons+bonusIn(from,from+7*DAY)}
function allPts(){let ok=0;for(const k in S.days)ok+=(S.days[k].ok||0)+(S.days[k].bonus||0);return ok+2*Object.keys(S.cards||{}).length+10*(Object.keys(S.lessons||{}).length+Object.values(S.course||{}).filter(Boolean).length)}
function ptsHist(){const h={},ws=weekStart();for(let i=1;i<=8;i++){const f=ws-i*7*DAY,p=weekPts(f);if(p)h[wkKey(f)]=p}return h}
const DU={members:[],at:0,err:false,busy:false,timer:null,poll:null,lastDoc:"",msg:"",confirm:false};
function duelDoc(){
  const c=S.comp,ws=weekStart();
  return{n:uname()||"Ученик",pts:weekPts(ws),wk:wkKey(ws),st:streak(),kw:knownCount(),h:JSON.stringify(ptsHist()),since:c.since||wkKey(ws),
    ch:c.ch?JSON.stringify(c.ch):"",cp:c.cp?JSON.stringify({id:c.cp.id,p:Math.max(0,allPts()-c.cp.base),done:c.cp.done||0}):""};

function pj(s){try{return s?JSON.parse(s):null}catch(e){return null}}
function duelChallenge(){let best=null;for(const m of DU.members){const c=pj(m.ch);if(c&&c.id&&(!best||c.at>best.at))best=c}return best}
async function duelSync(){
  if(!FB.on||!S.comp||DU.busy)return;DU.busy=true;
  try{
    const c=S.comp,path=`rooms/${c.room}/members/`;
    let list=await fbList(path);DU.members=list;
    // вызов: подхватываем самый свежий и запоминаем свою стартовую точку
    const ch=duelChallenge();
    if(ch&&(!c.cp||c.cp.id!==ch.id)){c.cp={id:ch.id,base:allPts(),done:0};save()}
    if(ch&&c.cp&&c.cp.id===ch.id&&!c.cp.done&&allPts()-c.cp.base>=ch.goal){c.cp.done=Date.now();save()}
    const doc=duelDoc(),j=JSON.stringify(doc);

      const me=Object.assign({_id:c.pid,at:Date.now()},doc);DU.members=list.filter(m=>m._id!==c.pid).concat(me)}

function duelSchedule(){if(!FB.on||!S.comp)return;clearTimeout(DU.timer);DU.timer=setTimeout(duelSync,20000)}
// победы по прошлым неделям (только с недели, когда оба уже были в паре)
function duelWins(){
  const ms=DU.members,wins={},run={};ms.forEach(m=>{wins[m._id]=0;run[m._id]=0});
  if(ms.length<2)return{wins,run,last:null};
  const since=ms.map(m=>m.since||"").sort().pop(),hs=ms.map(m=>[m._id,pj(m.h)||{}]),ws=weekStart();
  let last=null;
  for(let i=8;i>=1;i--){const k=wkKey(ws-i*7*DAY);if(k<since)continue;
    const sc=hs.map(([id,h])=>[id,h[k]||0]).sort((a,b)=>b[1]-a[1]);
    if(!sc[0][1]||sc[0][1]===sc[1][1]){ms.forEach(m=>run[m._id]=0);if(i===1)last={k,tie:true,sc};continue}
    wins[sc[0][0]]++;ms.forEach(m=>run[m._id]=m._id===sc[0][0]?run[m._id]+1:0);if(i===1)last={k,win:sc[0][0],sc};
  }
  return{wins,run,last};
}
