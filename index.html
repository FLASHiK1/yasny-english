ела? (разговорное)","/haʊz ɪt ˈɡəʊɪŋ/","Hi Tom! How's it going?","Привет, Том! Как дела?","A2"],["Not bad","неплохо","/nɒt bæd/","Not bad, thanks. And you?","Неплохо, спасибо. А у тебя?","A1"],["What do you do?","чем ты занимаешься? (о работе)","/wɒt duː juː duː/","So, what do you do?","Так чем ты занимаешься?","A1"],["by the way","кстати","/baɪ ðə weɪ/","By the way, have you seen the new film?","Кстати, ты видел новый фильм?","A2"],["Really?","правда?","/ˈrɪəli/","Really? That's amazing!","Правда? Это потрясающе!","A1"],["That sounds great","звучит здорово","/ðæt saʊndz ɡreɪt/","A trip to Italy? That sounds great!","Поездка в Италию? Звучит здорово!","A2"],["I see","понятно","/aɪ siː/","I see. And how long have you worked there?","Понятно. А сколько ты там работаешь?","A2"],["Anyway","в общем, ладно","/ˈeniweɪ/","Anyway, I have to go now.","В общем, мне пора.","A2"],["Nice talking to you","приятно было поговорить","/naɪs ˈtɔːkɪŋ tə juː/","I have to go. Nice talking to you!","Мне пора. Приятно было поговорить!","A2"],["Take care","береги себя, пока","/teɪk keə/","See you soon. Take care!","До скорого. Береги себя!","A2"],["What about you?","а ты?","/wɒt əˈbaʊt juː/","I love hiking. What about you?","Я люблю походы. А ты?","A1"],["It depends","смотря как, по-разному","/ɪt dɪˈpendz/","Do you like big cities? — It depends.","Ты любишь большие города? — По-разному.","A2"]],"lessons":[{"id":"pk-smalltalk","lvl":"A2","title":"Small talk: поддержать разговор","desc":"Вопросы-эхо, реакции и вежливое завершение","theory":"<p>В английском разговор поддерживают короткими <b>реакциями<\/b> и <b>встречными вопросами<\/b>. Молчание или ответ одним словом звучит холодно.<\/p><ul><li>Реакции: <i>Really? That sounds great! I see. Oh no!<\/i><\/li><li>Встречный вопрос: <i>What about you? And you?<\/i><\/li><li>Вопросы-эхо: <i>I live in Spain. — Oh, do you?<\/i> (повторяем вспомогательный глагол)<\/li><li>Завершить: <i>Anyway, I have to go. Nice talking to you!<\/i><\/li><\/ul>","ex":[{"type":"choice","q":"— I've just come back from Japan. — ___","o":["Really? How was it?","Yes.","I know."],"a":"Really? How was it?","why":"Реакция + вопрос поддерживают разговор."},{"type":"choice","q":"— I work in a bank. — Oh, ___ you?","o":["do","are","have"],"a":"do","why":"Эхо-вопрос повторяет вспомогательный глагол: I work → do you?"},{"type":"choice","q":"— I'm going to Paris next week. — Oh, ___ you?","o":["are","do","will"],"a":"are","why":"I'm going → are you?"},{"type":"choice","q":"Как вежливо закончить разговор?","o":["Anyway, I have to go. Nice talking to you!","Bye. I go.","Stop talking, please."],"a":"Anyway, I have to go. Nice talking to you!","why":"Anyway + причина + Nice talking to you — вежливо."},{"type":"choice","q":"— I love hiking. ___","o":["What about you?","What you?","And what?"],"a":"What about you?","why":"What about you? — «А ты?»"},{"type":"choice","q":"— How's it going? — ___","o":["Not bad, thanks. And you?","I'm going home.","It goes."],"a":"Not bad, thanks. And you?","why":"How's it going? — «Как дела?», а не «куда идёшь»."}]}],"texts":[{"title":"Meeting a neighbour","l":"A2","text":"Hi! You're the new neighbour, right? I'm Mike from number twelve. — Oh, hi Mike! Yes, I'm Olga. We moved in last week. — Nice to meet you, Olga. How do you like the area? — It's great. It's quiet, and the park is really close. — Oh, do you run? I run there every morning. — Really? I've just started running! — Great, we can run together sometime. Anyway, I have to go to work. Nice talking to you! — You too. Take care!","q":[{"q":"Когда Ольга переехала?","o":["На прошлой неделе","Вчера","Месяц назад"],"a":"На прошлой неделе"},{"q":"Что Ольге нравится в районе?","o":["Тишина и парк рядом","Магазины","Много кафе"],"a":"Тишина и парк рядом"},{"q":"Что предлагает Майк?","o":["Бегать вместе","Пойти в кафе","Помочь с переездом"],"a":"Бегать вместе"}]}],"id":"small-talk","title":"Small talk: как поддержать разговор","level":"A2"},"shopping":{"words":[["cash","наличные","/kæʃ/","Can I pay in cash?","Можно оплатить наличными?","A2"],["card","карта (банковская)","/kɑːd/","I'll pay by card.","Я заплачу картой.","A1"],["keep the change","сдачи не надо","/kiːp ðə tʃeɪndʒ/","Here you are. Keep the change!","Вот, сдачи не надо!","A2"],["discount","скидка","/ˈdɪskaʊnt/","Is there a discount for students?","Есть скидка для студентов?","A2"],["on sale","со скидкой","/ɒn seɪl/","These shoes are on sale.","Эти туфли со скидкой.","A2"],["size","размер","/saɪz/","What size are you?","Какой у вас размер?","A1"],["try on","примерить","/traɪ ɒn/","Can I try on this jacket?","Можно примерить эту куртку?","A2"],["fitting room","примерочная","/ˈfɪtɪŋ ruːm/","Where is the fitting room?","Где примерочная?","A2"],["refund","возврат денег","/ˈriːfʌnd/","I'd like a refund, please.","Я бы хотел вернуть деньги.","B1"],["queue","очередь","/kjuː/","There's a long queue at the checkout.","На кассе длинная очередь.","A2"],["checkout","касса","/ˈtʃekaʊt/","Please pay at the checkout.","Оплатите на кассе, пожалуйста.","A2"],["bargain","выгодная покупка","/ˈbɑːɡən/","This coat was a real bargain!","Это пальто — настоящая находка!","B1"],["save up","копить","/seɪv ʌp/","I'm saving up for a new laptop.","Я коплю на новый ноутбук.","B1"]],"texts":[{"title":"In a clothes shop","l":"A2","text":"Excuse me, can I try on this jacket? — Of course. What size are you? — Medium, I think. — Here you are. The fitting room is over there. … How is it? — It's a bit small. Do you have it in large? — Yes, here's a large one. And good news: it's on sale today, thirty percent off. — Great! I'll take it. Can I pay by card? — Sure. Would you like a bag? — No, thanks. I have one.","q":[{"q":"Какой размер подошёл покупателю?","o":["Большой (large)","Средний (medium)","Маленький (small)"],"a":"Большой (large)"},{"q":"Какая скидка на куртку?","o":["30%","50%","Скидки нет"],"a":"30%"},{"q":"Как покупатель платит?","o":["Картой","Наличными","Не платит"],"a":"Картой"}]}],"id":"shopping","title":"Покупки и деньги","level":"A2"},"tech":{"words":[["download","скачать","/ˌdaʊnˈləʊd/","Download the app for free.","Скачай приложение бесплатно.","A2"],["upload","загрузить (в сеть)","/ˌʌpˈləʊd/","I uploaded the photos yesterday.","Я загрузил фото вчера.","A2"],["password","пароль","/ˈpɑːswɜːd/","Never share your password.","Никому не сообщай свой пароль.","A2"],["log in","войти (в аккаунт)","/lɒɡ ɪn/","I can't log in to my account.","Не могу войти в аккаунт.","A2"],["sign up","зарегистрироваться","/saɪn ʌp/","Sign up with your email.","Зарегистрируйся по почте.","A2"],["screen","экран","/skriːn/","My phone screen is broken.","У меня разбит экран телефона.","A2"],["battery","аккумулятор","/ˈbætəri/","My battery is almost dead.","У меня почти сел аккумулятор.","A2"],["charge","заряжать","/tʃɑːdʒ/","I need to charge my phone.","Мне нужно зарядить телефон.","A2"],["settings","настройки","/ˈsetɪŋz/","Check your privacy settings.","Проверь настройки конфиденциальности.","B1"],["app","приложение","/æp/","This app helps me learn English.","Это приложение помогает мне учить английский.","A2"],["crash","вылетать (о программе)","/kræʃ/","The game keeps crashing.","Игра постоянно вылетает.","B1"],["notification","уведомление","/ˌnəʊtɪfɪˈkeɪʃn/","Turn off notifications at night.","Выключай уведомления на ночь.","B1"],["scroll","листать (ленту)","/skrəʊl/","I scroll social media too much.","Я слишком много листаю соцсети.","B1"],["online","онлайн, в сети","/ˌɒnˈlaɪn/","I buy most things online.","Почти всё я покупаю онлайн.","A2"]],"id":"tech","title":"Технологии и интернет","level":"B1"},"interview":{"words":[["CV","резюме","/ˌsiː ˈviː/","Please send us your CV.","Пришлите, пожалуйста, ваше резюме.","B1"],["apply for","подавать заявку на","/əˈplaɪ fɔː/","I'm applying for a job in marketing.","Я подаю заявку на работу в маркетинге.","B1"],["position","должность","/pəˈzɪʃn/","Why are you interested in this position?","Почему вас интересует эта должность?","B1"],["strengths","сильные стороны","/streŋθs/","What are your main strengths?","Каковы ваши главные сильные стороны?","B1"],["weaknesses","слабые стороны","/ˈwiːknəsɪz/","Tell me about your weaknesses.","Расскажите о своих слабых сторонах.","B1"],["be responsible for","отвечать за","/biː rɪˈspɒnsəbl fɔː/","I was responsible for a team of five.","Я отвечал за команду из пяти человек.","B1"],["achievement","достижение","/əˈtʃiːvmənt/","What's your biggest achievement?","Какое ваше самое большое достижение?","B1"],["work under pressure","работать в условиях стресса","/wɜːk ˈʌndə ˈpreʃə/","I can work under pressure.","Я умею работать под давлением.","B1"],["team player","человек, умеющий работать в команде","/tiːm ˈpleɪə/","I'm a real team player.","Я хорошо работаю в команде.","B1"],["notice period","срок отработки при увольнении","/ˈnəʊtɪs ˈpɪəriəd/","My notice period is one month.","Мне нужно отработать месяц.","B2"],["benefits","льготы, соцпакет","/ˈbenɪfɪts/","What benefits does the company offer?","Какой соцпакет предлагает компания?","B1"],["full-time","полный рабочий день","/ˌfʊl ˈtaɪm/","Is it a full-time job?","Это работа на полный день?","A2"],["part-time","неполный рабочий день","/ˌpɑːt ˈtaɪm/","I work part-time.","Я работаю на полставки.","A2"]],"texts":[{"title":"The interview","l":"B1","text":"So, tell me about yourself. — I've been working as a project manager for four years. In my current job I'm responsible for a team of six people. — Why are you applying for this position? — I'd like to work on bigger international projects, and your company is known for them. — What would you say is your main strength? — I'm well organised and I can work under pressure. Last year our team delivered a big project two weeks early. — And your weaknesses? — Sometimes I try to do everything myself, but I'm learning to delegate more. — Great. What's your notice period? — One month.","q":[{"q":"Сколько лет кандидат работает менеджером проектов?","o":["Четыре года","Шесть лет","Один год"],"a":"Четыре года"},{"q":"Почему он хочет в эту компанию?","o":["Хочет работать над крупными международными проектами","Там больше платят","Офис ближе к дому"],"a":"Хочет работать над крупными международными проектами"},{"q":"Какую слабость он называет?","o":["Старается всё делать сам","Опаздывает","Плохо работает в стрессе"],"a":"Старается всё делать сам"}]}],"id":"interview","title":"Собеседование на работу","level":"B1"},"business":{"words":[["I hope this email finds you well","надеюсь, у вас всё хорошо (начало письма)","/aɪ həʊp ðɪs ˈiːmeɪl faɪndz juː wel/","Hi Tom, I hope this email finds you well.","Привет, Том, надеюсь, у тебя всё хорошо.","B1"],["I'm writing to","пишу, чтобы…","/aɪm ˈraɪtɪŋ tə/","I'm writing to confirm our meeting.","Пишу, чтобы подтвердить нашу встречу.","B1"],["Please find attached","во вложении","/pliːz faɪnd əˈtætʃt/","Please find attached the report.","Отчёт во вложении.","B1"],["Let me know","дайте знать","/let miː nəʊ/","Let me know if you have any questions.","Дайте знать, если будут вопросы.","A2"],["at your earliest convenience","как только сможете","/ət jɔːr ˈɜːliɪst kənˈviːniəns/","Please reply at your earliest convenience.","Пожалуйста, ответьте, как только сможете.","B2"],["Best regards","с уважением (в конце письма)","/best rɪˈɡɑːdz/","Best regards, Anna","С уважением, Анна","A2"],["agenda","повестка","/əˈdʒendə/","Let's look at the agenda.","Давайте посмотрим повестку.","B1"],["to schedule a meeting","назначить встречу","/tə ˈʃedjuːl ə ˈmiːtɪŋ/","Can we schedule a meeting for Monday?","Можем назначить встречу на понедельник?","B1"],["to postpone","перенести (на позже)","/tə pəˈspəʊn/","We need to postpone the call.","Нам нужно перенести созвон.","B1"],["Can you hear me?","вы меня слышите?","/kæn juː hɪə miː/","Sorry, can you hear me now?","Извините, теперь меня слышно?","A2"],["You're on mute","у вас выключен микрофон","/jɔːr ɒn mjuːt/","Tom, I think you're on mute.","Том, кажется, у тебя выключен микрофон.","B1"],["to sum up","подводя итог","/tə sʌm ʌp/","To sum up, we need two more weeks.","Подводя итог: нам нужно ещё две недели.","B1"],["action items","задачи по итогам встречи","/ˈækʃn ˈaɪtəmz/","I'll send the action items after the call.","Я пришлю задачи после созвона.","B2"],["to be on the same page","одинаково понимать ситуацию","/tə biː ɒn ðə seɪm peɪdʒ/","Let's make sure we're on the same page.","Давайте убедимся, что мы понимаем друг друга.","B2"]],"texts":[{"title":"An email to a colleague","l":"B1","text":"Hi Sarah, I hope this email finds you well. I'm writing to confirm our meeting with the client on Thursday at 10 a.m. Please find attached the latest version of the presentation. Unfortunately, Mark can't join us, so we may need to postpone the second part of the discussion until next week. Could you please check the agenda and let me know if anything is missing? I'd also appreciate it if you could prepare a short summary of the budget. Thanks in advance. Best regards, Dmitry","q":[{"q":"Зачем Дмитрий пишет письмо?","o":["Подтвердить встречу с клиентом","Отменить проект","Попросить отпуск"],"a":"Подтвердить встречу с клиентом"},{"q":"Что приложено к письму?","o":["Презентация","Договор","Счёт"],"a":"Презентация"},{"q":"О чём Дмитрий просит Сару?","o":["Проверить повестку и подготовить сводку бюджета","Позвонить клиенту","Забронировать переговорную"],"a":"Проверить повестку и подготовить сводку бюджета"}]}],"id":"business","title":"Деловой английский: письма и встречи","level":"B1"},"grammar-plus":{"lessons":[{"id":"pk-ppc","lvl":"B1","title":"Present Perfect Continuous","desc":"Давно и до сих пор: have been + -ing","theory":"<p><b>have / has been + глагол с -ing<\/b> — действие началось в прошлом и <b>продолжается до сих пор<\/b> или только что закончилось, и виден результат.<\/p><ul><li><span class=\"ex\">I've been waiting for an hour!<\/span> — Я жду уже час!<\/li><li><span class=\"ex\">She's tired because she's been running.<\/span> — она бегала, поэтому устала. const COMBO_MSG={3:"Три подряд — отличная серия!",5:"Пять подряд! Ты в ударе.",10:"Десять подряд! Это уже уверенное знание.",20:"Двадцать подряд! Я горжусь тобой."};

  V.querySelectorAll(".card .verdict:not([data-ya])").forEach(v=>{

    const wh=[...card.querySelectorAll(".why,.note")].find(e=>e.children.length===0&&e.textContent.trim());

    const nm=uname();let mood,msg;

      msg=p+(expl?" "+expl:"");
    }else if(state==="warn"){mood="happy";msg="Почти! Смысл верный, проверь написание."+(expl?" "+expl:"")}
    else{mood="think";msg=pick(WRONG_OPEN)+" "+(expl||"Запомни правильный вариант и скажи его вслух пару раз. Это задание вернётся к тебе в «Ошибках» — в следующий раз получится.")}

  if(S.settings.sound===false)return;
  try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();const t=ACX.currentTime;
    (ok?[660,990]:[330,247]).forEach((f,i)=>{const o=ACX.createOscillator(),g=ACX.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
      const s0=t+i*0.09;g.gain.setValueAtTime(0.0001,s0);g.gain.exponentialRampToValueAtTime(0.09,s0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s0+0.17);
      o.connect(g);g.connect(ACX.destination);o.start(s0);o.stop(s0+0.2)})}catch(e){}
}

      <div style="min-width:0;flex:1"><div class="row" style="justify-content:space-between"><b>${n>=goal?"Цель дня выполнена":"Цель дня"}</b><span class="chip">Серия: ${st} ${plural(st,["день","дня","дней"])}</span></div>

    ${S.freezeNote===dkey(Date.now()-DAY)?yasay("happy","Вчера ты пропустил день, но я сохранил твою серию заморозкой. Их дают за каждые 7 дней подряд.",56):""}
    ${S.level?levelPanel():""}
    <section><div class="label" style="margin:4px 0 8px">Ещё на сегодня</div><div class="morelist">${more.slice(0,5).map(([h,t,d,rid])=>`<a class="morei" href="${h}"${rid?` data-rule-open="${rid}"`:""}><b>${esc(t)}</b><span>${esc(d)}</span><i>›</i></a>`).join("")}</div></section>
    <div class="small muted" data-sync></div>

}

/* ===================== СТАТИСТИКА ===================== */
function viewStats(){
  const days=[];for(let i=29;i>=0;i--){const t=Date.now()-i*DAY,k=dkey(t),d=S.days[k]||{n:0,ok:0};days.push({k,t,n:d.n||0,ok:d.ok||0})}
  const tot=days.reduce((s,d)=>s+d.n,0),okc=days.reduce((s,d)=>s+d.ok,0),acc=tot?Math.round(okc/tot*100):0;
  const active=Object.values(S.days).filter(d=>d.n>0).length,goal=S.settings.goal;
  const W=320,H=130,top=10,bot=20,bw=W/30,max=Math.max(goal,...days.map(d=>d.n),1),y=v=>top+(H-top-bot)*(1-v/max);
  const fmt=t=>new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  let bars=days.map((d,i)=>{const h=d.n?Math.max(3,(H-top-bot)*d.n/max):0,x=i*bw;
    return `<g data-tip="${fmt(d.t)}: ${d.n} ${plural(d.n,["ответ","ответа","ответов"])}${d.n?" · "+Math.round(d.ok/d.n*100)+"% верно":""}"><rect x="${x}" y="${top}" width="${bw}" height="${H-top-bot}" fill="transparent"/>${h?`<path d="M${x+1.5} ${H-bot} V${H-bot-h+3} q0 -3 3 -3 h${bw-6} q3 0 3 3 V${H-bot} Z" class="b"/>`:`<rect x="${x+1.5}" y="${H-bot-1.5}" width="${bw-3}" height="1.5" class="b0"/>`}</g>`+(i%5===4?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${new Date(d.t).getDate()}</text>`:"")}).join("");
  bars+=`<line class="gl" x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W-2}" y="${y(goal)-4}" text-anchor="end">цель ${goal}</text>`;
  const lv=LEVELS.map(L=>{const ws=allWords().filter(w=>w.lvl===L);const kn=ws.filter(w=>status(w.id)==="known").length,lr=ws.filter(w=>status(w.id)==="learn").length;return{L,total:ws.length,kn,lr}});
  const topics={};Object.values(S.mist).forEach(m=>{const k=m.t||"misc";topics[k]=topics[k]||{a:0,f:0};if(m.done)topics[k].f++;else topics[k].a++});
  const tp=Object.entries(topics).sort((a,b)=>(b[1].a+b[1].f)-(a[1].a+a[1].f)).slice(0,6);
  V.innerHTML=`<h1>Статистика</h1><p class="sub">Последние 30 дней и прогресс за всё время.</p>
  <div class="stack">
  <section class="kpis"><div><b>${tot}</b><span>ответов за 30 дней</span></div><div><b>${acc}%</b><span>точность</span></div><div><b>${streak()}</b><span>серия · лучшая ${bestStreak()}</span></div><div><b>${active}</b><span>дней занятий всего</span></div></section>
  <section class="sheet"><h2 style="margin-bottom:4px">Ответы по дням</h2><div class="chartw"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ответы по дням за 30 дней">${bars}</svg><div class="ctip" hidden></div></div>
    <details style="margin-top:8px"><summary class="small">Таблица</summary><div class="tbl"><table class="vtable"><tr><th>День</th><th>Ответов</th><th>Верно</th></tr>${days.filter(d=>d.n).reverse().map(d=>`<tr><td>${fmt(d.t)}</td><td>${d.n}</td><td>${Math.round(d.ok/d.n*100)}%</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Пока нет занятий</td></tr>'}</table></div></details></section>
  <section class="sheet"><h2>Слова по уровням</h2><p class="small muted" style="margin:-4px 0 12px">Тёмная часть — выучено надолго (интервал повтора от 3 недель), светлая — в процессе</p>
    <div class="lvbars">${lv.map(x=>`<div class="lvr"><span class="lvn">${x.L}</span><div class="lvt" title="${x.kn} выучено, ${x.lr} в процессе из ${x.total}"><i class="k" style="width:${x.total?x.kn/x.total*100:0}%"></i><i class="l" style="width:${x.total?x.lr/x.total*100:0}%"></i></div><span class="lvc">${x.kn+x.lr}/${x.total}</span></div>`).join("")}</div></section>
  ${tp.length?`<section class="sheet"><h2>Ошибки по темам</h2><div class="stack" style="gap:8px">${tp.map(([k,v])=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span style="min-width:0">${esc(topicName(k))}</span><span class="small"><span class="pill learn">в работе ${v.a}</span> <span class="pill known">исправлено ${v.f}</span></span></div>`).join("")}</div></section>`:""}
  </div>`;
  const wrap=V.querySelector(".chartw"),tip=wrap.querySelector(".ctip");
  wrap.querySelectorAll("[data-tip]").forEach(g=>{
    const show=e=>{const r=wrap.getBoundingClientRect();tip.textContent=g.dataset.tip;tip.hidden=false;
      const x=(e.clientX||((e.touches&&e.touches[0].clientX)||0))-r.left;tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,x-tip.offsetWidth/2))+"px";tip.style.top="0px";
      wrap.querySelectorAll("[data-tip].hov").forEach(z=>z.classList.remove("hov"));g.classList.add("hov")};
    g.addEventListener("pointerenter",show);g.addEventListener("pointermove",show);
  });
  wrap.addEventListener("pointerleave",()=>{tip.hidden=true;wrap.querySelectorAll(".hov").forEach(z=>z.classList.remove("hov"))});
}

/* ---------- WORDS ---------- */
let WF={q:"",f:"all",confirm:false};
function viewWords(){
  const list=allWords();
  const cnt={new:0,learn:0,known:0};list.forEach(w=>cnt[status(w.id)]++);
  V.innerHTML=`<h1>Слова</h1><p class="sub">${list.length} ${plural(list.length,["слово","слова","слов"])}: выучено ${cnt.known}, учу ${cnt.learn}, новых ${cnt.new}. «Выучено» — когда интервал повторения дошёл до трёх недель.</p>
  <div class="stack">
  <section class="sheet"><h2>Добавить своё слово</h2>
    <form id="addf" class="form">
      <input type="text" id="aen" placeholder="По-английски, например: get rid of" required autocomplete="off" autocapitalize="off">
      <input type="text" id="aru" placeholder="Перевод: избавиться от" required autocomplete="off">
      <input type="text" id="aex" class="full" placeholder="Пример (необязательно): I want to get rid of this old sofa." autocomplete="off">
      <div class="full row"><button class="btn primary" type="submit">Добавить в карточки</button><span class="small muted">Свои слова идут первыми среди новых.</span></div>
    </form></section>
  <section>
    <div class="row" style="margin-bottom:10px"><input type="text" id="wq" placeholder="Поиск" value="${esc(WF.q)}" style="flex:1;min-width:160px">
    <div class="seg" role="group" aria-label="Фильтр">${[["all","Все"],["learn","Учу"],["known","Выучено"],["new","Новые"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${WF.f===k}">${t}</button>`).join("")}</div></div>
    <div class="wl" id="wl"></div>
  </section>
  ${setsHTML()}
  ${transferHTML()}
  <section class="sheet"><h2>Настройки</h2>
    <div class="settings">
      <label for="slvl">Рабочий уровень <span class="small muted">· <a href="#test">тест</a></span></label><select id="slvl">${LEVELS.map(l=>`<option value="${l}" ${l===S.level?"selected":""}>${l} · ${LVLNAME[l]}</option>`).join("")}</select>
      <label for="snew">Новых слов в день</label><select id="snew">${[5,10,15,20,30].map(n=>`<option ${n===S.settings.newPerDay?"selected":""}>${n}</option>`).join("")}</select>
      <label for="sgoal">Дневная цель, ответов</label><select id="sgoal">${[15,30,50,80].map(n=>`<option ${n===S.settings.goal?"selected":""}>${n}</option>`).join("")}</select>
      <label for="sweek">Цель: дней в неделю</label><select id="sweek">${[3,4,5,6,7].map(n=>`<option ${n===(S.settings.weekGoal||5)?"selected":""}>${n}</option>`).join("")}</select>
      <label for="svoice">Произношение</label><select id="svoice"><option value="en-US" ${S.settings.voice==="en-US"?"selected":""}>Американское</option><option value="en-GB" ${S.settings.voice==="en-GB"?"selected":""}>Британское</option></select>
      <label for="sbud">Ясик в заданиях</label><select id="sbud"><option value="on" ${S.settings.buddy!==false?"selected":""}>Показывать</option><option value="off" ${S.settings.buddy===false?"selected":""}>Скрыть</option></select>
      <label for="ssound">Звуки ответов</label><select id="ssound"><option value="on" ${S.settings.sound!==false?"selected":""}>Включены</option><option value="off" ${S.settings.sound===false?"selected":""}>Выключены</option></select>
      ${navigator.vibrate?`<label for="svib">Вибрация</label><select id="svib"><option value="on" ${S.settings.vibrate!==false?"selected":""}>Включена</option><option value="off" ${S.settings.vibrate===false?"selected":""}>Выключена</option></select>`:""}
      ${window.NativeApp&&window.NativeApp.reminder?`<label for="srem">Напоминание о занятии</label><select id="srem">${["off","08:00","12:00","18:00","19:00","20:00","21:00","22:00"].map(t=>`<option value="${t}" ${(S.settings.reminder||"off")===t?"selected":""}>${t==="off"?"Выключено":"каждый день в "+t}</option>`).join("")}</select>`:""}
    </div>
    <p class="small muted" style="margin:14px 0 10px" data-sync></p>
    <div class="row">${WF.confirm?`<span>Удалить весь прогресс и свои слова?</span><button class="btn" id="rsyes" style="color:var(--bad);border-color:var(--bad)">Да, удалить</button><button class="btn ghost" id="rsno">Отмена</button>`:`<button class="btn ghost" id="rs">Сбросить прогресс</button>`}</div>
  </section></div>`;
  renderWL();bindSets();bindTransfer();syncUI();
  $("#wq").oninput=e=>{WF.q=e.target.value;renderWL()};
  V.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{WF.f=b.dataset.f;V.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderWL()});
  $("#addf").onsubmit=e=>{e.preventDefault();const en=$("#aen").value.trim(),ru=$("#aru").value.trim(),ex=$("#aex").value.trim();
    if(!en||!ru)return;if(allWords().some(w=>norm(w.en)===norm(en))){toast("Это слово уже есть в списке");return}
    S.custom.push({id:"c:"+en.toLowerCase(),en,ru,ipa:"",ex,exru:""});save();toast("Добавлено: "+en);viewWords()};
  $("#slvl").onchange=e=>{setLevel(e.target.value,"manual");toast("Уровень: "+e.target.value);chips()};
  $("#snew").onchange=e=>{S.settings.newPerDay=+e.target.value;save();CS=null;toast("Сохранено")};
  $("#sweek").onchange=e=>{S.settings.weekGoal=+e.target.value;save();toast("Сохранено")};
  $("#sgoal").onchange=e=>{S.settings.goal=+e.target.value;save();toast("Сохранено")};
  $("#sbud").onchange=e=>{S.settings.buddy=e.target.value==="on";save();toast(S.settings.buddy?"Ясик будет рядом в заданиях":"Ясик спрятался")};
  $("#ssound").onchange=e=>{S.settings.sound=e.target.value==="on";save();if(S.settings.sound)feedback(true)};
  const svib=$("#svib");if(svib)svib.onchange=e=>{S.settings.vibrate=e.target.value==="on";save()};
  const srem=$("#srem");if(srem)srem.onchange=e=>{const v=e.target.value;S.settings.reminder=v;save();
    if(v==="off")window.NativeApp.reminder.set(20,0,false);else{const [h,m]=v.split(":").map(Number);window.NativeApp.reminder.set(h,m,true)}
    toast(v==="off"?"Напоминание выключено":"Напомню каждый день в "+v)};
  $("#svoice").onchange=e=>{S.settings.voice=e.target.value;save();speak("Hello! This is how I sound.")};
  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
  on("rs",()=>{WF.confirm=true;viewWords()});on("rsno",()=>{WF.confirm=false;viewWords()});
  on("rsyes",()=>{S=JSON.parse(JSON.stringify(DEF));S.resetAt=Date.now();save();CS=GS=TS=LS=MS=TT=null;WF.confirm=false;toast("Прогресс сброшен");viewWords();chips()});
}
function renderWL(){
  const q=norm(WF.q);
  const list=allWords().filter(w=>(WF.f==="all"||status(w.id)===WF.f)&&(!q||norm(w.en).includes(q)||w.ru.toLowerCase().includes(WF.q.toLowerCase())));
  const lbl={new:"новое",learn:"учу",known:"выучено"};
  $("#wl").innerHTML=list.length?list.map(w=>{const st=status(w.id),c=S.cards[w.id];
    return `<div class="wi"><span class="e">${esc(w.en)} <span class="wlv">${w.lvl||"своё"}</span></span><span class="r">${esc(w.ru)}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="pill ${st}" title="${c?"Следующее повторение: "+new Date(c.due).toLocaleDateString("ru-RU"):""}">${lbl[st]}</span>${w.custom?`<button class="btn ghost small" data-del="${esc(w.id)}" aria-label="Удалить ${esc(w.en)}" style="padding:2px 6px">×</button>`:""}</span></div>`}).join("")
    :`<div class="wi"><span class="muted">Ничего не найдено</span></div>`;
  $("#wl").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;S.custom=S.custom.filter(c=>c.id!==id);S.deleted=(S.deleted||[]).concat(id);delete S.cards[id];save();renderWL()});
}

autoPacks();applyPacks();applyFreeze();
new MutationObserver(()=>queueMicrotask(()=>{mascotize();budCheck()})).observe(V,{childList:true,subtree:true});
if(!S.onboarded&&!(S.totalAns>0)&&location.hash!=="#hello")location.hash="#hello";else route();
initSync();
</script>
