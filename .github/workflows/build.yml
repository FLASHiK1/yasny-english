name: Сборка приложений

on:
  push:
    branches: [main]
    paths-ignore: ['packs/**', 'README.md']
  workflow_dispatch:

env:
  PACKS_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/packs/

jobs:
  ios:
    name: iOS (IPA без подписи)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Веб-часть приложения
        run: python3 android/make_assets.py index.html ios/Resources/index.html ios "$PACKS_URL"
      - name: XcodeGen
        run: brew install xcodegen
      - name: Генерация проекта
        working-directory: ios
        run: xcodegen generate
      - name: Сборка
        working-directory: ios
        run: |
          xcodebuild -project YasnyEnglish.xcodeproj -target YasnyEnglish -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Release-iphoneos/YasnyEnglish.app
      - name: Упаковка IPA
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/YasnyEnglish.app Payload/
          zip -qry YasnyEnglish-unsigned.ipa Payload
          ls -la YasnyEnglish-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: YasnyEnglish-iOS-unsigned-ipa
          path: ios/YasnyEnglish-unsigned.ipa

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Сборка APK
        env:
          JAR: ${{ env.ANDROID_HOME }}/platforms/android-35/android.jar
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: BT="$ANDROID_HOME/build-tools/35.0.0" JAR="$ANDROID_HOME/platforms/android-35/android.jar" ./android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YasnyEnglish-Android-apk
          path: android/build/yasny-english.apk
