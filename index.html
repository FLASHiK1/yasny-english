{id:"office",l:"B2",title:"Офис или удалёнка?",lines:[["A","Have you heard? The company wants everyone back in the office four days a week.","Слышал? Компания хочет, чтобы все вернулись в офис на четыре дня в неделю."],["B","Seriously? I've been working from home for two years, and my productivity has never been better.","Серьёзно? Я два года работаю из дома, и продуктивность у меня как никогда."],["A","I get that, but some managers argue that collaboration suffers when people are remote.","Понимаю, но некоторые руководители считают, что на удалёнке страдает совместная работа."],["B","That's a fair point, but surely it depends on the team. Ours communicates perfectly well online.","Справедливо, но ведь это зависит от команды. Наша отлично общается онлайн."],["A","True. I think the real issue is trust. If results are good, why should it matter where you work?","Верно. По-моему, дело в доверии. Если результаты хорошие, какая разница, где ты работаешь?"],["B","Exactly. I'd be willing to come in once or twice a week, but four days seems excessive.","Именно. Я готов приходить раз-два в неделю, но четыре дня — это перебор."],["A","Maybe we should raise it at the next team meeting.","Может, поднимем этот вопрос на следующей встрече команды."]],
q:[{q:"Чего хочет компания?",o:["Чтобы все работали в офисе 4 дня в неделю","Перевести всех на удалёнку","Сократить сотрудников"],a:"Чтобы все работали в офисе 4 дня в неделю"},{q:"Какой довод приводят руководители?",o:["Страдает совместная работа","Падает зарплата","Офис пустует"],a:"Страдает совместная работа"},{q:"Что готов делать B?",o:["Приходить 1–2 раза в неделю","Уволиться","Работать только в офисе"],a:"Приходить 1–2 раза в неделю"}]},
{id:"booking",l:"B2",title:"Путаница с бронью",lines:[["A","Hi, I booked a table for four at eight, under the name Petrov.","Здравствуйте, я бронировал столик на четверых на восемь, на фамилию Петров."],["B","Let me see. I'm afraid I can't find a booking under that name for tonight.","Сейчас посмотрю. Боюсь, на сегодня брони на эту фамилию нет."],["A","That's strange. I booked it online last week and got a confirmation email.","Странно. Я бронировал онлайн на прошлой неделе и получил подтверждение на почту."],["B","Could you show me the email? Ah, I see. The booking was made for next Friday, not today.","Можете показать письмо? А, понятно. Бронь на следующую пятницу, а не на сегодня."],["A","Oh no, I must have chosen the wrong date. Is there any chance you could fit us in?","О нет, наверное, я выбрал не ту дату. Может, найдёте для нас место?"],["B","We're fully booked at eight, but I could offer you a table on the terrace at half past.","На восемь всё занято, но могу предложить столик на террасе в половине девятого."],["A","That would be lovely, thank you for sorting it out.","Было бы чудесно, спасибо, что разобрались."]],
q:[{q:"В чём была проблема?",o:["Бронь на другой день","Бронь на другое имя","Ресторан закрыт"],a:"Бронь на другой день"},{q:"Как бронировали столик?",o:["Онлайн","По телефону","Лично"],a:"Онлайн"},{q:"Что предложили гостям?",o:["Столик на террасе в 8:30","Прийти завтра","Подождать час"],a:"Столик на террасе в 8:30"}]}
];
TEXTS.push(
{l:"A0",title:"My cat",text:"I have a cat. Her name is Lucy. She is small and white. Lucy likes milk and fish. She sleeps on my bed. In the morning she says hello. I love my cat.",
q:[{q:"Как зовут кошку?",o:["Люси","Лена","Лили"],a:"Люси"},{q:"Какого она цвета?",o:["Белая","Чёрная","Серая"],a:"Белая"},{q:"Где она спит?",o:["На кровати","На кухне","На диване"],a:"На кровати"}]},
{l:"A1",title:"My weekend",text:"On Saturday I get up late, at ten o'clock. I have a big breakfast with my family. Then I go to the park with my dog. In the afternoon I meet my friends. We drink coffee and talk. On Sunday I clean my flat and cook dinner. In the evening I watch a film. I love weekends!",
q:[{q:"Во сколько встаёт автор в субботу?",o:["В десять","В семь","В двенадцать"],a:"В десять"},{q:"С кем он идёт в парк?",o:["С собакой","С друзьями","С мамой"],a:"С собакой"},{q:"Что он делает в воскресенье?",o:["Убирает квартиру и готовит ужин","Работает","Едет к друзьям"],a:"Убирает квартиру и готовит ужин"}]},
{l:"A1",title:"At the market",text:"There is a big market near my house. It is open every day from eight to two. You can buy fruit, vegetables, cheese and bread there. The fruit is fresh and cheap. I usually go to the market on Friday. I buy apples, tomatoes and some cheese. The sellers are very friendly.",
q:[{q:"Когда работает рынок?",o:["Каждый день с 8 до 14","Только по выходным","Вечером"],a:"Каждый день с 8 до 14"},{q:"Когда обычно ходит автор?",o:["В пятницу","В понедельник","В воскресенье"],a:"В пятницу"},{q:"Какие продавцы?",o:["Дружелюбные","Строгие","Уставшие"],a:"Дружелюбные"}]},
{l:"A2",title:"My first day",text:"Yesterday was my first day at my new job. I was very nervous. I got up early and arrived at the office at half past eight. My manager, Kate, showed me the office and introduced me to the team. Everybody was friendly. At lunch, two colleagues took me to a small Italian café. In the afternoon I started my first project. When I got home, I was tired but happy.",
q:[{q:"Как чувствовал себя автор утром?",o:["Очень нервничал","Был спокоен","Был болен"],a:"Очень нервничал"},{q:"Кто показал ему офис?",o:["Менеджер Кейт","Коллега","Директор"],a:"Менеджер Кейт"},{q:"Где он обедал?",o:["В итальянском кафе","В офисе","Дома"],a:"В итальянском кафе"}]},
{l:"A2",title:"A rainy holiday",text:"Last summer we went to Scotland for a week. We wanted to walk in the mountains, but it rained almost every day. So we changed our plans. We visited museums and castles, and we tried a lot of local food. On the last day the sun finally came out, and we climbed a small mountain. The view was amazing. It wasn't the holiday we planned, but it was still great.",
q:[{q:"Почему пришлось поменять планы?",o:["Почти каждый день шёл дождь","Закрыли горы","Кто-то заболел"],a:"Почти каждый день шёл дождь"},{q:"Что они делали вместо походов?",o:["Ходили в музеи и замки","Сидели в отеле","Уехали домой"],a:"Ходили в музеи и замки"},{q:"Что случилось в последний день?",o:["Выглянуло солнце, и они поднялись на гору","Пошёл снег","Они опоздали на самолёт"],a:"Выглянуло солнце, и они поднялись на гору"}]},
{l:"B1",title:"Learning a language as an adult",text:"Many people believe that only children can learn languages easily. It's true that children often develop better pronunciation, but adults have important advantages too. They can understand grammar rules, use learning strategies and connect new words to things they already know. The biggest challenge for adults is usually time, not ability. Experts suggest studying a little every day instead of a lot once a week, because regular practice helps the brain remember. It also helps to use the language in real situations, for example by watching series or talking to native speakers online.",
q:[{q:"В чём дети обычно лучше взрослых?",o:["В произношении","В грамматике","В словарном запасе"],a:"В произношении"},{q:"Что обычно главная проблема для взрослых?",o:["Нехватка времени","Способности","Память"],a:"Нехватка времени"},{q:"Что советуют эксперты?",o:["Заниматься понемногу каждый день","Заниматься раз в неделю подолгу","Учить только грамматику"],a:"Заниматься понемногу каждый день"}]},
{l:"B1",title:"Fast fashion",text:"Fast fashion means cheap clothes that are produced quickly to follow the latest trends. It allows people to buy new outfits often, but it has a serious cost. The fashion industry uses huge amounts of water and produces a lot of waste, because many clothes are worn only a few times before being thrown away. Some shoppers are now changing their habits. They buy second-hand clothes, repair what they have, or choose fewer items of better quality. Small changes like these can make a real difference.",
q:[{q:"Что такое «быстрая мода»?",o:["Дешёвая одежда по последним трендам","Дорогие дизайнерские вещи","Спортивная одежда"],a:"Дешёвая одежда по последним трендам"},{q:"Какая проблема упомянута?",o:["Много воды и отходов","Плохие ткани","Высокие цены"],a:"Много воды и отходов"},{q:"Что начинают делать некоторые покупатели?",o:["Покупать вещи из вторых рук и чинить старые","Покупать ещё больше","Шить сами всё"],a:"Покупать вещи из вторых рук и чинить старые"}]},
{l:"B2",title:"Why we procrastinate",text:"Procrastination is often seen as a sign of laziness, but psychologists argue that it is mainly an emotional problem. We tend to delay tasks that make us feel anxious, bored or insecure, and we choose something pleasant instead to escape those feelings for a while. Unfortunately, the relief is temporary, and the stress grows as the deadline approaches. Researchers suggest a few practical strategies: breaking large tasks into small steps, starting with just five minutes of work, and being kinder to ourselves when we fail. Interestingly, people who forgive themselves for procrastinating tend to procrastinate less in the future.",
q:[{q:"Чем, по мнению психологов, в основном является прокрастинация?",o:["Эмоциональной проблемой","Ленью","Недостатком ума"],a:"Эмоциональной проблемой"},{q:"Какую стратегию предлагают исследователи?",o:["Разбивать задачи на маленькие шаги","Работать всю ночь","Ставить больше дедлайнов"],a:"Разбивать задачи на маленькие шаги"},{q:"Что известно о людях, которые прощают себя?",o:["Они прокрастинируют меньше","Они прокрастинируют больше","Они не замечают сроков"],a:"Они прокрастинируют меньше"}]},
{l:"B2",title:"Cities without cars",text:"In recent years, several European cities have started to limit car traffic in their centres. Some have introduced charges for driving in certain zones, while others have turned whole streets into areas for pedestrians and cyclists. Supporters claim that the benefits are obvious: cleaner air, less noise and safer streets for children. Local businesses were initially worried about losing customers, but in many cases their sales actually increased, as people spent more time walking around. Critics, however, point out that such policies can be difficult for elderly people and for those who live in suburbs with poor public transport.",
q:[{q:"Что делают некоторые европейские города?",o:["Ограничивают машины в центре","Строят новые дороги","Запрещают велосипеды"],a:"Ограничивают машины в центре"},{q:"Что случилось с продажами местных магазинов?",o:["Во многих случаях выросли","Резко упали","Не изменились"],a:"Во многих случаях выросли"},{q:"Кому такие меры могут мешать, по мнению критиков?",o:["Пожилым и жителям пригородов","Туристам","Детям"],a:"Пожилым и жителям пригородов"}]}
);

DIALOGS.push(
{id:"pharmacy",l:"A1",title:"В аптеке",lines:[["A","Good morning. Can I help you?","Доброе утро. Могу вам помочь?"],["B","Yes, please. I have a headache. Do you have something for it?","Да, пожалуйста. У меня болит голова. У вас есть что-нибудь от этого?"],["A","Yes. Take these tablets. One tablet, two times a day.","Да. Возьмите эти таблетки. По одной таблетке два раза в день."],["B","Can my son take them? He is ten.","Мой сын может их принимать? Ему десять лет."],["A","No, they are for adults. For a child, this syrup is good.","Нет, они для взрослых. Для ребёнка хорош этот сироп."],["B","OK. How much are the tablets and the syrup?","Хорошо. Сколько стоят таблетки и сироп?"],["A","The tablets are four euros. The syrup is five euros.","Таблетки стоят четыре евро. Сироп стоит пять евро."],["B","I want both, please.","Мне нужно и то и другое, пожалуйста."],["A","Nine euros, please.","С вас девять евро."]],
q:[{q:"Сколько раз в день принимать таблетки?",o:["Два раза","Три раза","Один раз"],a:"Два раза"},{q:"Почему сыну нельзя таблетки?",o:["Они только для взрослых","Они очень дорогие","У него нет головной боли"],a:"Они только для взрослых"},{q:"Сколько нужно заплатить всего?",o:["9 евро","4 евро","5 евро"],a:"9 евро"}]},
{id:"taxi",l:"A1",title:"В такси",lines:[["A","Hello! Where to?","Здравствуйте! Куда едем?"],["B","To the airport, please.","В аэропорт, пожалуйста."],["A","OK. Do you have big bags?","Хорошо. У вас большие сумки?"],["B","Yes, I have two.","Да, у меня две."],["A","No problem. Put them in the car. The airport is thirty minutes from here.","Не проблема. Положите их в машину. До аэропорта отсюда тридцать минут."],["B","How much is it?","Сколько это стоит?"],["A","About forty euros.","Около сорока евро."],["B","OK. My plane is at five o'clock. Is that fine?","Хорошо. Мой самолёт в пять часов. Это нормально?"],["A","Yes, we have a lot of time.","Да, у нас много времени."]],
q:[{q:"Куда едет пассажир?",o:["В аэропорт","На вокзал","В гостиницу"],a:"В аэропорт"},{q:"Сколько у него сумок?",o:["Две","Одна","Три"],a:"Две"},{q:"Во сколько его самолёт?",o:["В пять часов","В три часа","В шесть часов"],a:"В пять часов"}]},
{id:"party",l:"A2",title:"Приглашение на день рождения",lines:[["A","Hi, Tom! It's Anna. I'm having a birthday party on Saturday. Can you come?","Привет, Том! Это Анна. В субботу у меня день рождения. Ты сможешь прийти?"],["B","Of course! What time does it start?","Конечно! Во сколько начало?"],["A","At seven, at my flat. But you can come later if you want.","В семь, у меня дома. Но можешь прийти позже, если хочешь."],["B","I finish work at seven, so I can be there at eight.","Я заканчиваю работу в семь, так что буду у тебя в восемь."],["A","That's fine. My sister is making a cake.","Хорошо. Моя сестра печёт торт."],["B","Great! Should I bring something to eat or drink?","Отлично! Мне принести что-нибудь поесть или попить?"],["A","Just some juice, please. We have a lot of food.","Только сок, пожалуйста. Еды у нас много."],["B","No problem. And what would you like for your birthday?","Без проблем. А что ты хочешь на день рождения?"],["A","Nothing special. Just come and have fun!","Ничего особенного. Просто приходи и веселись!"]],
q:[{q:"Во сколько Том придёт?",o:["В восемь","В семь","В девять"],a:"В восемь"},{q:"Кто печёт торт?",o:["Сестра Анны","Анна","Том"],a:"Сестра Анны"},{q:"Что Том принесёт?",o:["Сок","Торт","Цветы"],a:"Сок"}]},
{id:"return",l:"A2",title:"Возврат куртки",lines:[["A","Hello. Can I help you?","Здравствуйте. Могу вам помочь?"],["B","Yes. I bought this jacket last week, but it's too small.","Да. Я купила эту куртку на прошлой неделе, но она мне мала."],["A","Do you have the receipt?","У вас есть чек?"],["B","Yes, here it is.","Да, вот он."],["A","Thank you. Would you like a bigger size?","Спасибо. Вы хотите размер побольше?"],["B","I'd like to, but I think you don't have one. I looked online yesterday.","Хотела бы, но, по-моему, его у вас нет. Вчера я смотрела в интернете."],["A","You're right. We only have the black one in large. Do you like it?","Вы правы. У нас есть только чёрная в большом размере. Вам она нравится?"],["B","Not really. I prefer blue. Can I get my money back?","Не очень. Я больше люблю синюю. Можно вернуть деньги?"],["A","Yes, of course. The money will go back to your card in three to five days.","Да, конечно. Деньги вернутся на вашу карту через три-пять дней."]],
q:[{q:"Почему женщина возвращает куртку?",o:["Она мала","Она порвана","Она слишком дорогая"],a:"Она мала"},{q:"Какая куртка есть в магазине?",o:["Чёрная большого размера","Синяя большого размера","Красная среднего размера"],a:"Чёрная большого размера"},{q:"Когда вернутся деньги?",o:["Через 3–5 дней","Сразу наличными","Через месяц"],a:"Через 3–5 дней"}]},
{id:"reservation",l:"A2",title:"Бронь столика",lines:[["A","Good evening, Bella Italia. How can I help you?","Добрый вечер, «Белла Италия». Чем могу помочь?"],["B","Hello. I'd like to book a table for four on Friday, please.","Здравствуйте. Я хотел бы забронировать столик на четверых на пятницу."],["A","What time would you like?","На какое время?"],["B","At eight o'clock, if possible.","На восемь часов, если можно."],["A","I'm sorry, we're full at eight. We have a table at half past seven or at nine.","Простите, в восемь у нас занято. Есть столик в половине восьмого или в девять."],["B","Half past seven is fine.","Половина восьмого подойдёт."],["A","Great. Can I have your name, please?","Отлично. Назовите вашу фамилию, пожалуйста."],["B","It's Brown. And one of my friends doesn't eat meat. Do you have vegetarian dishes?","Браун. И один из моих друзей не ест мясо. У вас есть вегетарианские блюда?"],["A","Yes, we have pasta and pizza without meat. See you on Friday, Mr Brown.","Да, у нас есть паста и пицца без мяса. До встречи в пятницу, мистер Браун."]],
q:[{q:"На какое время забронировали столик?",o:["На 7:30","На 8:00","На 9:00"],a:"На 7:30"},{q:"На сколько человек столик?",o:["На четверых","На двоих","На шестерых"],a:"На четверых"},{q:"Что нужно одному из друзей?",o:["Блюда без мяса","Детский стул","Столик у окна"],a:"Блюда без мяса"}]},
{id:"flat",l:"B1",title:"Аренда квартиры",lines:[["A","Hello, I'm calling about the two-bedroom flat on Green Street. Is it still available?","Здравствуйте, я звоню насчёт квартиры с двумя спальнями на Грин-стрит. Она ещё свободна?"],["B","Yes, it is. It's free from the first of March. Would you like to see it?","Да. Она свободна с первого марта. Хотите посмотреть?"],["A","Yes, please. How much is the rent?","Да, пожалуйста. Сколько стоит аренда?"],["B","It's 750 euros a month. Water and heating are included, but you pay for electricity and the internet.","750 евро в месяц. Вода и отопление включены, а электричество и интернет вы оплачиваете сами."],["A","I see. Do I have to pay a deposit?","Понятно. Нужно вносить залог?"],["B","Yes, one month's rent. You get it back when you leave, if everything is in good condition.","Да, в размере месячной аренды. Его вернут при выезде, если всё в хорошем состоянии."],["A","That sounds fair. I have a cat, though. Are pets allowed?","Звучит справедливо. Но у меня есть кошка. Животных можно?"],["B","Small pets are fine, but the owner wants to meet you first.","Небольших животных можно, но владелец хочет сначала с вами познакомиться."],["A","No problem. Can I come on Thursday after work?","Не проблема. Можно я приду в четверг после работы?"],["B","Thursday at six works for me. I'll send you the address.","Четверг в шесть мне подходит. Я пришлю вам адрес."]],
q:[{q:"Что входит в стоимость аренды?",o:["Вода и отопление","Электричество и интернет","Только вода"],a:"Вода и отопление"},{q:"Что владелец хочет сделать сначала?",o:["Познакомиться с жильцом","Увеличить залог","Посмотреть кошку у ветеринара"],a:"Познакомиться с жильцом"},{q:"Когда назначен просмотр?",o:["В четверг в шесть","В среду в восемь","В пятницу утром"],a:"В четверг в шесть"}]},
{id:"checkin",l:"B1",title:"Регистрация в аэропорту",lines:[["A","Good afternoon. Passport and booking number, please.","Добрый день. Паспорт и номер бронирования, пожалуйста."],["B","Here you are. I'm flying to Madrid.","Вот, пожалуйста. Я лечу в Мадрид."],["A","Thank you. Are you checking in any bags?","Спасибо. Вы сдаёте багаж?"],["B","Yes, this suitcase. I think it's a bit heavy.","Да, этот чемодан. Кажется, он немного тяжёлый."],["A","It's 23 kilos. The limit is 20, so you'll have to pay thirty euros, or take something out.","23 килограмма. Лимит 20, так что придётся доплатить тридцать евро или вынуть что-нибудь."],["B","I'd rather take out some books and put them in my hand luggage.","Лучше я выну несколько книг и положу их в ручную кладь."],["A","That's fine. Take your time.","Хорошо. Не торопитесь."],["B","Done. Could I have a window seat, if there is one?","Готово. Можно место у окна, если есть?"],["A","Yes, 14A. Your flight leaves from gate B12, and boarding starts at 2:20.","Да, 14A. Ваш рейс вылетает от выхода B12, посадка начинается в 14:20."],["B","Thanks. Is the flight on time?","Спасибо. Рейс по расписанию?"],["A","So far, yes. Have a pleasant flight.","Пока да. Приятного полёта."]],
q:[{q:"Почему у пассажира проблема с чемоданом?",o:["Он тяжелее нормы","Он слишком большой","Он повреждён"],a:"Он тяжелее нормы"},{q:"Что он решает сделать?",o:["Переложить книги в ручную кладь","Заплатить 30 евро","Оставить чемодан в аэропорту"],a:"Переложить книги в ручную кладь"},{q:"Какое у него место и выход?",o:["14A, выход B12","12B, выход A14","14A, выход A12"],a:"14A, выход B12"}]},
{id:"noise",l:"B1",title:"Шум от соседей",lines:[["A","Hello. Sorry to bother you. I'm your neighbour from downstairs.","Здравствуйте. Простите, что беспокою. Я ваш сосед снизу."],["B","Oh, hi. Is there a problem?","О, здравствуйте. Что-то случилось?"],["A","Well, I could hear loud music last night until about one in the morning.","Дело в том, что вчера ночью я слышал громкую музыку примерно до часа."],["B","Oh no, I'm really sorry. It was my daughter's birthday party, and we forgot about the time.","Ох, мне очень жаль. Был день рождения дочери, и мы забыли о времени."],["A","I understand, but I get up at five for work, so I couldn't sleep.","Я понимаю, но я встаю в пять на работу, поэтому не смог уснуть."],["B","That must have been awful. It won't happen again, I promise.","Это, наверное, было ужасно. Это больше не повторится, обещаю."],["A","I don't mind a party now and then. Just tell me in advance.","Я не против вечеринки время от времени. Просто предупредите меня заранее."],["B","Of course. And after ten o'clock on weekdays, we'll keep it quiet.","Конечно. А после десяти вечера в будни мы будем вести себя тихо."],["A","Thank you. That would help a lot.","Спасибо. Это очень поможет."],["B","If there's ever a problem again, please just knock. I'd rather know.","Если снова будет проблема, просто постучите. Я предпочитаю знать."]],
q:[{q:"Почему сосед снизу не смог уснуть?",o:["Музыка играла до часа ночи, а ему рано вставать","Он болел","Дети кричали утром"],a:"Музыка играла до часа ночи, а ему рано вставать"},{q:"Почему была вечеринка?",o:["День рождения дочери","Новоселье","Свадьба брата"],a:"День рождения дочери"},{q:"О чём они договорились?",o:["Предупреждать заранее и после десяти в будни быть тихо","Больше никогда не устраивать вечеринок","Звонить в полицию"],a:"Предупреждать заранее и после десяти в будни быть тихо"}]},
{id:"raise",l:"B2",title:"Разговор о повышении зарплаты",lines:[["A","Thanks for making time for me. I'd like to talk about my salary.","Спасибо, что нашли время. Я хотел бы поговорить о своей зарплате."],["B","Of course. What did you have in mind?","Конечно. Что вы имели в виду?"],["A","I've been here for two years, and over the last six months I've taken on new clients as well as my usual projects.","Я работаю здесь два года, а последние полгода веду новых клиентов в дополнение к обычным проектам."],["B","Yes, and your results have been excellent. I won't pretend otherwise.","Да, и ваши результаты отличные. Не буду это отрицать."],["A","Given that, and the current market rates for my role, I think a ten per cent raise would be reasonable.","Учитывая это и текущие рыночные ставки на мою должность, я считаю, что повышение на десять процентов было бы разумным."],["B","I agree you deserve it, but the budget is frozen until the next quarter. I can't promise ten per cent right now.","Согласен, что вы этого заслуживаете, но бюджет заморожен до следующего квартала. Прямо сейчас я не могу пообещать десять процентов."],["A","I see. Would it be possible to get something in the meantime, then?","Понятно. Тогда можно ли получить что-то на это время?"],["B","I could offer you two extra days of holiday now, and a formal review in three months.","Я могу предложить вам два дополнительных дня отпуска сейчас и официальный пересмотр через три месяца."],["A","I'd accept that, provided we put the review date in writing.","Я согласился бы, при условии что мы зафиксируем дату пересмотра письменно."],["B","Fair enough. I'll send you an email by the end of the day.","Справедливо. Я отправлю вам письмо до конца дня."]],
q:[{q:"Какое повышение просит сотрудник?",o:["Десять процентов","Пять процентов","Двадцать процентов"],a:"Десять процентов"},{q:"Почему руководитель не может согласиться сразу?",o:["Бюджет заморожен до следующего квартала","Результаты сотрудника слабые","Сотрудник работает слишком мало"],a:"Бюджет заморожен до следующего квартала"},{q:"На что сотрудник соглашается?",o:["Два дня отпуска и пересмотр через три месяца с письменной фиксацией","Только пересмотр через год","Премия в конце года"],a:"Два дня отпуска и пересмотр через три месяца с письменной фиксацией"}]},
{id:"tripplan",l:"B2",title:"Планируем поездку",lines:[["A","So, have you decided where we're going this summer? Portugal or Croatia?","Ну что, ты решил, куда мы едем летом? В Португалию или Хорватию?"],["B","I keep going back and forth. Flights to Lisbon are cheaper, but I've heard Croatia is more beautiful.","Я всё колеблюсь. Билеты в Лиссабон дешевле, но я слышал, что Хорватия красивее."],["A","Honestly, I don't mind the price as long as we don't end up in a crowded place. August is packed everywhere.","Честно говоря, цена меня не волнует, лишь бы мы не оказались в толпе. В августе везде полно народа."],["B","That's a good point. What if we went in September instead? It would be quieter and much cheaper.","Хороший довод. А если поехать в сентябре? Было бы тише и намного дешевле."],["A","I can only take time off in the first two weeks of August, though. My manager was quite clear about that.","Но я могу взять отпуск только в первые две недели августа. Мой начальник был вполне категоричен."],["B","Then let's avoid the big cities. I'd love some hiking, and you want to lie on a beach, right?","Тогда давай избегать больших городов. Я бы хотел походить по горам, а ты хочешь лежать на пляже, так?"],["A","Exactly. Could we find something that offers both?","Именно. Можем ли мы найти место, где есть и то и другое?"],["B","Croatia, then. Split has islands nearby, and there are good trails in the mountains behind the city.","Тогда Хорватия. Рядом со Сплитом есть острова, а за городом в горах хорошие тропы."],["A","Sounds like a compromise I can live with. We should book the flights by Friday, though, before the fares go up.","Похоже на компромисс, с которым я согласен. Но билеты надо забронировать до пятницы, пока цены не выросли."],["B","Agreed. I'll look at hotels tonight and send you a shortlist.","Согласен. Сегодня вечером я посмотрю отели и пришлю тебе короткий список."]],
q:[{q:"Почему друг не может поехать в сентябре?",o:["Начальник разрешает отпуск только в начале августа","У него нет денег","Он боится жары"],a:"Начальник разрешает отпуск только в начале августа"},{q:"Что они решают в итоге?",o:["Хорватия: пляж и горы рядом со Сплитом","Португалия, Лиссабон","Остаться дома"],a:"Хорватия: пляж и горы рядом со Сплитом"},{q:"Что нужно сделать до пятницы?",o:["Забронировать билеты","Заказать отель","Взять отпуск"],a:"Забронировать билеты"}]}
);
TEXTS.push(
{l:"A0",title:"Breakfast",text:"I get up at seven. I have breakfast at half past seven. I like eggs and bread. I drink tea with milk. My sister likes cereal and juice. We eat in the kitchen. The kitchen is small, but it is nice. After breakfast, I go to school.",q:[{q:"Что пьёт автор?",o:["Чай с молоком","Сок","Кофе"],a:"Чай с молоком"},{q:"Где они завтракают?",o:["На кухне","В комнате","В кафе"],a:"На кухне"},{q:"Что любит сестра?",o:["Хлопья и сок","Яйца и хлеб","Тосты и чай"],a:"Хлопья и сок"}]},
{l:"A1",title:"Our Dog Max",text:"We have a dog. His name is Max. He is three years old and he is big and brown. Max loves to run in the park. Every morning my father takes him for a walk. In the evening, I play with him in the garden. He likes his red ball very much. Max is not a good guard dog because he loves everybody. He sleeps on a soft bed in the kitchen. We all love him.",q:[{q:"Сколько лет Максу?",o:["Три года","Пять лет","Один год"],a:"Три года"},{q:"Кто гуляет с ним по утрам?",o:["Отец","Автор","Мама"],a:"Отец"},{q:"Почему Макс плохой сторожевой пёс?",o:["Он любит всех","Он боится людей","Он всё время спит"],a:"Он любит всех"}]},
{l:"A1",title:"My Bedroom",text:"My bedroom is small, but I like it. There is a bed near the window, and there is a blue carpet on the floor. I have a desk and a lamp. I do my homework at the desk. There are many books on the shelf. On the wall there are photos of my friends. I do not have a TV in my room. I listen to music on my phone before I sleep. My room is quiet, and it is my favourite place at home.",q:[{q:"Где стоит кровать?",o:["Возле окна","У двери","Возле шкафа"],a:"Возле окна"},{q:"Чего нет в комнате автора?",o:["Телевизора","Лампы","Письменного стола"],a:"Телевизора"},{q:"Что автор делает перед сном?",o:["Слушает музыку","Читает книгу","Смотрит фильм"],a:"Слушает музыку"}]},
{l:"A2",title:"Learning to Swim",text:"Last summer I decided to learn to swim. I was thirty years old, and I was a little afraid of deep water. My friend Kate told me about a good teacher at the city pool. The first lesson was difficult. I held on to the side and did not want to move. But the teacher was kind and patient, and she explained everything slowly. After five lessons I could swim across the pool without help. Now I go to the pool twice a week. Swimming makes me feel strong and relaxed. Next year I want to swim in the sea, and I am not afraid any more.",q:[{q:"Почему автор пошла на уроки плавания?",o:["Она хотела научиться плавать, хотя боялась глубокой воды","Врач посоветовал","Это работа"],a:"Она хотела научиться плавать, хотя боялась глубокой воды"},{q:"Через сколько уроков автор смогла плыть без помощи?",o:["Через пять","Через два","Через десять"],a:"Через пять"},{q:"Что автор хочет сделать в следующем году?",o:["Поплавать в море","Стать учителем","Купить бассейн"],a:"Поплавать в море"}]},
{l:"A2",title:"Shopping Online",text:"More and more people buy things on the internet. My mother does not like it, but I buy clothes, books and even food online. It is easy and fast. You can stay at home and find the best price in a few minutes. Delivery is usually free if you spend more than fifty euros. However, there are some problems. Sometimes the clothes are the wrong size, and you have to send them back. Also, you cannot touch or try the things before you buy them. Last month I bought a pair of shoes that looked great in the photo, but they were very uncomfortable in real life. Now I always read the reviews first.",q:[{q:"Когда доставка обычно бесплатная?",o:["Если потратить больше пятидесяти евро","Всегда","Только по выходным"],a:"Если потратить больше пятидесяти евро"},{q:"Какая проблема бывает с одеждой?",o:["Размер может не подойти","Её привозят слишком долго","Она всегда дорогая"],a:"Размер может не подойти"},{q:"Что автор делает теперь перед покупкой?",o:["Читает отзывы","Звонит маме","Идёт в магазин"],a:"Читает отзывы"}]},
{l:"B1",title:"Volunteering at an Animal Shelter",text:"Two years ago, I started volunteering at an animal shelter near my home. At first I only wanted to spend a few hours a week outside the office, but it soon became much more important to me. Every Saturday I walk the dogs, clean their cages and help new visitors choose a pet. The work is tiring, and sometimes it is sad, because some animals have been there for a long time. However, when a dog finds a family, it makes all the effort worthwhile. I have also met many interesting people there, including a retired doctor and a group of students. We have become good friends. If you are thinking about volunteering, I would recommend trying it. You do not need any special skills, just patience and a bit of free time. It can change the way you see your own life.",q:[{q:"Зачем автор сначала пошёл в приют?",o:["Хотел проводить несколько часов в неделю вне офиса","Хотел завести собаку","Это была работа"],a:"Хотел проводить несколько часов в неделю вне офиса"},{q:"Что оправдывает все усилия?",o:["Когда собака находит семью","Хорошая зарплата","Свободное время"],a:"Когда собака находит семью"},{q:"Что нужно для волонтёрства, по мнению автора?",o:["Терпение и немного свободного времени","Специальное образование","Опыт работы с животными"],a:"Терпение и немного свободного времени"}]},
{l:"B1",title:"Social Media and Teenagers",text:"Many parents worry that their children spend too much time on social media. It is true that some teenagers check their phones more than a hundred times a day, and this can affect their sleep and their schoolwork. Researchers also say that comparing yourself with the perfect photos of others can make young people feel unhappy about their own lives. On the other hand, social media is not all bad. It helps teenagers stay in touch with friends who live far away, and it gives them a place to share their hobbies and ideas. Some young people have even started small businesses online. The key, according to experts, is balance. Families can agree on phone-free times, for example during meals or an hour before bed. Instead of simply forbidding the apps, parents should talk to their children and show an interest in what they do online.",q:[{q:"Что может ухудшиться из-за частого использования телефона?",o:["Сон и учёба","Зрение и слух","Аппетит"],a:"Сон и учёба"},{q:"Какое преимущество соцсетей упоминается?",o:["Можно общаться с друзьями, живущими далеко","Они заменяют школу","Они бесплатные"],a:"Можно общаться с друзьями, живущими далеко"},{q:"Что советуют эксперты родителям?",o:["Договориться о времени без телефонов и разговаривать с детьми","Полностью запретить приложения","Забрать телефоны навсегда"],a:"Договориться о времени без телефонов и разговаривать с детьми"}]},
{l:"B1",title:"A Night in the Mountains",text:"Last August, my brother and I decided to spend a night in the mountains. We left the car at the bottom of the valley at nine in the morning and walked for six hours with heavy backpacks. The path was steep, and by the afternoon we were exhausted. When we finally reached the small hut near the lake, the weather suddenly changed. It began to rain, and a cold wind came from the north. We were lucky because an old man who looked after the hut gave us hot soup and a place near the fire. Later the clouds cleared, and I went outside alone. I had never seen so many stars in my life. It was completely silent, and for the first time in months I did not think about work. In the morning we walked down in the sunshine, tired but very happy. I am sure I will go back there next summer.",q:[{q:"Как долго они шли в первый день?",o:["Шесть часов","Три часа","Весь день и всю ночь"],a:"Шесть часов"},{q:"Что произошло, когда они дошли до домика?",o:["Погода испортилась","Они заблудились","Кончилась еда"],a:"Погода испортилась"},{q:"Что автору запомнилось ночью?",o:["Звёзды и тишина","Гроза","Встреча с медведем"],a:"Звёзды и тишина"}]},
{l:"B2",title:"Sleep and Success",text:"For years, working late into the night was considered a sign of ambition. Employees who answered emails at midnight were admired, and many people were proud to say that they needed only five hours of sleep. Recent research, however, tells a different story. Scientists have found that adults who regularly sleep less than seven hours make more mistakes, remember less and find it harder to control their emotions. In the long run, a lack of sleep is also linked to heart disease and weight gain. Some companies have started to respond to these findings. A few of them now offer quiet rooms where staff can take short naps, while others have banned meetings before nine o'clock. Critics argue that such measures are only a fashion, and that employees would be better off with lower workloads rather than sleeping pods. They may have a point, because no amount of rest can compensate for impossible deadlines. Still, the evidence suggests that treating sleep as a luxury is not only unhealthy but also bad business.",q:[{q:"Что показывают недавние исследования?",o:["Недосып ведёт к ошибкам и проблемам с памятью и эмоциями","Пять часов сна достаточно","Сон не влияет на работу"],a:"Недосып ведёт к ошибкам и проблемам с памятью и эмоциями"},{q:"Какие меры принимают некоторые компании?",o:["Комнаты для коротких снов и запрет встреч до девяти","Переход на ночные смены","Сокращение отпусков"],a:"Комнаты для коротких снов и запрет встреч до девяти"},{q:"В чём состоит аргумент критиков?",o:["Нужна меньшая нагрузка, а не капсулы для сна","Сон вообще не нужен","Люди слишком много отдыхают"],a:"Нужна меньшая нагрузка, а не капсулы для сна"}]},
{l:"B2",title:"The Plastic Problem",text:"Every year, millions of tonnes of plastic end up in the oceans, harming wildlife and entering the food chain. Although many of us feel guilty about our own plastic bags and bottles, experts point out that individual choices have a limited effect. Most of the waste comes from a small number of rivers in countries that lack the infrastructure to collect and recycle rubbish. Moreover, a surprisingly large share of plastic pollution consists of fishing nets lost or thrown away at sea. This does not mean that personal habits are irrelevant. Reducing our use of single-use items sends a message to producers and politicians, and it can gradually change what is available in shops. In addition, scientists are developing materials that break down naturally, although they are still expensive. Several countries have already introduced charges for plastic bags, and consumption fell sharply within months. Nevertheless, lasting solutions will require cooperation between governments, businesses and ordinary citizens. Without better waste management and more durable materials, even the most careful consumers will not be able to stop the problem.",q:[{q:"Откуда приходится большая часть пластика в океане?",o:["Из небольшого числа рек в странах без системы сбора мусора","Из туристических лодок","Из домашних мусорных баков в Европе"],a:"Из небольшого числа рек в странах без системы сбора мусора"},{q:"Что произошло в странах, где ввели плату за пакеты?",o:["Потребление быстро упало","Цены выросли","Ничего не изменилось"],a:"Потребление быстро упало"},{q:"Какой вывод делает автор?",o:["Нужно сотрудничество властей, бизнеса и граждан","Личные привычки совсем не важны","Достаточно перестать пользоваться пакетами"],a:"Нужно сотрудничество властей, бизнеса и граждан"}]}
);

  const key=k+":"+ref;let m=S.mist[key];
  if(!ok){if(!m)m=S.mist[key]={key,k,ref:String(ref),n:0,s:0,added:Date.now()};
    m.n++;m.s=0;m.done=false;m.last=user||"";m.lastAt=Date.now();m.due=Date.now()+10*60e3;Object.assign(m,meta||{})}
  else if(m&&!m.done&&m.due<=Date.now()){m.s++;if(m.s>=3){m.done=true;m.fixed=Date.now()}else m.due=Date.now()+[1,3][m.s-1]*DAY-3*3600e3}

/* ===================== TEXT MATCHING ===================== */
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"«»]/g," ");
  s=s.replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not")
     .replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'m\b/g," am").replace(/'d\b/g," would");
  return s.replace(/[.,!?;:()–—]/g," ").replace(/\s-\s/g," ").replace(/\s+/g," ").trim();
}
function expand(s){
  const m=s.match(/\[([^\[\]]*)\]/);
  if(!m)return[s.replace(/\s+/g," ").replace(/\s+([,.?!])/g,"$1").trim()];
  const out=[];for(const o of m[1].split("|"))out.push(...expand(s.slice(0,m.index)+o+s.slice(m.index+m[0].length)));return out;
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

const W_ART=new Set(["a","an","the"]);
const W_PREP=new Set(["in","on","at","to","for","of","by","with","from","into","about","under","between","after","before","since","during","near","over"]);
const W_AUX=new Set(["is","am","are","was","were","be","been","being","do","does","did","have","has","had","will","would","shall","should","can","could","may","might","must","not"]);
let IRR_MAP=null;
function irrMap(){if(IRR_MAP)return IRR_MAP;IRR_MAP=new Map();VERBS.forEach(v=>{[v[0],...v[1].split("|"),...v[2].split("|")].forEach(f=>{if(!IRR_MAP.has(f))IRR_MAP.set(f,v[0])})});return IRR_MAP}
function lemmas(w){
  const out=new Set([w]);const irr=irrMap().get(w);if(irr)out.add(irr);
  if(w.endsWith("ies")&&w.length>4)out.add(w.slice(0,-3)+"y");
  if(w.endsWith("ied")&&w.length>4)out.add(w.slice(0,-3)+"y");
  if(w.endsWith("es")&&w.length>3)out.add(w.slice(0,-2));
  if(w.endsWith("s")&&w.length>2)out.add(w.slice(0,-1));
  if(w.endsWith("ed")&&w.length>3){out.add(w.slice(0,-2));out.add(w.slice(0,-1));if(/(.)\1ed$/.test(w))out.add(w.slice(0,-3))}
  if(w.endsWith("ing")&&w.length>4){out.add(w.slice(0,-3));out.add(w.slice(0,-3)+"e");if(/(.)\1ing$/.test(w))out.add(w.slice(0,-4))}
  if(w.endsWith("er")&&w.length>3){out.add(w.slice(0,-2));out.add(w.slice(0,-1));if(/(.)\1er$/.test(w))out.add(w.slice(0,-3))}
  if(w.endsWith("est")&&w.length>4){out.add(w.slice(0,-3));out.add(w.slice(0,-2))}
  if(w.endsWith("ier"))out.add(w.slice(0,-3)+"y");
  [...out].forEach(x=>{const i=irrMap().get(x);if(i)out.add(i)});
  return out;
}
function sfxClass(w){if(irrMap().has(w)&&irrMap().get(w)!==w)return"irr";if(/ing$/.test(w))return"ing";if(/ed$/.test(w))return"ed";if(/est$/.test(w))return"est";if(/er$/.test(w))return"er";if(/s$/.test(w))return"s";return"base"}
function isForm(a,b){if(a===b)return false;if(sfxClass(a)===sfxClass(b)&&spellClose(a,b))return false;const la=lemmas(a),lb=lemmas(b);for(const x of la)if(lb.has(x))return true;return false}
function spellClose(a,b){if(a===b)return false;const L=Math.max(a.length,b.length);if(L<=3)return a.length===b.length&&L>=2&&a.split("").sort().join("")===b.split("").sort().join("");const d=lev(a,b);return L<=5?d<=1:L<=9?d<=2:d<=3}
function funcKind(w){return W_ART.has(w)?"art":W_PREP.has(w)?"prep":W_AUX.has(w)?"aux":null}
// Пословное выравнивание ответа с эталоном
function alignWords(u,t){
  const n=u.length,m=t.length,D=[],B=[];
  for(let i=0;i<=n;i++){D.push(new Array(m+1).fill(0));B.push(new Array(m+1).fill(null))}
  for(let i=1;i<=n;i++){D[i][0]=i;B[i][0]="del"}for(let j=1;j<=m;j++){D[0][j]=j;B[0][j]="ins"}
  const sub=(a,b)=>a===b?[0,"eq"]:(isForm(a,b)?[0.8,"form"]:(spellClose(a,b)&&!funcKind(a)&&!funcKind(b))?[0.35,"typo"]:[1.6,"sub"]);
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const [c,k]=sub(u[i-1],t[j-1]);let best=D[i-1][j-1]+c,op=k;
    if(D[i-1][j]+1<best){best=D[i-1][j]+1;op="del"}
    if(D[i][j-1]+1<best){best=D[i][j-1]+1;op="ins"}
    D[i][j]=best;B[i][j]=op}
  const ops=[];let i=n,j=m;
  while(i>0||j>0){const op=B[i][j];
    if(op==="del"){ops.push({op,u:u[i-1]});i--}else if(op==="ins"){ops.push({op,t:t[j-1]});j--}
    else{ops.push({op,u:u[i-1],t:t[j-1]});i--;j--}}
  return{cost:D[n][m],ops:ops.reverse()};
}
function classifyAnswer(user,target){
  const u=norm(user).split(" ").filter(Boolean),t=norm(target).split(" ").filter(Boolean);
  if(!u.length)return{status:"bad",cost:99,issues:[]};
  const {cost,ops}=alignWords(u,t);const issues=[];
  const sameBag=u.length===t.length&&u.slice().sort().join(" ")===t.slice().sort().join(" ")&&u.join(" ")!==t.join(" ");

  while(i<m&&j<n){if(a[i]===b[j]){out.push(esc(bOrig[j]));i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push('<span class="extra">'+esc(a[i])+'</span>');i++}else{out.push('<span class="miss">'+esc(bOrig[j])+'</span>');j++}}

    ${yasay("happy","Послушай и повтори вслух 2–3 раза. Через пару карточек я спрошу это слово — проверим, запомнилось ли.",56)}
    <div class="row"><button class="btn primary" id="introok">Запомнил</button><button class="btn ghost" id="introknow">Я его уже знаю</button></div></div>`;
    bindDir();
    $("#introok").onclick=()=>{CS.intro[w.id]=true;CS.queue.splice(Math.min(2,CS.queue.length),0,w);nextCard()};
    $("#introknow").onclick=()=>{CS.intro[w.id]=true;CS.queue.unshift(w);nextCard()};
    $("#introok").focus();if(CS.introSaid!==w.id){CS.introSaid=w.id;setTimeout(()=>speak(w.en),80)}
    return;
  }
  let body="";
  const cm=dir==="ru-en"&&!CS.revealed&&(w.lvl==="A0"||li(T())===0)&&(!c||c.reps<2);
  if(cm){
    if(CS.optsFor!==w.id){CS.optsFor=w.id;const near=allWords().filter(x=>x.id!==w.id&&x.ru!==w.ru&&Math.abs(li(x.lvl)-li(w.lvl))<=1);CS.opts=shuffle([w.ru].concat(shuffle(near).slice(0,3).map(x=>x.ru)))}
    body=`<div class="answer"><span class="prompt" style="margin:0">${esc(w.en)}</span>${sayBtn(w.en)}</div>${w.ipa?`<div class="ipa">${esc(w.ipa)}</div>`:""}
    <div class="label">Выбери перевод</div><div class="choices col">${CS.opts.map(o=>`<button class="btn" data-co="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="idk">Не знаю</button></div><div class="small muted">Новое слово сначала узнаёшь на слух и выбираешь перевод. Через пару повторений начнёшь писать его сам.</div>`;
    if(CS.autoSaid!==w.id){CS.autoSaid=w.id;setTimeout(()=>speak(w.en),50)}
  }else if(dir==="ru-en"){
    body=`<div class="prompt">${esc(w.ru)}</div>`;
    if(!CS.revealed){
      let hint="";
      if(CS.hint>=1&&w.ex){const b=markIn(w.ex,w.en,true);if(b)hint+=`<div class="example">${b}${w.exru?`<span class="ru">${esc(w.exru)}</span>`:""}</div>`}
      if(CS.hint>=2||(CS.hint>=1&&!(w.ex&&markIn(w.ex,w.en,true))))hint+=`<div class="hint">${esc(w.en.split(" ").map(x=>x[0]+"·".repeat(Math.max(0,x.length-1))).join("  "))}</div>`;
      body+=hint+`<input type="text" id="ans" class="big-input" placeholder="Напиши по-английски" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button class="btn primary" id="chk">Проверить</button>${micBtn("ans")}<button class="btn" id="hint" ${CS.hint>=2?"disabled":""}>Подсказка</button><button class="btn ghost" id="idk">Не помню</button></div>
      <div class="small muted">${isNew?"Новое слово можно не угадывать — нажми «Не помню», посмотри и запомни.":"Enter — проверить. Пустой Enter — показать ответ."}</div>`;
    }
  }else{
    body=`<div class="answer"><span class="prompt" style="margin:0">${esc(w.en)}</span>${sayBtn(w.en)}</div>${w.ipa?`<div class="ipa">${esc(w.ipa)}</div>`:""}`;
    if(!CS.revealed)body+=`<p class="muted" style="margin:0">Вспомни перевод, потом открой ответ и честно оцени себя.</p><div class="row"><button class="btn primary" id="show">Показать перевод</button></div>`;
  }
  if(CS.revealed){
    const r=CS.res;
    if(dir==="ru-en"){
      if(r&&r.status==="ok")body+=`<div class="verdict ok">Верно</div>`;
      else if(r&&r.status==="typo")body+=`<div class="verdict warn">Почти, проверь написание. <span>${r.choice?"Ты выбрал":"Ты написал"}: ${esc(r.user)}</span></div>`;
      else if(r&&r.user)body+=`<div class="verdict bad">Не совсем. <span>${r.choice?"Ты выбрал":"Ты написал"}: ${esc(r.user)}</span></div>`;
      if(r&&!r.choice&&r.user&&r.status!=="ok")body+=r.formOnly?`<div class="why">Слово верное, но в другой форме. В карточках пиши начальную форму: «${esc(w.en)}».</div>`:issuesHTML(r,r.status==="typo");
      body+=`<div class="answer"><span class="en">${esc(w.en)}</span>${sayBtn(w.en)}</div>${w.ipa?`<div class="ipa">${esc(w.ipa)}</div>`:""}`;
    }else{
      body+=`<div class="answer"><span class="en">${esc(w.ru)}</span></div>`;
    }
    if(w.ex)body+=`<div class="example"><span class="row" style="gap:8px;flex-wrap:nowrap"><span>${markIn(w.ex,w.en,false)}</span>${sayBtn(w.ex,"Озвучить пример")}</span>${w.exru?`<span class="ru">${esc(w.exru)}</span>`:""}</div>`;
    const sugg=dir==="ru-en"?(r&&r.status==="ok"?(CS.hint?1:2):r&&r.status==="typo"?1:0):-1;
    const names=["Снова","Трудно","Хорошо","Легко"];
    body+=`<div><div class="label" style="margin-bottom:8px">Насколько легко вспомнил?</div><div class="grades">${names.map((nm,g)=>`<button class="btn${g===sugg?" sugg":""}" data-g="${g}">${nm}<small>${fmtIvl(schedule(c,g))} · <span class="kbd">${g+1}</span></small></button>`).join("")}</div></div>`;
  }
  V.innerHTML=head+`<div class="card">${top}${body}</div>`;
  bindDir();
  const ans=$("#ans");
  if(ans){ans.focus();ans.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ans.value.trim()?doCheck():reveal(null)}}}
  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
  on("chk",()=>ans.value.trim()?doCheck():reveal(null));
  on("hint",()=>{const v=ans.value;CS.hint++;renderCard();$("#ans").value=v});
  on("idk",()=>{if(!isNew)mistake("word",w.id,false,"",{t:"vocab",l:w.lvl||null});reveal(null)});
  on("show",()=>{CS.revealed=true;renderCard()});
  V.querySelectorAll("[data-co]").forEach(b=>b.onclick=()=>{const ok=b.dataset.co===w.ru;mistake("word",w.id,ok,b.dataset.co,{t:"vocab",l:w.lvl||null});reveal({status:ok?"ok":"bad",user:b.dataset.co,choice:true})});
  V.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>gradeCard(+b.dataset.g));
  if(dir==="en-ru"&&!CS.revealed&&CS.autoSaid!==w.id){CS.autoSaid=w.id;speak(w.en)}
}
function bindDir(){V.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{S.settings.dir=b.dataset.dir;save();if(CS){CS.revealed=false;CS.res=null;CS.hint=0}renderCard()})}
function doCheck(){const w=CS.cur,u=$("#ans").value.trim();const r=check(u,w.en.split(/\s*[\/;]\s*/));r.user=u;if(r.status==="bad"&&r.issues&&r.issues.length===1&&r.issues[0].k==="form"&&!w.en.includes(" ")){r.status="typo";r.formOnly=true}mistake("word",w.id,r.status!=="bad",u,{t:"vocab",l:w.lvl||null});reveal(r)}
function reveal(r){CS.revealed=true;CS.res=r;renderCard();if(S.settings.dir==="ru-en")speak(CS.cur.en);const g=V.querySelector(".grades .sugg")||V.querySelector("[data-g='2']");if(g)g.focus()}
function gradeCard(g){
  const w=CS.cur;S.cards[w.id]=schedule(S.cards[w.id],g);
  CS.done++;if(g>=2)CS.right++;bump(g>=1,w.lvl||null);
  if(g===0)CS.queue.splice(Math.min(3,CS.queue.length),0,w);
  save();nextCard();
}
document.addEventListener("keydown",e=>{
  if(location.hash!=="#cards"||!CS||!CS.revealed||!CS.cur)return;
  if(e.target.matches("input,textarea"))return;
  if(["1","2","3","4"].includes(e.key)){e.preventDefault();gradeCard(+e.key-1)}
});

/* ---------- GRAMMAR ---------- */
let GS=null;
function openLesson(id,only,opts){
  const l=LESSONS.find(x=>x.id===id);
  GS={active:true,l,stage:only?"ex":"theory",items:only||shuffle(l.ex.map((_,i)=>i)),i:0,right:0,wrong:[],ans:null,retry:!!only,review:!!(opts&&opts.review)};
  renderLesson();
}
function renderLesson(){
  const l=GS.l;
  const back=`<button class="btn ghost" id="back" style="padding-left:0">← Все уроки</button>`;
  if(GS.stage==="theory"){
    V.innerHTML=`${back}<h1 style="margin-top:8px">${esc(l.title)}</h1><p class="sub">${l.lvl} · ${l.ex.length} упражнений</p>
    <div class="sheet anim theory">${l.theory}</div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="go">К упражнениям</button><button class="btn" data-rule-open="${l.id}">Не понял — подробнее</button></div>`;
    ruleRead(l.id);$("#go").onclick=()=>{GS.stage="ex";renderLesson()};
  }else if(GS.stage==="ex"){
    const e=l.ex[GS.items[GS.i]],done=GS.ans!==null;
    let q="";
    if(e.o){
      q=(e.type==="audio"?audioQ(e.say):`<div class="q">${esc(e.q).replace("___",'<b>___</b>')}</div>`)+`<div class="choices">${e.o.map(o=>{let c="";if(done){if(o===e.a)c=" right";else if(o===GS.ans)c=" wrong"}return `<button class="btn${c}" data-o="${esc(o)}" ${done?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`;
    }else{
      const [pre,post]=e.q.split("___");const w=Math.max(8,Math.max(...e.a.map(a=>a.length))+2);
      q=`<div class="q">${esc(pre)}<input type="text" id="gin" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" ${done?"disabled":""} aria-label="Ответ">${esc(post)}</div>
      ${done?"":`<div class="row"><button class="btn primary" id="gchk">Проверить</button><button class="btn ghost" id="gidk">Не знаю</button></div>`}`;
    }
    let fb="";
    if(done){
      const ok=GS.ok;
      const tp=ok&&GS.cres&&GS.cres.status==="typo";
      fb=`<div class="verdict ${tp?"warn":ok?"ok":"bad"}">${tp?"Верно, но с опечаткой":ok?"Верно":"Не совсем"}${(!ok||tp)&&!e.o?` <span>Правильно: <b>${esc(e.a[0])}</b>${GS.ans?` · у тебя: ${esc(GS.ans)}`:""}</span>`:""}</div>
      ${GS.ans&&GS.cres&&GS.cres.status!=="ok"?issuesHTML(GS.cres,false):""}
      <div class="why">${esc(e.why)}</div>
      <div class="row"><button class="btn primary" id="gnext">${GS.i+1<GS.items.length?"Дальше":"Результат"}</button>${e.type==="audio"?sayBtn(e.say):/[а-яё]/i.test(e.q.replace(/\([^)]*\)/g,""))?"":sayBtn(e.q.replace(/___\s*\([^)]*\)|___/,e.o?(e.a==="—"?"":e.a):e.a[0]).replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim(),"Озвучить предложение")}</div>`;
    }
    V.innerHTML=`${back}<div class="row" style="justify-content:space-between;margin:8px 0 10px"><h2 style="margin:0">${esc(l.title)}${GS.review?" · повторение правила":GS.retry?" · работа над ошибками":""}</h2><span class="small muted">${GS.i+1} / ${GS.items.length}</span></div>
    <div class="progress" style="margin-bottom:16px"><i style="width:${GS.i/GS.items.length*100}%"></i></div>
    <div class="card">${q}${fb}<div class="row"><button class="btn ghost small" data-rule-open="${l.id}">Правило и подробный разбор</button></div></div>`;
    if(e.type==="audio"&&!done&&GS.said!==GS.i){GS.said=GS.i;speak(e.say)}
    const gin=$("#gin");
    if(gin&&!done){gin.focus();gin.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();answerG(gin.value.trim())}}}
    const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
    on("gchk",()=>answerG(gin.value.trim()));on("gidk",()=>answerG(""));
    V.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answerG(b.dataset.o));
    on("gnext",()=>{GS.i++;GS.ans=null;if(GS.i>=GS.items.length)GS.stage="end";renderLesson()});
    const nx=$("#gnext");if(nx)nx.focus();
  }else{
    const t=GS.items.length;
    if(!GS.retry){const prev=S.lessons[l.id];S.lessons[l.id]={best:Math.max(GS.right,prev?prev.best:0),total:t,last:dkey()};S.rrev=S.rrev||{};if(!S.rrev[l.id])S.rrev[l.id]={st:0,due:Date.now()+RREV_DAYS[0]*DAY-3*3600e3};save()}
    if(GS.review&&!GS.revDone){GS.revDone=true;const rv=(S.rrev=S.rrev||{})[l.id]||{st:0};const pass=GS.right>=Math.ceil(t*0.75);
      if(pass){rv.st=Math.min(rv.st+1,RREV_DAYS.length-1);rv.due=Date.now()+RREV_DAYS[rv.st]*DAY-3*3600e3;GS.revMsg=`Правило держится! Следующее повторение через ${fmtDays(RREV_DAYS[rv.st])}.`}
      else{rv.st=0;rv.due=Date.now()+DAY-3*3600e3;GS.revMsg="Правило немного подзабылось. Перечитай его (кнопка ниже) — повторим завтра."}
      rv.last=dkey();S.rrev[l.id]=rv;save()}
    const pct=GS.right/t;
    const nextRev=GS.review?dueRules().find(x=>x.id!==l.id):null;
    if(GS.review){V.innerHTML=`${back}`+resultHTML({title:"Повторение: "+l.title,right:GS.right,total:t,note:GS.revMsg,
      buttons:`${nextRev?`<button class="btn primary" id="nrev">Следующее правило: ${esc(nextRev.l.title)}</button>`:""}<button class="btn" data-rule-open="${l.id}">Правило</button><a class="btn ghost" href="#today">На главную</a>`});
      const nr=$("#nrev");if(nr)nr.onclick=()=>startRuleReview(nextRev.id);$("#back").onclick=()=>{GS=null;viewGrammar()};return}
    V.innerHTML=`${back}`+resultHTML({title:l.title,right:GS.right,total:t,note:pct===1?"Правило усвоено — вернись к нему через несколько дней.":pct>=.7?"Пройди ошибки ещё раз, пока свежо.":"Перечитай правило и попробуй снова — понимание приходит со второго-третьего раза.",
      buttons:`${GS.wrong.length?`<button class="btn primary" id="retry">Повторить ошибки (${GS.wrong.length})</button>`:""}<button class="btn" id="again">Пройти заново</button><button class="btn ghost" id="list">К урокам</button>`});
    const r=$("#retry");if(r)r.onclick=()=>openLesson(l.id,shuffle(GS.wrong));
    $("#again").onclick=()=>openLesson(l.id);$("#list").onclick=()=>{GS=null;viewGrammar()};
  }
  $("#back").onclick=()=>{GS=null;viewGrammar()};
}
function answerG(v){
  const e=GS.l.ex[GS.items[GS.i]];
  let cres=null;if(!e.o&&v){cres=check(v,e.a)}
  const ok=e.o?v===e.a:!!v&&cres&&cres.status!=="bad";GS.cres=cres;
  GS.ans=v;GS.ok=ok;if(ok)GS.right++;else GS.wrong.push(GS.items[GS.i]);
  mistake("grammar",GS.l.id+":"+GS.items[GS.i],ok,v,{t:GS.l.id,l:GS.l.lvl});
  bump(ok,GS.l.lvl);renderLesson();
}

/* ---------- ПОВТОРЕНИЕ ПРАВИЛ ПО РАСПИСАНИЮ ---------- */
const RREV_DAYS=[3,7,21,60];
function fmtDays(d){return d<14?d+" "+plural(d,["день","дня","дней"]):d<60?Math.round(d/7)+" "+plural(Math.round(d/7),["неделю","недели","недель"]):Math.round(d/30)+" "+plural(Math.round(d/30),["месяц","месяца","месяцев"])}
function dueRules(){const now=Date.now();return Object.entries(S.rrev||{}).map(([id,r])=>({id,r,l:LESSONS.find(x=>x.id===id)})).filter(x=>x.l&&x.r.due<=now).sort((a,b)=>a.r.due-b.r.due)}
function startRuleReview(id){const l=LESSONS.find(x=>x.id===id);if(!l)return;location.hash="#grammar";
  setTimeout(()=>{openLesson(id,shuffle(l.ex.map((_,i)=>i)).slice(0,Math.min(4,l.ex.length)),{review:true});window.scrollTo(0,0)},0)}
document.addEventListener("click",e=>{const a=e.target.closest("[data-rrev]");if(a){e.preventDefault();startRuleReview(a.dataset.rrev)}});
function migrateRrev(){S.rrev=S.rrev||{};let ch=false;for(const id of Object.keys(S.lessons||{})){if(!S.rrev[id]){const last=S.lessons[id].last?new Date(S.lessons[id].last+"T12:00:00").getTime():Date.now();S.rrev[id]={st:0,due:last+RREV_DAYS[0]*DAY};ch=true}}if(ch)save()}

/* ---------- TRANSLATE ---------- */
let TS=null;
function startTranslate(){
  const L=T();const order=SENTENCES.map((s,i)=>({s,i})).filter(x=>li(x.s.l)<=li(L)).map(({s,i})=>{const r=S.tr[i]||{n:0,ok:0};return{i,k:(r.n?r.ok/r.n:0.4)+(r.n?0:-0.2)+Math.random()*0.6+(s.l===L?-0.35:0.1)}}).sort((a,b)=>a.k-b.k).slice(0,10).map(x=>x.i);
  TS={items:order,i:0,right:0,res:null};
}
function viewTranslate(){if(!TS)startTranslate();renderTr()}
function renderTr(){
  if(TS.i>=TS.items.length){
    V.innerHTML=resultHTML({title:"Перевод фраз",right:TS.right,total:TS.items.length,note:"Фразы с ошибками будут попадаться чаще, пока не станут лёгкими.",buttons:`<button class="btn primary" id="again">Ещё 10 фраз</button><a class="btn" href="#today">На главную</a>`});
    $("#again").onclick=()=>{startTranslate();renderTr()};return;
  }
  const s=SENTENCES[TS.items[TS.i]],vars=s.en.flatMap(expand),r=TS.res,tiles=!r&&trTiles();
  if(tiles&&TS.tilesFor!==TS.i+":"+TS.items[TS.i]){TS.tilesFor=TS.i+":"+TS.items[TS.i];
    const words=vars[0].replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean),low=words.map(x=>x.toLowerCase());
    const other=shuffle(SENTENCES.filter(x=>x!==s&&li(x.l)<=li(s.l)+1).flatMap(x=>expand(x.en[0])[0].replace(/[.,!?]/g,"").split(/\s+/))).filter(x=>!low.includes(x.toLowerCase()));
    const extra=[...new Set(other)].slice(0,2);TS.tiles={pool:shuffle(words.concat(extra)).map(w=>({w,u:false})),pick:[]}}
  let fb="";
  if(r){
    const others=vars.filter(v=>v!==r.best).slice(0,3);
    fb=r.status==="ok"?`<div class="verdict ok">Верно${r.aiOk?" <span>· ИИ засчитал твой вариант</span>":""}</div>`:r.status==="typo"?`<div class="verdict warn">Верно, только опечатка <span>· засчитано</span></div>`:`<div class="verdict bad">Чуть-чуть не так</div>`;
    if(r.status!=="ok"&&r.user)fb+=issuesHTML(r,true);
    if(r.status==="bad"&&r.user)fb+=`<div><div class="label" style="margin-bottom:4px">Сравнение с ближайшим вариантом</div><div class="diff">${wordDiff(r.user,r.best)}</div><div class="small muted">Жёлтым — чего не хватает, зачёркнуто — лишнее.</div></div>`;
    fb+=`<div><div class="label" style="margin-bottom:4px">Правильно</div><div class="answer"><span style="font-size:19px;font-weight:500">${esc(r.best)}</span>${sayBtn(r.best)}</div>${others.length?`<div class="small muted" style="margin-top:6px">Тоже верно:</div><ul class="variants">${others.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`:""}</div>`;
    if(s.note)fb+=`<div class="note">${esc(s.note)}</div>`;
    if(r.status!=="ok"&&r.user&&canOpenGemini())fb+=`<div class="row">${gemBtn("tr","Спросить в Gemini","")}</div>`;
    if(validTopic(s.t))fb+=`<div class="row"><button class="btn ghost small" data-rule-open="${s.t}">Правило: ${esc(topicName(s.t))}</button></div>`;
    if(r.ai)fb+=aiTrBlock(r.ai);
    else if(r.status==="bad"&&r.user&&!AI.off)fb+=`<div class="row"><button class="btn" id="tai" ${TS.aiBusy?"disabled":""}>${TS.aiBusy?"ИИ проверяет…":"Мой вариант тоже верен? Спросить ИИ"}</button></div>${TS.aiErr?`<div class="small bad-t">${esc(TS.aiErr)}</div>`:""}`;
    fb+=`<div class="row"><button class="btn primary" id="tnext">${TS.i+1<TS.items.length?"Дальше":"Итог"}</button></div>`;
  }
  V.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h1>Перевод</h1><div class="row"><div class="seg" role="group" aria-label="Способ ответа"><button data-tm="tiles" aria-pressed="${trTiles()}">Из слов</button><button data-tm="type" aria-pressed="${!trTiles()}">Сам пишу</button></div><span class="small muted">${TS.i+1} / ${TS.items.length}</span></div></div>
  <div class="progress" style="margin-bottom:16px"><i style="width:${TS.i/TS.items.length*100}%"></i></div>
  <div class="card"><div class="label">Переведи на английский · ${s.l}${S.mist["tr:"+TS.items[TS.i]]&&!S.mist["tr:"+TS.items[TS.i]].done?" · была ошибка":""}</div><div class="prompt" style="font-size:clamp(21px,4.4vw,28px)">${esc(s.ru)}</div>
  ${!r?ruleHint(s.t):""}

/* ---------- READING ---------- */
let RS=null,RG={busy:false,err:"",topic:"",ctl:null};
const IRREG={went:"go",gone:"go",saw:"see",seen:"see",bought:"buy",was:"be",were:"be",is:"be",am:"be",are:"be",has:"have",had:"have",made:"make",took:"take",came:"come",thought:"think",ate:"eat",drank:"drink",slept:"sleep",told:"tell",said:"say",spoke:"speak",wrote:"write",knew:"know",felt:"feel",found:"find",brought:"bring",left:"leave",won:"win",lost:"lose",sent:"send",spent:"spend",chose:"choose"};
function lookup(raw){
  const w=raw.toLowerCase().replace(/^'+|'+$/g,"").replace(/'s$/,"");
  const c=[w,IRREG[w]];
  if(w.endsWith("ies"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("ied"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("es"))c.push(w.slice(0,-2));
  if(w.endsWith("s"))c.push(w.slice(0,-1));
  if(w.endsWith("ed")){c.push(w.slice(0,-2),w.slice(0,-1));if(/(.)\1ed$/.test(w))c.push(w.slice(0,-3))}
  if(w.endsWith("ing")){c.push(w.slice(0,-3),w.slice(0,-3)+"e");if(/(.)\1ing$/.test(w))c.push(w.slice(0,-4))}
  if(w.endsWith("ly"))c.push(w.slice(0,-2));
  const all=allWords();
  for(const x of c){if(!x)continue;const f=all.find(a=>a.en.toLowerCase()===x);if(f)return f}
  return null;
}
function allTexts(){return TEXTS.map((t,i)=>Object.assign({key:String(i)},t)).concat((S.genTexts||[]).map(t=>Object.assign({key:t.id},t))).concat(packTexts())}

function viewRead(){
  if(RS&&RS.key!=null&&textByKey(RS.key)){renderText();return}
  const L=T();

  V.innerHTML=`<h1>Чтение</h1><p class="sub">Тексты по уровням. Нажми на любое слово, чтобы увидеть перевод и услышать его. После текста — вопросы на понимание.</p>
  <div class="stack">
  ${AI.off?"":`<section class="sheet stack"><div><b>Новый текст от ИИ</b><p class="small muted" style="margin:2px 0 0">Напишет текст уровня ${L} на любую тему и вопросы к нему. Занимает 10–40 секунд.</p></div>
    <div class="row"><input type="text" id="gtopic" placeholder="Тема: футбол, космос, история Рима… (можно пусто)" value="${esc(RG.topic)}" style="flex:1;min-width:200px" ${RG.busy?"disabled":""}>

    ${RG.err?`<div class="verdict bad"><span>${esc(RG.err)}</span></div>`:""}</section>`}
  <div class="lessons">${order.map(t=>{const r=(S.read||{})[t.key];const cls=!r?"none":r.best===r.total?"good":"mid";

const SYNC={ref:null,state:"local",lastJSON:"",timer:null,writing:Promise.resolve()};
function mergeState(a,b){
  const newer=(b.updatedAt||0)>(a.updatedAt||0)?b:a,older=newer===a?b:a;
  if((newer.resetAt||0)>(older.updatedAt||0))return Object.assign({},DEF,newer);
  const out=JSON.parse(JSON.stringify(newer));
  const pick=(x,y,better)=>{const r=Object.assign({},x||{});for(const k in (y||{})){if(!(k in r)||better(y[k],r[k]))r[k]=y[k]}return r};
  const byUpd=(o,n)=>(o.upd||0)>(n.upd||0);
  out.cards=pick(newer.cards,older.cards,byUpd);
  out.mist=pick(newer.mist,older.mist,byUpd);
  out.days=pick(newer.days,older.days,(o,n)=>(o.n||0)>(n.n||0));
  out.lessons=pick(newer.lessons,older.lessons,(o,n)=>(o.best||0)>(n.best||0));
  out.read=pick(newer.read,older.read,(o,n)=>(o.best||0)>(n.best||0));
  out.tr=pick(newer.tr,older.tr,(o,n)=>(o.n||0)>(n.n||0));
  out.packs=Object.assign({},older.packs||{},newer.packs||{});
  out.readRules=Object.assign({},older.readRules||{},newer.readRules||{});
  out.rrev=pick(newer.rrev,older.rrev,(o,n)=>(o.last||"")>(n.last||""));
  out.course=pick(newer.course,older.course,(o,n)=>(o.right||0)>(n.right||0));
  out.verbs=pick(newer.verbs,older.verbs,(o,n)=>(o.n||0)>(n.n||0));
  out.sets=Object.assign({},older.sets||{},newer.sets||{});
  const del=new Set([...(newer.deleted||[]),...(older.deleted||[])]);out.deleted=[...del].slice(-500);
  const union=(x,y,key)=>{const m=new Map();for(const it of [...(y||[]),...(x||[])])m.set(it[key],it);return [...m.values()]};
  out.custom=union(newer.custom,older.custom,"id").filter(c=>!del.has(c.id));
  out.genTexts=union(newer.genTexts,older.genTexts,"id").filter(t=>!del.has(t.id)).slice(-15);
  out.writings=union(newer.writings,older.writings,"date").sort((p,q)=>p.date-q.date).slice(-10);
  out.frozen=[...new Set([...(newer.frozen||[]),...(older.frozen||[])])].slice(-60);
  out.totalAns=Math.max(newer.totalAns||0,older.totalAns||0);
  return Object.assign({},DEF,out,{settings:Object.assign({},DEF.settings,out.settings||{})});
}
function syncLabel(){return{local:window.__NATIVE_APP?"Прогресс хранится на этом телефоне. Перенести его можно в «Профиль → Настройки»":"Прогресс хранится только в этом браузере",loading:"Подключаюсь к аккаунту…",synced:"Прогресс сохранён в аккаунте claude.ai и одинаков на всех устройствах",offline:"Нет связи с аккаунтом, прогресс пока сохраняется в браузере",error:"Не удалось сохранить в аккаунт, прогресс пока сохраняется в браузере"}[SYNC.state]}

async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;

  try{

    r.errors=Array.isArray(r.errors)?r.errors.filter(e=>e&&e.wrong&&e.right).slice(0,8):[];
    r.tips=Array.isArray(r.tips)?r.tips.slice(0,3).map(String):[];

function chatRules(sc,L){
  const simple=li(L)<=1?" Use very simple words and short sentences. If the student seems lost, add a Russian hint in brackets.":"";
  return `You are role-playing for English conversation practice. Your role: ${sc.role}. The student is a native Russian speaker learning English, level ${L}.
Rules:
- Reply ONLY in English, 1–3 short sentences, vocabulary and grammar of level ${L}.${simple} End with a question or prompt so the conversation continues.
- If the student writes in Russian or doesn't know a word, gently give the English version.
- Before your reply, output exactly one service line about the student's LAST message:
FIX: <corrected version of the student's message> || <short explanation of the main mistake in Russian>
or, if the message has no real mistakes (or there is no student message yet):
FIX: ok
Then an empty line and your reply. Nothing else.
Start now with your first line in the role (FIX: ok).`;
}
function parseChat(raw){
  const m=raw.match(/^\s*FIX:\s*(.*)$/m);let fix=null,body=raw;
  if(m){body=raw.slice(m.index+m[0].length).trim();const v=m[1].trim();if(v&&!/^ok\.?$/i.test(v)){const [c,e]=v.split("||");if(c&&c.trim())fix={right:c.trim(),why:(e||"").trim()}}}
  else if(/^\s*FIX/.test(raw))body="";
  return{fix,body};
}
async function chatCall(){
  const C=PR.chat;C.busy=true;C.err="";const sc=(C.scene||SCENES.find(s=>s.id===C.sc));
  const input=[{role:"user",content:chatRules(sc,C.L)}].concat(C.turns.slice(-16));
  const bubble={role:"assistant",text:"",raw:""};C.msgs.push(bubble);C.ctl=new AbortController();renderChatLog();
  try{
    const {text}=await aiText(input,{cache:false,modelTier:"quick",signal:C.ctl.signal,onText:({text})=>{bubble.text=parseChat(text).body;renderChatLog(true)}});
    const p=parseChat(text);bubble.text=p.body||text;bubble.raw=text;C.turns.push({role:"assistant",content:text});
    const lastUser=[...C.msgs].reverse().find(m=>m.role==="user");
    if(p.fix&&lastUser&&norm(p.fix.right)!==norm(lastUser.text)){lastUser.fix=p.fix;aiMistake(lastUser.text,p.fix.right,p.fix.why,null,lastUser.text,"chat")}
    if(lastUser)bump(!lastUser.fix,C.L);
  }catch(e){C.msgs.pop();C.err=aiErr(e);if(C.turns.length&&C.turns[C.turns.length-1].role==="user"&&e&&e.code==="cancelled"){}}
  C.busy=false;renderChatLog();
}
